<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounts · Ethiopia</title>
<script src="assets/session.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=4">
<style>
/* The register of a nation, set like one: names down a ruled page, figures
   in the margin. The shared theme draws the masthead, section heads and
   buttons; this page adds the standings, the register rows and the record. */
.topbar{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
.topbar .spacer{ margin-left:auto; }
.back{ text-decoration:none; }
.mine{ display:inline-flex; align-items:center; gap:.45rem; text-decoration:none; color:var(--text);
  font-weight:600; font-size:.86rem; padding:.4rem .75rem .4rem .45rem; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); }
.mine:hover{ border-color:var(--gold); }
.mine img{ width:22px; height:22px; border-radius:4px; image-rendering:pixelated; }

/* --- the nation today ----------------------------------------------------- */
.today{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border:1px solid var(--line);
  border-radius:var(--r-md); background:var(--surface); overflow:hidden; }
.today div{ padding:.85rem 1rem; border-right:1px solid var(--line); }
.today div:last-child{ border-right:0; }
.today b{ display:block; font-family:var(--data); font-size:1.35rem; font-weight:600; font-variant-numeric:tabular-nums; }
.today span{ font-size:.8rem; color:var(--text-low); }
.today .gold b{ color:var(--gold); }
@media (max-width:640px){ .today{ grid-template-columns:1fr 1fr; } .today div:nth-child(2){ border-right:0; }
  .today div:nth-child(-n+2){ border-bottom:1px solid var(--line); } }
.fresh{ font-size:.8rem; color:var(--text-low); margin:.5rem 0 0; line-height:1.5; }
.fresh.bad{ color:var(--red); }

/* --- standings ------------------------------------------------------------ */
.tabs{ display:flex; gap:.3rem; flex-wrap:wrap; margin-bottom:.9rem; }
.tabs button{ font-family:var(--body); font-weight:600; font-size:.82rem; padding:.4rem .8rem; border-radius:999px;
  border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--text-mid); cursor:pointer; }
.tabs button:hover{ color:var(--text); border-color:var(--line-hot); }
.tabs button.on{ background:var(--tc, var(--gold)); border-color:var(--tc, var(--gold)); color:#141006; }
.podium{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.6rem; margin-bottom:.6rem; }
.pod{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:.3rem;
  padding:1rem .7rem .85rem; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface);
  cursor:pointer; min-width:0; }
.pod:hover{ border-color:var(--tc, var(--gold)); }
.pod.first{ border-color:color-mix(in srgb, var(--tc, var(--gold)) 55%, var(--line));
  background:linear-gradient(180deg, color-mix(in srgb, var(--tc, var(--gold)) 12%, transparent), transparent 75%), var(--surface); }
.pod .place{ position:absolute; top:.5rem; left:.65rem; font-family:var(--data); font-size:.72rem; color:var(--text-low); }
.pod img{ width:44px; height:44px; border-radius:6px; image-rendering:pixelated; background:var(--ink-high); }
.pod.first img{ width:56px; height:56px; }
.pod .nm{ font-weight:700; font-size:.92rem; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pod .sb{ font-size:.74rem; color:var(--text-low); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pod .v{ font-family:var(--data); font-weight:600; font-size:1rem; color:var(--tc, var(--gold)); }
@media (max-width:560px){ .podium{ grid-template-columns:1fr; } .pod{ flex-direction:row; text-align:left; padding:.6rem .8rem; }
  .pod .place{ position:static; } .pod .who2{ flex:1 1 auto; min-width:0; } .pod img, .pod.first img{ width:36px; height:36px; } }
.ranked{ border-top:1px solid var(--line); }

/* --- register rows ---------------------------------------------------------- */
.row{ display:grid; grid-template-columns:2.2rem 30px minmax(0,1fr) auto auto; align-items:center; gap:.7rem;
  padding:.55rem .4rem; border-bottom:1px solid var(--line); cursor:pointer; }
.row:hover{ background:rgba(255,255,255,.025); }
.row .rk{ font-family:var(--data); font-size:.74rem; color:var(--text-low); text-align:right; font-variant-numeric:tabular-nums; }
.row img{ width:30px; height:30px; border-radius:5px; image-rendering:pixelated; background:var(--ink-high); }
.row .nm{ font-weight:600; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .sb{ font-size:.76rem; color:var(--text-low); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .tg{ display:flex; gap:.25rem; }
.row .v{ font-family:var(--data); font-size:.86rem; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; min-width:4.5rem; }
.chip{ font-size:.68rem; font-weight:600; padding:.1rem .45rem; border-radius:999px; border:1px solid var(--line);
  color:var(--text-low); white-space:nowrap; }
.chip.may{ color:var(--gold); border-color:color-mix(in srgb, var(--gold) 45%, transparent); }
.chip.on{ color:var(--green); border-color:color-mix(in srgb, var(--green) 45%, transparent); }
.chip.no{ border-style:dashed; }
.chip.warn{ color:var(--red); border-color:color-mix(in srgb, var(--red) 45%, transparent); }
@media (max-width:560px){ .row{ grid-template-columns:30px minmax(0,1fr) auto; } .row .rk, .row .tg{ display:none; } }
.v.g{ color:var(--gold); } .v.gr{ color:var(--green); } .v.r{ color:var(--red); }

.tools{ display:grid; grid-template-columns:minmax(0,1fr) 11rem 11rem; gap:.5rem; margin-bottom:.6rem; }
@media (max-width:640px){ .tools{ grid-template-columns:1fr 1fr; } .tools .q{ grid-column:1 / -1; } }
.tools input, .tools select{ width:100%; background:rgba(0,0,0,.3); color:var(--text); border:1px solid var(--line);
  border-radius:9px; padding:.55rem .7rem; font-family:var(--body); font-size:.9rem; }
.tools input:focus, .tools select:focus{ border-color:var(--gold); outline:none; }
.pager{ display:flex; gap:.4rem; align-items:center; margin-top:.9rem; flex-wrap:wrap; }
.pager .where{ font-size:.8rem; color:var(--text-low); margin-left:.3rem; }
.sub-h{ font-size:.8rem; font-weight:600; color:var(--text-low); margin:1.2rem 0 .3rem; }

/* --- one person ------------------------------------------------------------- */
.backbar{ display:flex; align-items:center; gap:.6rem; margin-bottom:1rem; flex-wrap:wrap; }
.hero{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:1.1rem; align-items:center; margin-bottom:1.4rem; }
.hero img.face{ width:88px; height:88px; border-radius:10px; image-rendering:pixelated; background:var(--ink-high);
  box-shadow:0 10px 30px rgba(0,0,0,.45); }
.hero h1{ font-size:clamp(1.6rem, 4vw, 2.4rem); margin:0; letter-spacing:-.02em; overflow-wrap:anywhere; }
.hero .id{ font-size:.84rem; color:var(--text-low); margin:.25rem 0 .5rem; overflow-wrap:anywhere; }
.hero .chips{ display:flex; gap:.3rem; flex-wrap:wrap; }
.hero .chips .chip{ font-size:.72rem; }
.chip.party{ color:var(--pc, var(--text-mid)); border-color:var(--pc, var(--line)); }
.chip.tier{ color:var(--gold); border-color:color-mix(in srgb, var(--gold) 45%, transparent); }

.rec{ display:grid; grid-template-columns:repeat(auto-fit, minmax(17rem, 1fr)); gap:.8rem; align-items:start; }
.box{ border:1px solid var(--line); border-top:2px solid var(--bc, var(--line)); border-radius:var(--r-md);
  background:var(--surface); padding:1rem 1.1rem; }
.box h2{ font-size:1rem; margin:0 0 .7rem; }
.box.g{ --bc:var(--green); } .box.y{ --bc:var(--gold); } .box.b{ --bc:var(--blue); } .box.r{ --bc:var(--red); }
.box.wide{ grid-column:1 / -1; }
.kv{ display:flex; justify-content:space-between; gap:1rem; padding:.42rem 0; border-bottom:1px solid var(--line); font-size:.86rem; }
.kv:last-child{ border-bottom:0; }
.kv span:first-child{ color:var(--text-low); }
.kv span:last-child{ font-family:var(--data); font-size:.82rem; text-align:right; font-variant-numeric:tabular-nums; }
.figs{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.5rem; margin-bottom:.8rem; }
.figs div{ border-radius:9px; background:rgba(0,0,0,.25); padding:.55rem .65rem; }
.figs b{ display:block; font-family:var(--data); font-size:1.1rem; }
.figs span{ font-size:.74rem; color:var(--text-low); }
.clock{ height:6px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; margin:.5rem 0 .25rem; }
.clock i{ display:block; height:100%; border-radius:999px; }
.small{ font-size:.78rem; color:var(--text-low); line-height:1.5; margin:.3rem 0 0; }
table.t{ width:100%; border-collapse:collapse; }
table.t td{ padding:.45rem .3rem; border-bottom:1px solid var(--line); font-size:.84rem; vertical-align:top; }
table.t td.n{ text-align:right; font-family:var(--data); font-size:.8rem; white-space:nowrap; }
table.t td.d{ color:var(--text-low); font-family:var(--data); font-size:.74rem; white-space:nowrap; width:1%; }
table.t tr:last-child td{ border-bottom:0; }
.st{ font-size:.68rem; font-weight:600; padding:.08rem .4rem; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
.st.paid, .st.done{ color:var(--green); border-color:color-mix(in srgb, var(--green) 45%, transparent); }
.st.active, .st.claimed{ color:var(--blue); border-color:color-mix(in srgb, var(--blue) 45%, transparent); }
.st.cancelled{ color:var(--text-low); border-style:dashed; }
.more{ margin-top:.6rem; }
.town{ border-radius:9px; background:rgba(0,0,0,.22); padding:.65rem .75rem; margin-bottom:.5rem; }
.town:last-child{ margin-bottom:0; }
.town .h{ display:flex; gap:.5rem; align-items:baseline; }
.town .h b{ font-size:.95rem; }
.town .h span{ margin-left:auto; font-size:.74rem; color:var(--text-low); }
.town .l{ font-size:.8rem; color:var(--text-mid); margin-top:.25rem; }
.ok{ color:var(--green); } .bad{ color:var(--red); }
.note-box{ margin-top:.6rem; padding:.6rem .7rem; border-radius:9px; background:rgba(0,0,0,.25); font-size:.85rem; color:var(--text-mid); }
.empty{ padding:1.3rem; text-align:center; }
footer{ margin-top:3rem; padding-top:1rem; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="flag-edge" aria-hidden="true"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="index.html">&#8592; Home</a>
    <span class="spacer"></span>
    <span id="authSlot"></span>
  </div>

  <div id="body"><p class="empty">Loading…</p></div>

  <footer><span>Ethiopia</span><span id="stamp">&nbsp;</span></footer>
</div>

<script>
'use strict';
var API = 'https://earthmc-ethiopia-proxy.ethiopianempire2.workers.dev';
var DAY = 86400000;
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
var num = function(n){ return (Number(n) || 0).toLocaleString('en-US'); };
var gold = function(n){ return num(n) + 'g'; };
var toMs = function(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v > 1e12 ? v : v * 1000;
  var t = Date.parse(String(v) + (/[Zz]|[+-]\d{2}:?\d{2}$|^\d+$/.test(String(v)) || String(v).length <= 10 ? '' : 'Z'));
  return isFinite(t) ? t : (isFinite(Number(v)) ? toMs(Number(v)) : null);
};
var dateOf = function(v){
  var t = toMs(v);
  return t === null ? '—' : new Date(t).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
};
var ago = function(v){
  var t = toMs(v);
  if (t === null) return 'never';
  var d = Math.floor((Date.now() - t) / DAY);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + 'd ago';
};
var hoursAgo = function(v){
  var t = toMs(v);
  if (t === null) return null;
  return (Date.now() - t) / 3600000;
};
var face = function(name, size){
  return name ? 'https://minotar.net/helm/' + encodeURIComponent(name) + '/' + (size || 32) + '.png' : '';
};
var faceImg = function(name, size, cls){
  return '<img' + (cls ? ' class="' + cls + '"' : '') + ' src="' + face(name, size) + '" alt="" loading="lazy" ' +
    'onerror="this.style.visibility=\'hidden\'">';
};

async function api(path, opts){
  var res = await fetch(API + path, Object.assign({ credentials:'include' }, opts || {}));
  var d = null;
  try { d = await res.json(); } catch (e) {}
  if (!res.ok){ var err = new Error((d && (d.detail || d.error)) || ('HTTP ' + res.status)); err.status = res.status; throw err; }
  return d;
}

var me = null, now = null, boards = null, reg = null, extras = [];
/* The list's place — search, order, town, page and scroll — is kept in the
   history entry, so going back from someone's record lands exactly where you
   left, whether by the back button or the "All accounts" link. */
var L = { q: '', sort: 'balance', town: '', page: 0, tab: 'richest', scroll: 0 };
var PAGE = 25;
var isManager = function(){ return !!(me && me.signedIn && me.tier === 'manager'); };
var rowCache = new Map();   // name or discord id -> the register row, so a click can open without a second request

/* ======================================================================= */
/* THE LIST                                                                 */
/* ======================================================================= */

/* What the nation is right now: the same four figures, from the same place, as
   the home page and Growth. */
function renderToday(){
  if (!now) return '';
  var lv = now.live, ro = now.roster;
  var out = lv
    ? '<div class="today">' +
        '<div><b>' + num(lv.residents) + '</b><span>citizens</span></div>' +
        '<div><b>' + num(lv.towns) + '</b><span>towns</span></div>' +
        '<div><b>' + num(lv.chunks) + '</b><span>chunks claimed</span></div>' +
        '<div class="gold"><b>' + gold(lv.balance) + '</b><span>in the nation bank</span></div>' +
      '</div>'
    : '<p class="fresh bad">The live figures could not be read from EarthMC just now' +
        (now.liveError ? ' (' + esc(now.liveError) + ')' : '') + '.</p>';
  if (ro){
    var h = hoursAgo(ro.sweptAt);
    out += '<p class="fresh' + (ro.stale ? ' bad' : '') + '">' +
      'The register below lists ' + num(ro.people) + ' people, as of the last sweep ' +
      (h === null ? '(never run)' : h < 1.5 ? 'about an hour ago' : h < 48 ? Math.round(h) + ' hours ago' : Math.round(h / 24) + ' days ago') +
      (ro.stale
        ? ' — that is too old: the sweep has stopped, so the register and the standings are frozen at that moment ' +
          'and will not match the live count above.'
        : (lv && ro.people !== lv.residents ? ', so it can differ from the live count by whoever came or went since.' : '.')) +
      '</p>';
  }
  return out;
}

/* Standings: one question at a time, with the top three set apart. */
var TABS = [
  { k:'richest', label:'Richest', c:'var(--gold)', cap:'gold held right now',
    v: function(r){ return gold(r.balance); }, sb: function(r){ return r.town; } },
  { k:'donors', label:'Most generous', c:'var(--gold)', cap:'given to the treasury',
    v: function(r){ return gold(r.total); }, sb: function(r){ return r.gifts + (r.gifts === 1 ? ' gift' : ' gifts'); } },
  { k:'active', label:'Most active', c:'var(--green)', cap:'most recently in game',
    v: function(r){ return ago(r.last_online); }, sb: function(r){ return r.town; } },
  { k:'quiet', label:'Close to the purge', c:'var(--red)', cap:'still here, but nearest the 42 days with no login',
    v: function(r){ var t = toMs(r.last_online); return t === null ? '—' : Math.max(0, 42 - Math.floor((Date.now() - t) / DAY)) + 'd left'; },
    sb: function(r){ return r.town; } },
  { k:'oldest', label:'Longest here', c:'var(--blue)', cap:'first seen in the nation',
    v: function(r){ return dateOf(r.first_seen); }, sb: function(r){ return r.town; } },
  { k:'newest', label:'Newest', c:'var(--blue)', cap:'most recently arrived',
    v: function(r){ return dateOf(r.first_seen); }, sb: function(r){ return r.town; } },
  { k:'towns', label:'Biggest towns', c:'var(--green)', cap:'by residents',
    v: function(r){ return num(r.residents) + ' res'; },
    sb: function(r){ return num(r.chunks) + (r.max_chunks ? '/' + num(r.max_chunks) : '') + ' chunks'; } },
];
function boardName(r){ return r.name || r.player_name || r.mc_name || r.discord_name || '—'; }

function renderStandings(){
  if (!boards || !boards.boards) return '';
  var b = boards.boards;
  var tabs = TABS.filter(function(t){ return Array.isArray(b[t.k]) && b[t.k].length; });
  if (!tabs.length) return '';
  var t = tabs.filter(function(x){ return x.k === L.tab; })[0] || tabs[0];
  var rows = b[t.k].slice(0, 10);
  var isTown = t.k === 'towns';
  var openAttr = function(r){
    if (isTown) return ' data-town="' + esc(r.name) + '"';
    var id = r.discord_id || r.discordId;
    return id ? ' data-discord="' + esc(id) + '"' : ' data-player="' + esc(boardName(r)) + '"';
  };
  var out = '<div class="section-head"><h2>Standings</h2><span class="meta">' + esc(t.cap) + '</span></div>' +
    '<div class="tabs" role="tablist">' + tabs.map(function(x){
      return '<button type="button" role="tab" data-tab="' + x.k + '" class="' + (x.k === t.k ? 'on' : '') +
        '" style="--tc:' + x.c + '" aria-selected="' + (x.k === t.k) + '">' + esc(x.label) + '</button>';
    }).join('') + '</div>';
  out += '<div class="podium" style="--tc:' + t.c + '">' + rows.slice(0, 3).map(function(r, i){
    var nm = isTown ? r.name : boardName(r);
    return '<div class="pod' + (i === 0 ? ' first' : '') + '"' + openAttr(r) + '>' +
      '<span class="place">' + (i + 1) + '</span>' +
      (isTown ? '' : faceImg(nm, 64)) +
      '<span class="who2"><span class="nm" style="display:block">' + esc(nm) + '</span>' +
      '<span class="sb" style="display:block">' + esc(t.sb(r) || '') + '</span></span>' +
      '<span class="v">' + t.v(r) + '</span></div>';
  }).join('') + '</div>';
  if (rows.length > 3){
    out += '<div class="ranked">' + rows.slice(3).map(function(r, i){
      var nm = isTown ? r.name : boardName(r);
      return '<div class="row"' + openAttr(r) + '><span class="rk">' + (i + 4) + '</span>' +
        (isTown ? '<span></span>' : faceImg(nm, 30)) +
        '<span><span class="nm" style="display:block">' + esc(nm) + '</span>' +
        '<span class="sb" style="display:block">' + esc(t.sb(r) || '') + '</span></span><span class="tg"></span>' +
        '<span class="v" style="color:' + t.c + '">' + t.v(r) + '</span></div>';
    }).join('') + '</div>';
  }
  return out;
}

function regRow(c){
  var key = c.discordId || ('p:' + c.name);
  rowCache.set(key, c);
  var t = toMs(c.lastOnline);
  var idle = t === null ? null : Math.floor((Date.now() - t) / DAY);
  var chips = '';
  if (c.isMayor) chips += '<span class="chip may">mayor</span>';
  if (idle !== null && idle < 1) chips += '<span class="chip on">on today</span>';
  if (idle !== null && idle >= 35 && idle < 42) chips += '<span class="chip warn">' + (42 - idle) + 'd left</span>';
  if (!c.discordId) chips += '<span class="chip no">no account</span>';
  var v = L.sort === 'active' ? '<span class="v gr">' + ago(c.lastOnline) + '</span>'
    : (L.sort === 'oldest' || L.sort === 'newest') ? '<span class="v">' + dateOf(c.firstSeen) + '</span>'
    : '<span class="v g">' + (c.balance == null ? '—' : gold(c.balance)) + '</span>';
  var sub = [c.town, L.sort === 'active' ? null : 'seen ' + ago(c.lastOnline), c.discordName ? '@' + c.discordName : null]
    .filter(Boolean).map(esc).join(' · ');
  return '<div class="row"' + (c.discordId ? ' data-discord="' + esc(c.discordId) + '"' : ' data-player="' + esc(c.name) + '"') + '>' +
    '<span class="rk">' + (c.rank || '') + '</span>' + faceImg(c.name, 30) +
    '<span><span class="nm" style="display:block">' + esc(c.name) + '</span><span class="sb" style="display:block">' + (sub || '&nbsp;') + '</span></span>' +
    '<span class="tg">' + chips + '</span>' + v + '</div>';
}

function renderRegister(){
  var out = '<div class="section-head"><h2>Everyone</h2><span class="meta">' +
    (reg ? num(reg.total) + (reg.total === reg.population ? ' people' : ' of ' + num(reg.population)) : '') + '</span></div>' +
    '<div class="tools">' +
      '<input class="q" id="rq" type="search" placeholder="Find someone — a name, or part of one" value="' + esc(L.q) + '" autocomplete="off" aria-label="Search">' +
      '<select id="rsort" aria-label="Order">' +
        [['balance','Richest first'],['active','Recently on'],['name','By name'],['town','By town'],['oldest','Longest here'],['newest','Newest']]
          .map(function(o){ return '<option value="' + o[0] + '"' + (L.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select>' +
      '<input id="rtown" placeholder="Any town" value="' + esc(L.town) + '" autocomplete="off" aria-label="Town">' +
    '</div>' +
    '<div id="regList">' + renderRegList() + '</div>';
  return out;
}

function renderRegList(){
  if (!reg) return '<p class="empty">Loading the register…</p>';
  var pages = Math.max(1, Math.ceil(reg.total / PAGE));
  var out = reg.citizens.length
    ? '<div>' + reg.citizens.map(regRow).join('') + '</div>' +
      '<div class="pager"><button class="btn" type="button" id="rprev"' + (L.page <= 0 ? ' disabled' : '') + '>Previous</button>' +
      '<button class="btn" type="button" id="rnext"' + (L.page + 1 >= pages ? ' disabled' : '') + '>Next</button>' +
      '<span class="where">Page ' + (L.page + 1) + ' of ' + pages + '</span></div>'
    : '<p class="empty">' + (L.q || L.town ? 'Nobody in the nation matches that.' : 'The register is empty — it fills on the next sweep.') + '</p>';
  /* Managers also find Discord accounts that are not in the nation, which the
     register (built from the nation itself) cannot list. */
  if (isManager() && L.q && extras.length){
    out += '<div class="sub-h">Discord accounts outside the nation</div>' + extras.map(function(p){
      return '<div class="row"' + (p.linked ? ' data-discord="' + esc(p.discordId) + '"' : '') + '><span class="rk"></span>' +
        faceImg(p.mcName, 30) + '<span><span class="nm" style="display:block">' + esc(p.mcName || p.discordName || '—') + '</span>' +
        '<span class="sb" style="display:block">' + esc([p.discordName ? '@' + p.discordName : null, p.mayorOf ? 'mayor of ' + p.mayorOf : p.town]
          .filter(Boolean).join(' · ') || ' ') + '</span></span>' +
        '<span class="tg">' + (p.linked ? '' : '<span class="chip no">cannot open</span>') + '</span><span class="v"></span></div>';
    }).join('');
  }
  return out;
}

function renderList(){
  var out = '<header class="masthead"><h1 data-slot="title">Accounts</h1>' +
    '<p class="sub" data-slot="subtitle">Everyone in the nation, and their record</p></header>';
  if (me && me.signedIn && me.discordId){
    out += '<p style="margin:-.6rem 0 1.2rem"><a class="mine" href="?discord=' + encodeURIComponent(me.discordId) + '" data-discord="' +
      esc(me.discordId) + '">' + (me.mcName ? faceImg(me.mcName, 32) : '') + 'Your record &#8594;</a></p>';
  }
  out += renderToday() + renderStandings() + renderRegister();
  $('body').innerHTML = out;
  wireList();
  if (window.ethiopiaPageText) window.ethiopiaPageText.reapply();
}

var regTimer = null, regSeq = 0;
async function loadRegister(){
  var seq = ++regSeq;
  var params = new URLSearchParams({ sort: L.sort, limit: String(PAGE), offset: String(L.page * PAGE) });
  if (L.q) params.set('q', L.q);
  if (L.town) params.set('town', L.town);
  try {
    var r = await api('/api/nation/citizens?' + params);
    if (seq !== regSeq) return;          // a newer search has been sent since
    reg = r;
    extras = [];
    if (isManager() && L.q){
      try {
        var p = await api('/api/people/search?limit=12&q=' + encodeURIComponent(L.q));
        var inReg = new Set(reg.citizens.map(function(c){ return String(c.name).toLowerCase(); }));
        extras = (p.people || []).filter(function(x){ return !x.mcName || !inReg.has(String(x.mcName).toLowerCase()); })
          .filter(function(x){ return !x.town || x.town !== null; });
      } catch (_e) { extras = []; }
    }
  } catch (e){
    if (seq !== regSeq) return;
    var host = $('regList');
    if (host) host.innerHTML = '<p class="empty">' + esc(e.status === 401 ? 'Sign in as a citizen to see the register.' : 'Could not load the register: ' + e.message) + '</p>';
    return;
  }
  var host2 = $('regList');
  if (host2){ host2.innerHTML = renderRegList(); wireRows(host2); wirePager(); }
  var meta = document.querySelector('.section-head .meta');
  saveListState();
}

function saveListState(){
  try { history.replaceState(Object.assign({}, history.state || {}, { list: L }), '', location.href); } catch (_e) {}
}

function wireRows(host){
  host.querySelectorAll('[data-discord],[data-player],[data-town]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.preventDefault();
      if (el.dataset.town){
        L.town = el.dataset.town; L.page = 0; L.q = '';
        renderList(); loadRegister();
        var t = $('rtown'); if (t) t.scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      openPerson(el.dataset.discord ? { discord: el.dataset.discord } : { player: el.dataset.player });
    });
  });
}
function wirePager(){
  var p = $('rprev'), n = $('rnext');
  if (p) p.addEventListener('click', function(){ if (L.page > 0){ L.page--; loadRegister(); } });
  if (n) n.addEventListener('click', function(){ L.page++; loadRegister(); });
}
function wireList(){
  wireRows($('body'));
  wirePager();
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ L.tab = b.dataset.tab; saveListState(); renderList(); loadRegister(); });
  });
  var q = $('rq'), t = $('rtown'), so = $('rsort');
  var later = function(fn){ clearTimeout(regTimer); regTimer = setTimeout(fn, 250); };
  if (q) q.addEventListener('input', function(){ later(function(){ L.q = q.value.trim(); L.page = 0; loadRegister(); }); });
  if (t) t.addEventListener('input', function(){ later(function(){ L.town = t.value.trim(); L.page = 0; loadRegister(); }); });
  if (so) so.addEventListener('change', function(){ L.sort = so.value; L.page = 0; loadRegister(); });
}

/* ======================================================================= */
/* ONE PERSON                                                               */
/* ======================================================================= */
function openPerson(who){
  L.scroll = window.scrollY;
  saveListState();
  var qs = who.discord ? '?discord=' + encodeURIComponent(who.discord) : '?player=' + encodeURIComponent(who.player);
  history.pushState({ person: who, fromList: true }, '', qs);
  showPerson(who);
}

function backToList(){
  /* Back through history when the list is where we came from, so the list's
     place comes back with it; otherwise straight to the list. */
  if (history.state && history.state.fromList){ history.back(); return; }
  history.pushState({ list: L }, '', location.pathname);
  route();
}

function chipsFor(a){
  var c = '';
  if (a.tier && a.tier !== 'unverified' && a.tier !== 'citizen') c += '<span class="chip tier">' + esc(a.tier) + '</span>';
  (a.offices || []).forEach(function(o){ c += '<span class="chip">' + esc(o) + '</span>'; });
  if (a.isRepresentative) c += '<span class="chip">Representative' + (a.region ? ' · ' + esc(a.region) : '') + '</span>';
  if (a.party) c += '<span class="chip party" style="--pc:' + esc(a.party.colour || '') + '">' + esc(a.party.name || a.party.abbrev) + '</span>';
  else if (a.independent) c += '<span class="chip no">Independent</span>';
  if (a.blacklisted) c += '<span class="chip warn">blacklisted</span>';
  if (a.inGame && a.inGame.isOnline) c += '<span class="chip on">online now</span>';
  return c;
}

/* The 42-day clock, as a bar that fills as it runs out. */
function clockHtml(lastOnline){
  var t = toMs(lastOnline);
  if (t === null) return '';
  var idle = Math.max(0, (Date.now() - t) / DAY);
  var left = Math.max(0, 42 - Math.floor(idle));
  var pct = Math.min(100, Math.round(idle / 42 * 100));
  var col = left <= 7 ? 'var(--red)' : left <= 14 ? 'var(--gold)' : 'var(--green)';
  return '<div class="clock" title="' + left + ' of 42 days left"><i style="width:' + pct + '%;background:' + col + '"></i></div>' +
    '<p class="small">' + (left === 0 ? 'Past 42 days with no login — due to be removed from their town.'
      : left + ' of 42 days left before EarthMC removes them from their town if they do not log in.') + '</p>';
}

function kv(k, v){ return '<div class="kv"><span>' + esc(k) + '</span><span>' + v + '</span></div>'; }

var SHOW = 6;
function listMore(id, items, render){
  var open = openLists[id];
  var shown = open ? items : items.slice(0, SHOW);
  return render(shown) + (items.length > SHOW
    ? '<button class="btn btn-small more" type="button" data-more="' + id + '">' + (open ? 'Show fewer' : 'Show all ' + items.length) + '</button>' : '');
}
var openLists = {};

function renderRecord(a){
  var name = a.mcName || a.discordName || a.discordId;
  var standing = !a.inServer ? 'not in the Discord server' : a.verified ? 'verified' : 'entered by an admin, never signed in';
  var out = backBar() +
    '<div class="hero">' + (a.mcName ? faceImg(a.mcName, 96, 'face') : '<img class="face" alt="">') +
    '<div><h1>' + esc(name) + '</h1>' +
    '<p class="id">' + esc([a.discordName ? '@' + a.discordName : null, a.discordId, standing].filter(Boolean).join(' · ')) + '</p>' +
    '<div class="chips">' + chipsFor(a) + '</div></div></div><div class="rec">';

  /* In the game */
  out += '<section class="box b"><h2>In the game</h2>';
  if (a.inGame){
    var g = a.inGame;
    out += kv('Town', g.town ? '<a href="#" data-town="' + esc(g.town) + '">' + esc(g.town) + '</a>' : '—') +
      kv('Nation', esc(g.nation || '—')) +
      kv('Mayor', g.isMayor ? 'yes' : 'no') + (g.isKing ? kv('Leads a nation', 'yes') : '') +
      kv('Gold', g.balance == null ? '—' : gold(g.balance)) +
      kv('Last online', g.isOnline ? '<span class="ok">now</span>' : esc(dateOf(g.lastOnline) + ' · ' + ago(g.lastOnline))) +
      (g.isOnline ? '' : clockHtml(g.lastOnline));
  } else if (a.mcName){
    out += '<p class="small bad">' + esc(a.inGameError || 'EarthMC could not be reached.') + '</p>';
  } else {
    out += '<p class="small">No Minecraft name is set, so there is nothing to look up in game.</p>';
  }
  out += '</section>';

  /* Towns led */
  if ((a.towns || []).length){
    out += '<section class="box g"><h2>Towns led</h2>' + a.towns.map(function(t){
      var flags = [t.isOpen ? 'open' : t.isOpen === 0 ? 'invite only' : null, t.isOverclaimed ? 'overclaimed' : null].filter(Boolean).join(' · ');
      return '<div class="town"><div class="h"><b>' + esc(t.name) + '</b><span>' + esc(flags) + '</span></div>' +
        '<div class="l">' + num(t.residents) + ' residents · ' + num(t.chunks) + (t.maxChunks ? '/' + num(t.maxChunks) : '') +
          ' chunks · ' + gold(t.balance) + '</div>' +
        '<div class="l">' + (t.grants ? '<span class="ok">' + t.fulfilled + ' grants kept</span>' +
          (t.missed ? ' · <span class="bad">' + t.missed + ' missed</span>' : '') + ' · ' + gold(t.fundedTotal) + ' funded' : 'never funded') + '</div></div>';
    }).join('') +
    (a.fundingEver ? '<p class="small">Under the old monthly allowances, before funding moved to town grants: ' + gold(a.fundingEver) + ' in total.</p>' : '') +
    '</section>';
  }

  /* Work */
  var j = a.jobs || { claimed: 0, completed: 0, earned: 0, list: [] };
  out += '<section class="box y"><h2>Work</h2><div class="figs">' +
    '<div><b>' + num(j.claimed) + '</b><span>taken</span></div><div><b>' + num(j.completed) + '</b><span>completed</span></div>' +
    '<div><b style="color:var(--green)">' + gold(j.earned) + '</b><span>earned</span></div></div>' +
    (j.list.length ? listMore('jobs', j.list, function(xs){
      return '<table class="t">' + xs.map(function(x){
        return '<tr><td class="d">#' + x.id + '</td><td>' + esc(x.title || x.service) + '</td>' +
          '<td><span class="st ' + esc(x.status) + '">' + esc(x.status) + '</span></td><td class="n">' + gold(x.pay) + '</td></tr>';
      }).join('') + '</table>';
    }) : '<p class="small">No jobs taken yet.</p>') + '</section>';

  /* Donations */
  var d = a.donations || { total: 0, gifts: 0, list: [] };
  out += '<section class="box y"><h2>Donations</h2><div class="figs" style="grid-template-columns:1fr 1fr">' +
    '<div><b style="color:var(--gold)">' + gold(d.total) + '</b><span>given in total</span></div>' +
    '<div><b>' + num(d.gifts) + '</b><span>separate gifts</span></div></div>' +
    (d.list.length ? listMore('don', d.list, function(xs){
      return '<table class="t">' + xs.map(function(x){
        return '<tr><td class="d">' + esc(dateOf(x.at)) + '</td><td>' + esc(x.note || 'donation') + '</td><td class="n ok">' + gold(x.amount) + '</td></tr>';
      }).join('') + '</table>';
    }) : '<p class="small">Nothing given yet.</p>') + '</section>';

  /* Record */
  out += '<section class="box"><h2>Record</h2>' +
    kv('Standing', esc(standing)) + kv('Minecraft name set by', esc(a.mcNameSource || '—')) +
    kv('First seen', esc(dateOf(a.firstSeen))) + kv('Last seen', esc(dateOf(a.lastSeen))) +
    (a.blacklisted ? '<div class="note-box bad">Blacklisted: ' + esc(a.blacklisted) + '</div>' : '') +
    (a.note ? '<div class="note-box">' + esc(a.note) + '</div>' : '') +
    (a.canEdit ? '<p style="margin:.8rem 0 0"><a class="btn btn-small" href="people.html?q=' + encodeURIComponent(a.discordId) +
      '">Edit name, party or note &#8594;</a></p>' : '') + '</section>';

  out += '</div>';
  return out;
}

/* Someone known only from the nation itself — no Discord account here, or one
   the viewer may not open. What the sweep knows, and why there is no more. */
function renderRosterOnly(c, why){
  var out = backBar() +
    '<div class="hero">' + faceImg(c.name, 96, 'face') +
    '<div><h1>' + esc(c.name) + '</h1><p class="id">' + esc(c.discordName ? '@' + c.discordName : 'no Discord account linked') + '</p>' +
    '<div class="chips">' + (c.isMayor ? '<span class="chip may">mayor</span>' : '') + '</div></div></div><div class="rec">' +
    '<section class="box b"><h2>In the game</h2>' +
      kv('Town', c.town ? '<a href="#" data-town="' + esc(c.town) + '">' + esc(c.town) + '</a>' : '—') +
      kv('Mayor', c.isMayor ? 'yes' : 'no') + kv('Gold', c.balance == null ? '—' : gold(c.balance)) +
      kv('Last online', esc(dateOf(c.lastOnline) + ' · ' + ago(c.lastOnline))) + kv('First seen', esc(dateOf(c.firstSeen))) +
      clockHtml(c.lastOnline) +
    '</section><section class="box"><h2>Their record</h2><p class="small" style="margin:0">' + esc(why) + '</p></section></div>';
  return out;
}

function backBar(){
  return '<div class="backbar"><button class="btn" type="button" id="toList">&#8592; All accounts</button></div>';
}

async function showPerson(who){
  $('body').innerHTML = backBar() + '<p class="empty">Opening…</p>';
  wirePerson();
  window.scrollTo(0, 0);
  if (who.discord){
    try {
      var a = await api('/api/account?discord=' + encodeURIComponent(who.discord));
      $('body').innerHTML = renderRecord(a);
      $('stamp').textContent = esc(a.mcName || a.discordName || '');
      document.title = (a.mcName || a.discordName || 'Account') + ' · Ethiopia';
      wirePerson(a);
      return;
    } catch (err){
      var cached = rowCache.get(who.discord);
      if (err.status === 403 && cached){
        $('body').innerHTML = renderRosterOnly(cached, 'Full records — donations, work and funding — are for the person themselves and Managers.');
        wirePerson(); return;
      }
      $('body').innerHTML = backBar() + '<p class="empty">' + esc(err.status === 401 ? 'Sign in to see records.'
        : err.status === 403 ? 'Only a Manager can open somebody else\u2019s full record.' : 'Could not open that record: ' + err.message) + '</p>';
      wirePerson(); return;
    }
  }
  var c = rowCache.get('p:' + who.player);
  if (!c){
    try {
      var r = await api('/api/nation/citizens?limit=10&q=' + encodeURIComponent(who.player));
      c = (r.citizens || []).filter(function(x){ return String(x.name).toLowerCase() === String(who.player).toLowerCase(); })[0];
    } catch (_e) { c = null; }
  }
  if (!c){ $('body').innerHTML = backBar() + '<p class="empty">Nobody called ' + esc(who.player) + ' is in the register.</p>'; wirePerson(); return; }
  if (c.discordId && isManager()){ history.replaceState({ person: { discord: c.discordId }, fromList: history.state && history.state.fromList }, '', '?discord=' + encodeURIComponent(c.discordId)); return showPerson({ discord: c.discordId }); }
  $('body').innerHTML = renderRosterOnly(c, c.discordId
    ? 'Full records — donations, work and funding — are for the person themselves and Managers.'
    : 'No Discord account here carries this name, so there are no donations, work or funding to show. Once they verify, their full record appears here.');
  document.title = c.name + ' · Ethiopia';
  wirePerson();
}

function wirePerson(a){
  var b = $('toList');
  if (b) b.addEventListener('click', backToList);
  document.querySelectorAll('#body [data-town]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.preventDefault();
      L.town = el.dataset.town; L.q = ''; L.page = 0; L.scroll = 0;
      history.pushState({ list: L }, '', location.pathname);
      route();
    });
  });
  document.querySelectorAll('[data-more]').forEach(function(el){
    el.addEventListener('click', function(){ openLists[el.dataset.more] = !openLists[el.dataset.more]; if (a){ $('body').innerHTML = renderRecord(a); wirePerson(a); } });
  });
}

/* ======================================================================= */
async function route(){
  var p = new URLSearchParams(location.search);
  var who = p.get('discord') ? { discord: p.get('discord') } : p.get('player') ? { player: p.get('player') } : null;
  if (who){ showPerson(who); return; }
  if (history.state && history.state.list) L = Object.assign(L, history.state.list);
  document.title = 'Accounts · Ethiopia';
  renderList();
  $('stamp').textContent = now && now.live ? 'Live · ' + new Date(now.live.at).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }) : '';
  await loadRegister();
  if (L.scroll) window.scrollTo(0, L.scroll);
}

function renderAuth(){
  var slot = $('authSlot');
  if (me && me.signedIn){
    slot.innerHTML = '<button class="btn" type="button" id="signout">' + esc(me.mcName || me.discordName || 'Signed in') + ' \u00b7 ' + esc(me.tier) + '</button>';
    $('signout').addEventListener('click', async function(){ try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {} location.reload(); });
  } else {
    slot.innerHTML = '<a class="btn" href="' + API + '/api/auth/login?redirect=' + encodeURIComponent('/account.html') + '">Sign in with Discord</a>';
  }
}

window.addEventListener('popstate', route);

(async function(){
  try { me = await api('/api/me'); } catch (e) { me = null; }
  renderAuth();
  try { now = await api('/api/nation/now'); } catch (e) { now = null; }
  try { boards = await api('/api/nation/boards'); } catch (e) { boards = null; }
  /* An old link to someone's record (?discord=…) still works, and so does the
     bare page for someone who used to land on their own record: their record
     is one tap away, at the top of the list. */
  route();
})().catch(function(e){ $('body').innerHTML = '<p class="empty" style="color:var(--red)">This page failed to load: ' + esc(e && e.message) + '</p>'; });
</script>
