<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Citizens · Ethiopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=2">
<style>
.back{ display:inline-block; font-family:var(--data); font-size:var(--step--1);
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-low); text-decoration:none; }
.back:hover{ color:var(--gold); }
.topbar{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:1.4rem; }
.topbar .spacer{ margin-left:auto; }
.masthead{ border-bottom:1px solid var(--rule); padding-bottom:1.1rem; margin-bottom:1.2rem; }
.masthead h1{ font-size:var(--step-3); letter-spacing:-.03em; }
.masthead .sub{ font-family:var(--data); font-size:var(--step--1); letter-spacing:.15em;
  text-transform:uppercase; color:var(--gold); margin:.5rem 0 0; }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); gap:.7rem; margin-bottom:1.2rem; }
.stat{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--accent,var(--rule)); border-radius:3px; padding:.85rem 1rem; }
.stat .n{ font-family:var(--data); font-weight:600; font-size:var(--step-1);
  font-variant-numeric:tabular-nums; display:block; }
.stat .k{ font-family:var(--data); font-size:.62rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-low); display:block; margin-top:.2rem; }
.stat.p{ --accent:var(--green); } .stat.p .n{ color:var(--green); }
.stat.g{ --accent:var(--gold); } .stat.g .n{ color:var(--gold); }
.stat.m{ --accent:var(--blue); }

.tools{ display:flex; gap:.4rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:.9rem; }
.f{ display:flex; flex-direction:column; gap:.25rem; flex:1 1 12rem; }
.f label{ font-family:var(--data); font-size:.62rem; color:var(--text-low); }
.f input, .f select{ background:var(--ink); color:var(--text); border:1px solid var(--rule);
  border-radius:2px; padding:.42rem .55rem; font-family:var(--body); font-size:.84rem; width:100%; }
.f input:focus, .f select:focus{ border-color:var(--gold); outline:none; }

.rows{ display:flex; flex-direction:column; gap:.3rem; }
.c{ display:flex; align-items:center; gap:.6rem; background:var(--ink-raised);
  border:1px solid var(--rule); border-radius:3px; padding:.5rem .7rem; }
.c.link{ cursor:pointer; }
.c.link:hover{ border-color:var(--gold-dim); }
.c .rank{ font-family:var(--data); font-size:.68rem; color:var(--text-low);
  width:2.2rem; text-align:right; font-variant-numeric:tabular-nums; flex:none; }
.c .rank.top{ color:var(--gold); font-weight:600; }
.c .face{ width:26px; height:26px; border-radius:2px; image-rendering:pixelated;
  background:var(--ink-high); flex:none; }
.c .who{ min-width:0; flex:1 1 auto; }
.c .nm{ font-family:var(--body); font-weight:600; color:var(--text); font-size:.9rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.c .sub{ font-family:var(--data); font-size:.6rem; color:var(--text-low);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.c .bal{ font-family:var(--data); font-size:.8rem; color:var(--gold);
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.c .tag{ font-family:var(--data); font-size:.55rem; letter-spacing:.05em;
  text-transform:uppercase; padding:.1rem .3rem; border:1px solid var(--rule);
  border-radius:2px; color:var(--text-low); white-space:nowrap; }
.c .tag.may{ color:var(--gold); border-color:var(--gold-dim); }
.c .tag.on{ color:var(--green); border-color:var(--green-dim); }
.c .tag.no{ color:var(--text-low); border-style:dashed; }

/* --- boards ---------------------------------------------------------------
   Several short lists rather than one long one. Each answers a different
   question, and a question with eight answers is worth more than a ranking
   with five hundred.
   ------------------------------------------------------------------------- */
.boards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));
  gap:.7rem; margin-bottom:1.6rem; }
.board{ background:var(--ink-raised); border:1px solid var(--rule);
  border-top:2px solid var(--accent,var(--rule)); border-radius:3px; padding:.85rem 1rem; }
.board h3{ font-size:var(--step-0); margin:0 0 .15rem; }
.board .cap{ font-family:var(--data); font-size:.58rem; color:var(--text-low); margin:0 0 .6rem; }
.board.rich{ --accent:var(--gold); }
.board.act{ --accent:var(--green); }
.board.quiet{ --accent:var(--red); }
.board.old{ --accent:var(--blue); }
.board.give{ --accent:var(--gold); }
.board.twn{ --accent:var(--blue); }
.brow{ display:flex; align-items:baseline; gap:.45rem; padding:.3rem 0;
  border-bottom:1px solid var(--rule-soft); font-size:.78rem; }
.brow:last-child{ border-bottom:none; }
.brow.link{ cursor:pointer; }
.brow.link:hover .bn{ color:var(--gold); }
.brow .bi{ font-family:var(--data); font-size:.62rem; color:var(--text-low);
  width:1.1rem; flex:none; }
.brow .bn{ font-family:var(--body); font-weight:600; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.brow .bs{ font-family:var(--data); font-size:.58rem; color:var(--text-low);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.brow .bv{ margin-left:auto; font-family:var(--data); font-size:.72rem;
  font-variant-numeric:tabular-nums; color:var(--gold); white-space:nowrap; }
.brow .bv.g{ color:var(--green); } .brow .bv.r{ color:var(--red); }
.board .none{ font-family:var(--data); font-size:.66rem; color:var(--text-low);
  padding:.4rem 0; }

.pager{ display:flex; gap:.4rem; align-items:center; margin-top:.9rem; }
.pager .where{ font-family:var(--data); font-size:.65rem; color:var(--text-low); margin-left:.4rem; }
.empty{ border:1px dashed var(--rule); border-radius:3px; padding:1.4rem; text-align:center;
  color:var(--text-mid); font-size:var(--step--1); }
footer{ margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }
</style>
</head>
<body>
<div class="flag-edge" aria-hidden="true"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="index.html">&#8592; Ecosystem</a>
    <span class="spacer"></span>
    <span id="authSlot"></span>
  </div>

  <header class="masthead">
    <h1 data-slot="title">Citizens</h1>
    <p class="sub" data-slot="subtitle">Everyone in the nation, and what they hold</p>
  </header>

  <div id="body"><p class="empty">Loading&#8230;</p></div>

  <footer><span>Ethiopia</span><span id="stamp">&nbsp;</span></footer>
</div>

<script>
'use strict';
var API = 'https://earthmc-ethiopia-proxy.ethiopianempire2.workers.dev';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
var num = function(n){ return (Number(n) || 0).toLocaleString('en-US'); };
var gold = function(n){ return num(n) + 'g'; };

var me = null, data = null, boards = null;
var sort = 'balance', q = '', town = '', page = 0;
var PAGE = 25;
var searchTimer = null;

async function api(path, opts){
  var res = await fetch(API + path, Object.assign({ credentials:'include' }, opts || {}));
  var d = null;
  try { d = await res.json(); } catch (e) {}
  if (!res.ok){ var err = new Error((d && d.detail) || (d && d.error) || ('HTTP ' + res.status));
    err.status = res.status; throw err; }
  return d;
}

function fatal(err){
  var host = $('body') || document.body;
  host.innerHTML = '';
  var p = document.createElement('p');
  p.className = 'empty';
  p.style.cssText = 'color:var(--red);border-color:var(--red-dim);text-align:left';
  p.textContent = 'This page failed to load: ' + ((err && err.message) || err);
  host.appendChild(p);
}

/* Days since a unix ms timestamp, or null when there is none. */
function daysAgo(ms){
  if (!ms) return null;
  return Math.floor((Date.now() - ms) / 86400000);
}

function row(c){
  var face = '<img class="face" loading="lazy" src="https://minotar.net/helm/' +
    encodeURIComponent(c.name) + '/26.png" alt="" ' +
    'onerror="this.style.visibility=\'hidden\'">';

  var d = daysAgo(c.lastOnline);
  var seen = d === null ? 'never seen'
    : d === 0 ? 'today'
    : d === 1 ? 'yesterday'
    : d + 'd ago';

  var tags = '';
  if (c.isMayor) tags += '<span class="tag may">mayor</span>';
  if (d !== null && d === 0) tags += '<span class="tag on">active</span>';
  /* Said plainly rather than left blank: someone with no Discord account
     cannot be opened, and a row that does nothing when clicked is worse than
     one that explains why. */
  if (!c.discordId) tags += '<span class="tag no">no account</span>';

  var sub = [c.town, seen, c.discordName ? '@' + c.discordName : null]
    .filter(Boolean).map(esc).join(' · ');

  var rank = c.rank
    ? '<span class="rank' + (c.rank <= 3 ? ' top' : '') + '">' +
      (c.rank === 1 ? '🥇' : c.rank === 2 ? '🥈' : c.rank === 3 ? '🥉' : c.rank) + '</span>'
    : '<span class="rank"></span>';

  return '<div class="c' + (c.discordId ? ' link' : '') + '"' +
    (c.discordId ? ' data-discord="' + esc(c.discordId) + '"' : '') + '>' +
    rank + face +
    '<span class="who"><span class="nm">' + esc(c.name) + '</span>' +
    '<span class="sub">' + (sub || '&nbsp;') + '</span></span>' +
    tags +
    '<span class="bal">' + (c.balance == null ? '—' : gold(c.balance)) + '</span>' +
  '</div>';
}

/* Relative-day text, from a unix ms timestamp. */
function ago(ms){
  var d = daysAgo(ms);
  return d === null ? 'never'
    : d === 0 ? 'today'
    : d === 1 ? 'yesterday'
    : d + 'd ago';
}

function brow(r, i, value, sub, cls){
  var clickable = r.discord_id || r.discordId;
  return '<div class="brow' + (clickable ? ' link' : '') + '"' +
    (clickable ? ' data-discord="' + esc(clickable) + '"' : '') + '>' +
    '<span class="bi">' + (i + 1) + '</span>' +
    '<span><span class="bn">' + esc(r.name || r.mc_name || r.discord_name || '—') + '</span>' +
    (sub ? '<span class="bs"> · ' + esc(sub) + '</span>' : '') + '</span>' +
    '<span class="bv' + (cls || '') + '">' + value + '</span></div>';
}

function boardCard(key, cls, title, cap, rows, fmt){
  return '<div class="board ' + cls + '"><h3>' + esc(title) + '</h3>' +
    '<p class="cap">' + esc(cap) + '</p>' +
    (rows && rows.length
      ? rows.map(fmt).join('')
      : '<p class="none">Nothing recorded yet.</p>') + '</div>';
}

function renderBoards(){
  if (!boards) return '';
  var b = boards.boards;

  return '<div class="boards">' +
    boardCard('richest', 'rich', 'Richest', 'gold held right now', b.richest,
      function(r, i){ return brow(r, i, gold(r.balance), r.town); }) +

    /* The one worth acting on: these are the people whose 42-day clock is
       closest to running out, and each one who goes takes their town's claim
       headroom with them. */
    boardCard('quiet', 'quiet', 'Going quiet', 'closest to the 42-day purge', b.quiet,
      function(r, i){ return brow(r, i, ago(r.last_online), r.town, ' r'); }) +

    boardCard('active', 'act', 'Most recently on', 'last seen', b.active,
      function(r, i){ return brow(r, i, ago(r.last_online), r.town, ' g'); }) +

    boardCard('donors', 'give', 'Most generous', 'given to the treasury', b.donors,
      function(r, i){
        return brow({ name: r.mc_name || r.discord_name, discord_id: r.discord_id },
          i, gold(r.total), r.gifts + (r.gifts === 1 ? ' gift' : ' gifts')); }) +

    boardCard('oldest', 'old', 'Longest here', 'first seen in the nation', b.oldest,
      function(r, i){ return brow(r, i, ago(Date.parse(r.first_seen)), r.town); }) +

    boardCard('towns', 'twn', 'Biggest towns', 'by residents', b.towns,
      function(r, i){
        return '<div class="brow"><span class="bi">' + (i + 1) + '</span>' +
          '<span><span class="bn">' + esc(r.name) + '</span>' +
          '<span class="bs"> · ' + num(r.chunks) +
          (r.max_chunks ? '/' + r.max_chunks : '') + ' chunks</span></span>' +
          '<span class="bv">' + num(r.residents) + '</span></div>'; }) +
  '</div>';
}

function render(){
  var pages = Math.max(1, Math.ceil(data.total / PAGE));

  var out = '<div class="stats">' +
      '<div class="stat p"><span class="n">' + num(data.population) + '</span>' +
        '<span class="k">Citizens</span></div>' +
      '<div class="stat g"><span class="n">' + gold(data.totalGold) + '</span>' +
        '<span class="k">Held between them</span></div>' +
      '<div class="stat m"><span class="n">' + num(data.mayors) + '</span>' +
        '<span class="k">Mayors</span></div>' +
      '<div class="stat"><span class="n">' +
        (data.population ? gold(Math.round(data.totalGold / data.population)) : '—') +
        '</span><span class="k">Average holding</span></div>' +
    '</div>';

  out += renderBoards();

  out += '<div class="section-head" style="display:flex;align-items:baseline;gap:.8rem;' +
    'border-bottom:1px solid var(--rule);padding-bottom:.7rem;margin:0 0 .9rem">' +
    '<h2 style="font-size:var(--step-1)">Everyone</h2>' +
    '<span style="margin-left:auto;font-family:var(--data);font-size:var(--step--1);' +
    'color:var(--text-low)">' + num(data.population) + ' citizens</span></div>';

  out += '<div class="tools">' +
    '<div class="f"><label for="q">Search</label>' +
      '<input id="q" placeholder="A name…" value="' + esc(q) + '" autocomplete="off"></div>' +
    '<div class="f" style="flex:0 0 11rem"><label for="sort">Order by</label>' +
      '<select id="sort">' +
      [['balance','Richest'],['active','Recently online'],['name','Name'],
       ['town','Town'],['oldest','Longest here'],['newest','Newest']].map(function(o){
        return '<option value="' + o[0] + '"' + (sort === o[0] ? ' selected' : '') + '>' +
          o[1] + '</option>'; }).join('') +
      '</select></div>' +
    '<div class="f" style="flex:0 0 11rem"><label for="town">Town</label>' +
      '<input id="town" placeholder="Any" value="' + esc(town) + '" autocomplete="off"></div>' +
    '</div>';

  out += data.citizens.length
    ? '<div class="rows">' + data.citizens.map(row).join('') + '</div>' +
      '<div class="pager">' +
        '<button class="btn" type="button" id="prev"' + (page <= 0 ? ' disabled' : '') + '>Previous</button>' +
        '<button class="btn" type="button" id="next"' + (page + 1 >= pages ? ' disabled' : '') + '>Next</button>' +
        '<span class="where">Page ' + (page + 1) + ' of ' + pages + ' · ' +
          num(data.total) + ' shown of ' + num(data.population) + '</span>' +
      '</div>'
    : '<p class="empty">' + (q || town
        ? 'Nobody matches that.'
        : 'No citizens recorded yet — the roster fills on the next sweep.') + '</p>';

  $('body').innerHTML = out;
  wire();
  if (window.ethiopiaPageText) window.ethiopiaPageText.reapply();
}

function wire(){
  var qi = $('q');
  if (qi) qi.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      q = qi.value.trim(); page = 0; load(true);
    }, 250);
  });

  var ti = $('town');
  if (ti) ti.addEventListener('input', function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      town = ti.value.trim(); page = 0; load(true);
    }, 250);
  });

  var s = $('sort');
  if (s) s.addEventListener('change', function(){ sort = s.value; page = 0; load(true); });

  var p = $('prev'), n = $('next');
  if (p) p.addEventListener('click', function(){ if (page > 0){ page--; load(true); } });
  if (n) n.addEventListener('click', function(){ page++; load(true); });

  document.querySelectorAll('[data-discord]').forEach(function(el){
    el.addEventListener('click', function(){
      location.href = 'account.html?discord=' + encodeURIComponent(el.dataset.discord);
    });
  });
}

function renderAuth(){
  var slot = $('authSlot');
  if (me && me.signedIn){
    slot.innerHTML = '<button class="btn" type="button" id="signout">' +
      esc(me.discordName || 'Signed in') + ' \u00b7 ' + esc(me.tier) + '</button>';
    $('signout').addEventListener('click', async function(){
      try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {}
      location.reload();
    });
  } else {
    slot.innerHTML = '<a class="btn" href="' + API + '/api/auth/login?redirect=' +
      encodeURIComponent('/citizens.html') + '">Sign in with Discord</a>';
  }
}

async function load(quiet){
  if (!quiet){
    try { me = await api('/api/me'); } catch (e) { me = null; }
    try { renderAuth(); } catch (e) { /* header only */ }
  }

  var params = new URLSearchParams({
    sort: sort, limit: String(PAGE), offset: String(page * PAGE),
  });
  if (q) params.set('q', q);
  if (town) params.set('town', town);

  /* Boards only change when the sweep runs, so they are fetched once rather
     than on every search keystroke and page turn. */
  if (!boards){
    try { boards = await api('/api/nation/boards'); } catch (_e) { boards = null; }
  }

  try {
    data = await api('/api/nation/citizens?' + params);
  } catch (e){
    if (e.status === 401){
      $('body').innerHTML = '<p class="empty">Sign in as a verified citizen of Ethiopia ' +
        'to see the register.</p>';
      $('stamp').textContent = 'Not signed in';
      return;
    }
    throw e;
  }

  /* Focus is restored after a re-render so typing is not interrupted — the
     whole list is redrawn on every keystroke that survives the debounce. */
  var active = document.activeElement && document.activeElement.id;
  var caret = document.activeElement && document.activeElement.selectionStart;
  render();
  if (active && $(active)){
    $(active).focus();
    try { $(active).setSelectionRange(caret, caret); } catch (_e) {}
  }

  $('stamp').textContent = data.updatedAt
    ? 'swept ' + new Date(data.updatedAt).toLocaleString('en-GB', {
        day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })
    : 'not swept yet';
}

load().catch(fatal);
</script>
<script src="assets/pagetext.js?v=1"></script>
</body>
</html>
