<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth · Ethiopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=2">
<style>
.back{ display:inline-block; font-family:var(--data); font-size:var(--step--1);
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-low); text-decoration:none; }
.back:hover{ color:var(--gold); }
.topbar{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:1.4rem; }
.topbar .spacer{ margin-left:auto; }
.masthead{ border-bottom:1px solid var(--rule); padding-bottom:1.1rem; margin-bottom:1.2rem; }
.masthead h1{ font-size:var(--step-3); letter-spacing:-.03em; }
.masthead .sub{ font-family:var(--data); font-size:var(--step--1); letter-spacing:.15em;
  text-transform:uppercase; color:var(--gold); margin:.5rem 0 0; }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); gap:.7rem; margin-bottom:1.4rem; }
.stat{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--accent,var(--rule)); border-radius:3px; padding:.85rem 1rem; }
.stat .n{ font-family:var(--data); font-weight:600; font-size:var(--step-1);
  font-variant-numeric:tabular-nums; display:block; }
.stat .k{ font-family:var(--data); font-size:.62rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-low); display:block; margin-top:.2rem; }
.stat .d{ font-family:var(--data); font-size:.62rem; margin-top:.25rem; display:block; }
.stat.res{ --accent:var(--green); } .stat.res .n{ color:var(--green); }
.stat.twn{ --accent:var(--blue); }
.stat.chk{ --accent:var(--gold); }
.stat.bal{ --accent:var(--gold); } .stat.bal .n{ color:var(--gold); }
.up{ color:var(--green); } .down{ color:var(--red); } .flat{ color:var(--text-low); }

.chartwrap{ background:var(--ink-raised); border:1px solid var(--rule);
  border-radius:3px; padding:.9rem 1rem 1rem; margin-bottom:1rem; }
.chartwrap h3{ font-size:var(--step-0); margin:0 0 .1rem; }
.chartwrap .cap{ font-family:var(--data); font-size:.62rem; color:var(--text-low); margin:0; }
.chartwrap canvas{ width:100%; height:200px; display:block; margin-top:.7rem; }
.keys{ display:flex; gap:.9rem; flex-wrap:wrap; margin-top:.5rem;
  font-family:var(--data); font-size:.64rem; color:var(--text-low); }
.keys i{ display:inline-block; width:.7rem; height:.16rem; border-radius:999px;
  margin-right:.3rem; vertical-align:.18rem; }

.section-head{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap;
  border-bottom:1px solid var(--rule); padding-bottom:.7rem; margin:2rem 0 .9rem; }
.section-head h2{ font-size:var(--step-1); }
.section-head .meta{ margin-left:auto; font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }

.tools{ display:flex; gap:.4rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:.8rem; }
.f{ display:flex; flex-direction:column; gap:.25rem; flex:1 1 12rem; }
.f label{ font-family:var(--data); font-size:.62rem; color:var(--text-low); }
.f input, .f select{ background:var(--ink); color:var(--text); border:1px solid var(--rule);
  border-radius:2px; padding:.42rem .55rem; font-family:var(--body); font-size:.84rem; width:100%; }
.f input:focus, .f select:focus{ border-color:var(--gold); outline:none; }

table{ width:100%; border-collapse:collapse; font-size:var(--step--1); }
th{ font-family:var(--data); font-size:.62rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-low); text-align:left; font-weight:400; padding:.45rem .5rem;
  border-bottom:1px solid var(--rule); cursor:pointer; }
th:hover{ color:var(--gold); }
td{ padding:.45rem .5rem; border-bottom:1px solid var(--rule-soft);
  font-family:var(--data); font-size:.72rem; font-variant-numeric:tabular-nums; }
td.n{ text-align:right; }
td.name{ color:var(--text); font-weight:600; font-family:var(--body); }
tr.pick{ cursor:pointer; }
tr.pick:hover td{ background:var(--ink-raised); }

/* The town panel opens under the row it came from, so you keep your place. */
.tpanel{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--gold); border-radius:3px; padding:1rem 1.1rem;
  margin:.8rem 0 1.4rem; }
.tpanel .head{ display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
.tpanel h3{ font-size:var(--step-1); margin:0; }
.tpanel .close{ margin-left:auto; background:none; border:0; color:var(--text-low);
  font-size:1.1rem; cursor:pointer; line-height:1; }
.tpanel .close:hover{ color:var(--gold); }
.tpanel canvas{ width:100%; height:170px; display:block; margin-top:.8rem; }

.log{ display:flex; flex-direction:column; gap:0; }
.ev{ display:flex; align-items:baseline; gap:.6rem; padding:.4rem .2rem;
  border-bottom:1px solid var(--rule-soft); font-size:var(--step--1); }
.ev:last-child{ border-bottom:none; }
.ev .ico{ width:1.1rem; text-align:center; flex:0 0 auto; }
.ev .who{ font-weight:600; }
.ev .at{ margin-left:auto; font-family:var(--data); font-size:.62rem;
  color:var(--text-low); white-space:nowrap; }
.ev.join .ico{ color:var(--green); }
.ev.left .ico{ color:var(--red); }
.ev.move .ico{ color:var(--blue); }

.pager{ display:flex; gap:.4rem; align-items:center; margin-top:.8rem; }
.pager .where{ font-family:var(--data); font-size:.65rem; color:var(--text-low); margin-left:.4rem; }

.empty{ border:1px dashed var(--rule); border-radius:3px; padding:1.4rem; text-align:center;
  color:var(--text-mid); font-size:var(--step--1); }
.note{ font-family:var(--data); font-size:.66rem; color:var(--text-low); margin:.5rem 0 0; }
footer{ margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }
</style>
</head>
<body>
<div class="flag-edge" aria-hidden="true"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="index.html">&#8592; Ecosystem</a>
    <span class="spacer"></span>
    <span id="authSlot"></span>
  </div>

  <header class="masthead">
    <h1 data-slot="title">Growth</h1>
    <p class="sub" data-slot="subtitle">How the nation has risen and fallen</p>
  </header>

  <div id="body"><p class="empty">Loading&#8230;</p></div>

  <footer><span>Ethiopia</span><span id="stamp">&nbsp;</span></footer>
</div>

<script>
'use strict';
var API = 'https://earthmc-ethiopia-proxy.ethiopianempire2.workers.dev';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
var num = function(n){ return (Number(n) || 0).toLocaleString('en-US'); };
var gold = function(n){ return num(n) + 'g'; };

var me = null, hist = null, events = null;
var days = 7, town = null, evPage = 0, evTown = '';
var sortKey = 'residents', sortDir = -1, search = '';
var EV_PAGE = 25;

async function api(path, opts){
  var res = await fetch(API + path, Object.assign({ credentials:'include' }, opts || {}));
  var d = null;
  try { d = await res.json(); } catch (e) {}
  if (!res.ok){ var err = new Error((d && d.detail) || (d && d.error) || ('HTTP ' + res.status));
    err.status = res.status; throw err; }
  return d;
}

function fatal(err){
  var host = $('body') || document.body;
  host.innerHTML = '';
  var p = document.createElement('p');
  p.className = 'empty';
  p.style.cssText = 'color:var(--red);border-color:var(--red-dim);text-align:left';
  p.textContent = 'This page failed to load: ' + ((err && err.message) || err);
  host.appendChild(p);
  try { console.error('[growth]', err); } catch (e) {}
}

/* --- charts ---------------------------------------------------------------
   Canvas, drawn by hand, matching treasury.html and shop.html. A couple of
   lines on a dark ground does not justify a charting dependency.
   --------------------------------------------------------------------------- */
function drawSeries(canvas, rows, opts){
  if (!canvas) return;
  opts = opts || {};
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth, h = canvas.clientHeight || 200;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (!rows.length){
    ctx.fillStyle = '#756c5d';
    ctx.font = '12px "Martian Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(opts.emptyText || 'No history recorded yet', w / 2, h / 2);
    return;
  }

  var lines = opts.lines || [];
  var padL = 54, padR = 12, padT = 12, padB = 24;
  var all = [];
  lines.forEach(function(l){ rows.forEach(function(r){ all.push(Number(r[l.key]) || 0); }); });
  var min = Math.min.apply(null, all), max = Math.max.apply(null, all);

  /* Counts are not money — a resident chart that starts at 480 rather than
     zero makes a drop of five look like a collapse. Zero is on the axis
     unless the numbers are far from it. */
  if (min > 0 && min < max * 0.6) min = 0;
  if (min === max){ min = Math.max(0, min - 1); max += 1; }
  var span = max - min || 1;
  max += span * 0.08;

  var flat = rows.length === 1;
  var X = function(i){
    return flat ? padL + (w - padL - padR) / 2
                : padL + (i / Math.max(1, rows.length - 1)) * (w - padL - padR);
  };
  var Y = function(v){ return padT + (1 - (v - min) / (max - min)) * (h - padT - padB); };

  ctx.strokeStyle = '#2b2620'; ctx.lineWidth = 1;
  ctx.fillStyle = '#756c5d'; ctx.font = '10px "Martian Mono", monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var g = 0; g <= 4; g++){
    var v = min + (max - min) * (g / 4), yy = Math.round(Y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.fillText(Math.round(v).toLocaleString('en-US'), padL - 8, yy);
  }

  lines.forEach(function(l){
    ctx.strokeStyle = l.color; ctx.lineWidth = l.width || 1.8;
    ctx.lineJoin = 'round'; ctx.beginPath();
    rows.forEach(function(r, i){
      var y = Y(Number(r[l.key]) || 0);
      if (i === 0) ctx.moveTo(X(i), y); else ctx.lineTo(X(i), y);
    });
    ctx.stroke();
    if (flat){
      ctx.fillStyle = l.color;
      ctx.beginPath(); ctx.arc(X(0), Y(Number(rows[0][l.key]) || 0), 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  /* An hourly bucket is "2026-09-10T14" — the date alone would repeat across
     the whole axis, so the hour is what distinguishes the points. */
  var axis = function(v){
    if (!v) return '';
    return v.length > 10 ? v.slice(5, 10) + ' ' + v.slice(11, 13) + ':00' : v.slice(5);
  };
  ctx.fillStyle = '#756c5d'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText(axis(rows[0].day), padL, h - padB + 7);
  if (rows.length > 1){
    ctx.textAlign = 'right';
    ctx.fillText(axis(rows[rows.length - 1].day), w - padR, h - padB + 7);
  }
}

function paintCharts(){
  if (!hist) return;
  drawSeries($('cPeople'), hist.series || [], {
    lines: [{ key:'residents', color:'#189d4d', width:2.2 }],
    emptyText: 'No history yet — the first snapshot lands on the next sweep',
  });
  drawSeries($('cLand'), hist.series || [], {
    lines: [{ key:'chunks', color:'#e0a92a', width:2.2 }],
  });
  drawSeries($('cTowns'), hist.series || [], {
    lines: [{ key:'towns', color:'#2f6fb8', width:2.2 }],
  });
}

/* Change over the window, from the two ends of the series. */
function delta(key){
  var s = hist && hist.series || [];
  if (s.length < 2) return null;
  return (Number(s[s.length - 1][key]) || 0) - (Number(s[0][key]) || 0);
}
function deltaText(key, suffix){
  var d = delta(key);
  if (d === null) return '<span class="d flat">not enough history yet</span>';
  var cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  var sign = d > 0 ? '+' : '';
  return '<span class="d ' + cls + '">' + sign + num(d) + (suffix || '') +
    ' in ' + days + 'd</span>';
}

/* --- the log -------------------------------------------------------------- */
var EV = {
  resident_joined: { ico:'→', cls:'join', text:function(e){
    return '<span class="who">' + esc(e.subject) + '</span> joined ' + esc(e.town_name); } },
  resident_left:   { ico:'←', cls:'left', text:function(e){
    return '<span class="who">' + esc(e.subject) + '</span> left ' + esc(e.town_name); } },
  resident_moved:  { ico:'⇄', cls:'move', text:function(e){
    return '<span class="who">' + esc(e.subject) + '</span> moved from ' +
      esc(e.from_town) + ' to ' + esc(e.town_name); } },
  town_joined:     { ico:'▲', cls:'join', text:function(e){
    return '<span class="who">' + esc(e.subject) + '</span> joined the nation'; } },
  town_left:       { ico:'▼', cls:'left', text:function(e){
    return '<span class="who">' + esc(e.subject) + '</span> left the nation'; } },
};

function renderLog(){
  if (!events || !events.events.length){
    return '<p class="empty">' + (evTown
      ? 'Nothing recorded for ' + esc(evTown) + ' in this period.'
      : 'No changes recorded yet. The log starts from the second sweep — the ' +
        'first one only records who is already here.') + '</p>';
  }

  var pages = Math.max(1, Math.ceil(events.total / EV_PAGE));

  return '<div class="log">' + events.events.map(function(e){
    var t = EV[e.kind];
    if (!t) return '';
    var when = new Date(e.occurred_at + (/[Zz]|[+-]\d{2}:?\d{2}$/.test(e.occurred_at) ? '' : 'Z'));
    var stamp = isNaN(when) ? esc(e.occurred_at)
      : when.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) + ' ' +
        when.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    return '<div class="ev ' + t.cls + '"><span class="ico">' + t.ico + '</span>' +
      '<span>' + t.text(e) + '</span><span class="at">' + stamp + '</span></div>';
  }).join('') + '</div>' +
  '<div class="pager">' +
    '<button class="btn" type="button" id="evPrev"' + (evPage <= 0 ? ' disabled' : '') + '>Previous</button>' +
    '<button class="btn" type="button" id="evNext"' + (evPage + 1 >= pages ? ' disabled' : '') + '>Next</button>' +
    '<span class="where">Page ' + (evPage + 1) + ' of ' + pages + ' · ' +
      num(events.total) + ' changes</span>' +
  '</div>';
}

/* --- one town ------------------------------------------------------------- */
var openTown = null, openTownSeries = null;

async function showTown(name){
  var host = $('tpanel');
  if (!host) return;
  if (openTown === name){ openTown = null; openTownSeries = null; host.innerHTML = ''; return; }
  openTown = name;
  host.innerHTML = '<p class="empty">Loading ' + esc(name) + '…</p>';

  var d;
  try {
    d = await api('/api/nation/history?days=' + days + '&town=' + encodeURIComponent(name));
  } catch (e){
    host.innerHTML = '<p class="empty">Could not load that town: ' + esc(e.message) + '</p>';
    return;
  }
  if (openTown !== name) return;         // a later click won the race

  openTownSeries = d.series || [];
  var first = openTownSeries[0], last = openTownSeries[openTownSeries.length - 1];
  var chg = function(k){
    if (!first || !last || openTownSeries.length < 2) return '—';
    var v = (Number(last[k]) || 0) - (Number(first[k]) || 0);
    return '<span class="' + (v > 0 ? 'up' : v < 0 ? 'down' : 'flat') + '">' +
      (v > 0 ? '+' : '') + num(v) + '</span>';
  };

  host.innerHTML =
    '<div class="tpanel"><div class="head"><h3>' + esc(name) + '</h3>' +
      '<button class="close" id="tclose" aria-label="Close">×</button></div>' +
    '<p class="cap">' + (last
      ? num(last.residents) + ' residents · ' + num(last.chunks) + ' chunks · ' + gold(last.balance)
      : 'no snapshot yet') + '</p>' +
    '<canvas id="cTown"></canvas>' +
    '<div class="keys">' +
      '<span><i style="background:#189d4d"></i>Residents ' + chg('residents') + '</span>' +
      '<span><i style="background:#e0a92a"></i>Chunks ' + chg('chunks') + '</span>' +
    '</div>' +
    '<div id="townlog"></div>' +
    '</div>';

  drawSeries($('cTown'), openTownSeries, {
    lines: [
      { key:'residents', color:'#189d4d', width:2 },
      { key:'chunks', color:'#e0a92a', width:2 },
    ],
    emptyText: 'No history for this town yet',
  });

  var close = $('tclose');
  if (close) close.addEventListener('click', function(){
    openTown = null; openTownSeries = null; host.innerHTML = '';
  });

  /* That town's own comings and goings, under its chart. */
  try {
    var ev = await api('/api/nation/events?days=' + days + '&limit=10&town=' + encodeURIComponent(name));
    var box = $('townlog');
    if (box){
      box.innerHTML = ev.events.length
        ? '<div class="log" style="margin-top:.8rem">' + ev.events.map(function(e){
            var t = EV[e.kind];
            return t ? '<div class="ev ' + t.cls + '"><span class="ico">' + t.ico + '</span>' +
              '<span>' + t.text(e) + '</span></div>' : '';
          }).join('') + '</div>'
        : '<p class="note">No comings or goings recorded for this town.</p>';
    }
  } catch (_e) { /* the chart above is the point; this is a bonus */ }

  host.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* --- town table ----------------------------------------------------------- */
var COLS = [
  { k:'town_name', h:'Town', get:function(r){ return esc(r.town_name); }, cls:'name' },
  { k:'residents', h:'Residents', n:true, get:function(r){ return num(r.residents); } },
  { k:'chunks',    h:'Chunks',    n:true, get:function(r){ return num(r.chunks); } },
  { k:'balance',   h:'Bank',      n:true, get:function(r){ return gold(r.balance); } },
];

function townTable(){
  var rows = (hist.towns || []).filter(function(r){
    return !search || r.town_name.toLowerCase().indexOf(search.toLowerCase()) >= 0;
  });
  rows.sort(function(a, b){
    var x = a[sortKey], y = b[sortKey];
    if (typeof x === 'string') return sortDir * String(x).localeCompare(String(y));
    return sortDir * ((x || 0) - (y || 0));
  });

  if (!rows.length){
    return '<p class="empty">' + (search
      ? 'No town matches “' + esc(search) + '”.'
      : 'No towns recorded yet — the first sweep will fill this in.') + '</p>';
  }

  return '<table><thead><tr>' + COLS.map(function(c){
      return '<th data-k="' + c.k + '"' + (c.n ? ' style="text-align:right"' : '') + '>' +
        esc(c.h) + (sortKey === c.k ? (sortDir < 0 ? ' ↓' : ' ↑') : '') + '</th>';
    }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr class="pick" data-town="' + esc(r.town_name) + '">' +
        COLS.map(function(c){
          return '<td class="' + (c.n ? 'n ' : '') + (c.cls || '') + '">' + c.get(r) + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
}

function render(){
  var latest = (hist.series || [])[(hist.series || []).length - 1] || {};

  var out = '<div class="stats">' +
      '<div class="stat res"><span class="n">' + num(latest.residents) + '</span>' +
        '<span class="k">Residents</span>' + deltaText('residents') + '</div>' +
      '<div class="stat twn"><span class="n">' + num(latest.towns) + '</span>' +
        '<span class="k">Towns</span>' + deltaText('towns') + '</div>' +
      '<div class="stat chk"><span class="n">' + num(latest.chunks) + '</span>' +
        '<span class="k">Chunks</span>' + deltaText('chunks') + '</div>' +
      '<div class="stat bal"><span class="n">' + gold(latest.balance) + '</span>' +
        '<span class="k">Town banks combined</span>' + deltaText('balance', 'g') + '</div>' +
    '</div>';

  out += '<div class="tools">' +
    '<div class="f" style="flex:0 0 10rem"><label for="days">Period</label>' +
      '<select id="days">' + [1, 3, 7, 30, 90, 365].map(function(d){
        return '<option value="' + d + '"' + (days === d ? ' selected' : '') + '>' +
          (d === 365 ? 'Year' : d === 1 ? 'Today' : d + ' days') + '</option>'; }).join('') +
      '</select></div>' +
      '<span class="note" style="margin:0 0 .5rem .2rem">' +
        (hist.hourly ? 'hourly points' : 'daily averages') + '</span>' +
      '</div>';

  out += '<div class="chartwrap"><h3>Residents</h3>' +
      '<p class="cap">Everyone living in an Ethiopian town, day by day.</p>' +
      '<canvas id="cPeople"></canvas></div>' +
    '<div class="chartwrap"><h3>Land</h3>' +
      '<p class="cap">Total chunks claimed across every town.</p>' +
      '<canvas id="cLand"></canvas></div>' +
    '<div class="chartwrap"><h3>Towns</h3>' +
      '<p class="cap">How many towns fly the flag.</p>' +
      '<canvas id="cTowns"></canvas></div>';

  out += '<div class="section-head"><h2>Towns</h2>' +
    '<span class="meta">click one for its own history</span></div>' +
    '<div class="tools"><div class="f"><label for="q">Search towns</label>' +
      '<input id="q" placeholder="Addis, Gondar…" value="' + esc(search) + '"></div></div>' +
    '<div id="tpanel"></div>' +
    '<div id="towntable">' + townTable() + '</div>';

  out += '<div class="section-head"><h2>Comings and goings</h2>' +
    '<span class="meta">detected hourly — the time is when it was noticed</span></div>' +
    '<div id="log">' + renderLog() + '</div>';

  $('body').innerHTML = out;
  paintCharts();
  wire();

  /* pagetext.js runs once at load, over the [data-slot] elements present at
     that moment. Everything above was rendered after an await. */
  if (window.ethiopiaPageText) window.ethiopiaPageText.reapply();
}

function wire(){
  var d = $('days');
  if (d) d.addEventListener('change', function(){
    days = Number(d.value); openTown = null; evPage = 0; load();
  });

  var q = $('q');
  if (q) q.addEventListener('input', function(){
    search = q.value;
    $('towntable').innerHTML = townTable();
    wireTable();
  });

  wireTable();
  wireLog();
}

function wireTable(){
  document.querySelectorAll('#towntable th[data-k]').forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
      $('towntable').innerHTML = townTable();
      wireTable();
    });
  });
  document.querySelectorAll('#towntable tr[data-town]').forEach(function(tr){
    tr.addEventListener('click', function(){ showTown(tr.dataset.town); });
  });
}

function wireLog(){
  var p = $('evPrev'), n = $('evNext');
  if (p) p.addEventListener('click', function(){ if (evPage > 0){ evPage--; loadLog(); } });
  if (n) n.addEventListener('click', function(){ evPage++; loadLog(); });
}

async function loadLog(){
  try {
    events = await api('/api/nation/events?days=' + days +
      '&limit=' + EV_PAGE + '&offset=' + (evPage * EV_PAGE));
    $('log').innerHTML = renderLog();
    wireLog();
  } catch (e){
    $('log').innerHTML = '<p class="empty">Could not load the log: ' + esc(e.message) + '</p>';
  }
}

function renderAuth(){
  var slot = $('authSlot');
  if (me && me.signedIn){
    slot.innerHTML = '<button class="btn" type="button" id="signout">' +
      esc(me.discordName || 'Signed in') + ' \u00b7 ' + esc(me.tier) + '</button>';
    $('signout').addEventListener('click', async function(){
      try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {}
      location.reload();
    });
  } else {
    slot.innerHTML = '<a class="btn" href="' + API + '/api/auth/login?redirect=' +
      encodeURIComponent('/growth.html') + '">Sign in with Discord</a>';
  }
}

async function load(){
  try { me = await api('/api/me'); } catch (e) { me = null; }
  try { renderAuth(); } catch (e) { /* header only */ }

  try {
    hist = await api('/api/nation/history?days=' + days);
  } catch (e){
    if (e.status === 401){
      $('body').innerHTML = '<p class="empty">Sign in as a verified citizen of Ethiopia ' +
        'to see the nation\'s history.</p>';
      $('stamp').textContent = 'Not signed in';
      return;
    }
    throw e;
  }

  try {
    events = await api('/api/nation/events?days=' + days + '&limit=' + EV_PAGE);
  } catch (_e) { events = { events: [], total: 0 }; }

  render();

  var s = hist.series || [];
  $('stamp').textContent = s.length
    ? s.length + (hist.hourly ? ' hourly points' : ' days') + ' recorded'
    : 'no history yet';
}

var resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    paintCharts();
    if (openTownSeries && $('cTown')){
      drawSeries($('cTown'), openTownSeries, {
        lines: [
          { key:'residents', color:'#189d4d', width:2 },
          { key:'chunks', color:'#e0a92a', width:2 },
        ],
      });
    }
  }, 180);
});

load().catch(fatal);
</script>
<script src="assets/pagetext.js?v=1"></script>
</body>
