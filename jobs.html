<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job board · EMC Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&family=Martian+Mono:wght@400;600&family=Noto+Serif+Ethiopic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=2">
<style>
.back{ display:inline-block; font-family:var(--data); font-size:var(--step--1);
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-low); text-decoration:none; }
.back:hover{ color:var(--gold); }
.topbar{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:1.4rem; }
.topbar .spacer{ margin-left:auto; }
.masthead{ border-bottom:1px solid var(--rule); padding-bottom:1.1rem; margin-bottom:1.2rem; }
.masthead h1{ font-size:var(--step-3); letter-spacing:-.03em; }
.masthead .sub{ font-family:var(--data); font-size:var(--step--1); letter-spacing:.15em;
  text-transform:uppercase; color:var(--gold); margin:.5rem 0 0; }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr)); gap:.6rem; margin-bottom:1.2rem; }
.stat{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--accent,var(--rule)); border-radius:3px; padding:.75rem .9rem; }
.stat .n{ font-family:var(--data); font-weight:600; font-size:var(--step-1);
  font-variant-numeric:tabular-nums; display:block; letter-spacing:-.02em; }
.stat .k{ font-family:var(--data); font-size:.62rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-low); display:block; margin-top:.2rem; }
.stat.o{ --accent:var(--gold); } .stat.o .n{ color:var(--gold); }
.stat.m{ --accent:var(--green); } .stat.m .n{ color:var(--green); }
.stat.b{ --accent:var(--blue); }

.depts{ display:flex; gap:.3rem; flex-wrap:wrap; margin-bottom:1rem; }
.dept{ font-family:var(--data); font-size:.72rem; padding:.35rem .7rem;
  background:var(--ink-raised); border:1px solid var(--rule); border-radius:2px;
  color:var(--text-mid); cursor:pointer; }
.dept:hover{ border-color:var(--gold-dim); color:var(--text); }
.dept.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600; }

/* The board scrolls on its own so the department filter and totals stay put
   while you work down a long queue. */
.boardwrap{ max-height:34rem; overflow-y:auto; padding-right:.2rem;
  border:1px solid var(--rule); border-radius:3px; background:var(--ink); }
.board{ display:flex; flex-direction:column; }
.j{ padding:.85rem 1rem; border-bottom:1px solid var(--rule-soft);
  border-left:3px solid var(--sv,var(--rule)); }
.j:last-child{ border-bottom:none; }
.j.prio{ background:rgba(237,185,18,.05); }
.j.mine{ background:rgba(24,157,77,.06); }
.j.svc-recruiting{ --sv:var(--green); }
.j.svc-mapart{ --sv:var(--gold); }
.j.svc-media{ --sv:var(--red); }
.j.svc-claimmap{ --sv:var(--blue); }
.j.svc-bulk{ --sv:var(--text-low); }
.j-head{ display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
.j-title{ font-family:var(--display); font-weight:600; font-size:var(--step-0); }
.tag{ font-family:var(--data); font-size:.6rem; letter-spacing:.05em; text-transform:uppercase;
  padding:.1rem .35rem; border:1px solid var(--rule); border-radius:2px; color:var(--text-low); }
.tag.svc{ color:var(--sv); border-color:var(--sv); }
.tag.p{ color:var(--gold); border-color:var(--gold-dim); }
.tag.st-active{ color:var(--green); border-color:var(--green-dim); }
.tag.st-done{ color:var(--blue); border-color:var(--blue); }
.tag.st-cancelled{ color:var(--text-low); border-style:dashed; }
.j-pay{ margin-left:auto; font-family:var(--data); font-weight:600; font-size:var(--step-1);
  color:var(--green); font-variant-numeric:tabular-nums; white-space:nowrap; }
.j-meta{ font-family:var(--data); font-size:.68rem; color:var(--text-low); margin-top:.35rem; }
.j-details{ color:var(--text-mid); font-size:var(--step--1); margin-top:.4rem; }
.j-acts{ display:flex; gap:.35rem; margin-top:.6rem; flex-wrap:wrap; align-items:center; }
.j-acts .btn{ padding:.28rem .6rem; font-size:.68rem; }
.split{ font-family:var(--data); font-size:.64rem; color:var(--text-low); }

.section-head{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap;
  border-bottom:1px solid var(--rule); padding-bottom:.7rem; margin:2rem 0 1rem; }
.section-head h2{ font-size:var(--step-2); }
.section-head .meta{ margin-left:auto; font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }

.brow{ display:flex; align-items:baseline; gap:.7rem; padding:.5rem .1rem;
  border-bottom:1px solid var(--rule-soft); font-family:var(--data); font-size:.72rem; flex-wrap:wrap; }
.brow .bnote{ color:var(--text-mid); flex:1 1 10rem; }
.brow .bwhen{ color:var(--text-low); font-size:.64rem; white-space:nowrap; }
.brow .bamt{ margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; }
.brow .bamt.pos{ color:var(--green); } .brow .bamt.neg{ color:var(--red); }

.admin{ margin-top:2rem; border:1px dashed var(--rule); border-radius:3px;
  padding:1.1rem 1.2rem; background:var(--ink-raised); }
.admin h2{ font-size:var(--step-1); margin-bottom:.2rem; }
.admin .hint{ color:var(--text-low); font-size:var(--step--1); margin:0 0 1rem; }
.admin fieldset{ border:none; padding:0; margin:0 0 1.3rem; }
.admin legend{ font-family:var(--data); font-size:var(--step--1); letter-spacing:.08em;
  text-transform:uppercase; color:var(--gold); padding:0; margin-bottom:.6rem; }
.fields{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:flex-end; }
.f{ display:flex; flex-direction:column; gap:.25rem; }
.f label{ font-family:var(--data); font-size:.62rem; color:var(--text-low); letter-spacing:.05em; }
.f input, .f select{ background:var(--ink); color:var(--text); border:1px solid var(--rule);
  border-radius:2px; padding:.4rem .5rem; font-family:var(--data); font-size:.76rem; min-width:8rem; }
.f input:focus, .f select:focus{ border-color:var(--gold); }
.f.wide{ flex:1 1 14rem; } .f.wide input{ width:100%; }
.preview{ font-family:var(--data); font-size:.7rem; color:var(--gold); margin-top:.5rem; }
.msg{ font-family:var(--data); font-size:var(--step--1); margin-top:.6rem; min-height:1.1em; }
.msg.ok{ color:var(--green); } .msg.err{ color:var(--red); }
.empty{ border:1px dashed var(--rule); border-radius:3px; padding:1.4rem; text-align:center;
  color:var(--text-mid); font-size:var(--step--1); }
footer{ margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }
</style>
</head>
<body>
<div class="flag-edge" aria-hidden="true"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="index.html">&#8592; <span data-en="Ecosystem" data-am="ሥርዓት">Ecosystem</span></a>
    <span class="spacer"></span>
    <div class="lang" role="group" aria-label="Language">
      <button class="btn" type="button" data-set-lang="en" aria-pressed="true">EN</button>
      <button class="btn" type="button" data-set-lang="am" aria-pressed="false" lang="am">አማርኛ</button>
    </div>
    <span id="authSlot"></span>
  </div>

  <header class="masthead">
    <h1 data-en="Job board" data-am="የሥራ ሰሌዳ">Job board</h1>
    <p class="sub">EMC Services</p>
  </header>

  <div id="body">
    <div class="stats">
      <div class="stat o"><span class="n" id="sOpen">&mdash;</span><span class="k" data-en="Open jobs" data-am="ክፍት ሥራዎች">Open jobs</span></div>
      <div class="stat"><span class="n" id="sValue">&mdash;</span><span class="k" data-en="Up for grabs" data-am="የሚገኝ ክፍያ">Up for grabs</span></div>
      <div class="stat m"><span class="n" id="sMine">&mdash;</span><span class="k" data-en="Yours" data-am="ያንተ">Yours</span></div>
      <div class="stat b"><span class="n" id="sBank">&mdash;</span><span class="k" data-en="Company bank" data-am="የኩባንያ ባንክ">Company bank</span></div>
    </div>

    <div class="depts" id="depts"></div>
    <div class="boardwrap"><div id="board"><p class="empty">Loading…</p></div></div>

    <div class="section-head">
      <h2 data-en="Company bank" data-am="የኩባንያ ባንክ">Company bank</h2>
      <span class="meta" id="bankMeta">&mdash;</span>
    </div>
    <div id="bank"><p class="empty">Loading…</p></div>

    <section class="admin" id="adminPanel" hidden>
      <h2 data-en="Manage" data-am="አስተዳደር">Manage</h2>
      <p class="hint">Treasurers and managers only.</p>

      <fieldset>
        <legend>Post a job</legend>
        <div class="fields">
          <div class="f"><label for="nSvc">Department</label>
            <select id="nSvc">
              <option value="recruiting">Recruiting</option>
              <option value="mapart">Mapart</option>
              <option value="media">Media</option>
              <option value="claimmap">Claim map</option>
              <option value="bulk">Bulk</option>
            </select></div>
          <div class="f"><label for="nPrio">Priority</label>
            <select id="nPrio"><option value="0">Regular</option><option value="1">Priority</option></select></div>
          <div class="f"><label for="nQty">How many</label>
            <input id="nQty" inputmode="numeric" value="1" style="min-width:5rem"></div>
          <div class="f"><label for="nPrice">Gold each</label>
            <input id="nPrice" inputmode="numeric" placeholder="from rate card" style="min-width:7rem"></div>
          <div class="f"><label for="nCut">Company keeps each</label>
            <input id="nCut" inputmode="numeric" placeholder="from rate card" style="min-width:7rem"></div>
        </div>
        <div class="fields" style="margin-top:.5rem">
          <div class="f"><label for="nCustomer">Customer</label>
            <input id="nCustomer" placeholder="who ordered it" maxlength="80"></div>
          <div class="f wide"><label for="nTitle">Title</label>
            <input id="nTitle" placeholder="Recruit 10 for Addis" maxlength="120"></div>
        </div>
        <div class="fields" style="margin-top:.5rem">
          <div class="f wide" style="flex:1 1 100%"><label for="nDetails">Details</label>
            <input id="nDetails" placeholder="anything the worker needs to know" maxlength="1000"></div>
          <button class="btn" type="button" id="postJob">Post</button>
        </div>
        <p class="preview" id="preview"></p>
        <p class="msg" id="jobMsg"></p>
      </fieldset>

      <fieldset style="margin-bottom:0">
        <legend>Company bank entry</legend>
        <div class="fields">
          <div class="f"><label for="cKind">Kind</label>
            <select id="cKind">
              <option value="deposit">Deposit</option>
              <option value="bonus">Bonus</option>
              <option value="platform">Mapart platform</option>
              <option value="advertising">Advertising</option>
              <option value="expense">Other expense</option>
            </select></div>
          <div class="f"><label for="cAmount">Gold</label>
            <input id="cAmount" inputmode="numeric" placeholder="50" style="min-width:6rem"></div>
          <div class="f wide"><label for="cNote">What for</label>
            <input id="cNote" placeholder="reason" maxlength="300"></div>
          <button class="btn" type="button" id="postEntry">Record</button>
        </div>
        <p class="msg" id="bankMsg"></p>
      </fieldset>
    </section>
  </div>

  <footer><span>EMC Services</span><span id="stamp">&nbsp;</span></footer>
</div>

<script>
'use strict';
var API = 'https://earthmc-ethiopia-proxy.ethiopianempire2.workers.dev';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
var gold = function(n){ return (Number(n) || 0).toLocaleString('en-US') + 'g'; };
var when = function(s){
  if (!s) return '';
  var d = new Date(s + (/[Zz]|[+-]\d{2}:?\d{2}$/.test(s) ? '' : 'Z'));
  return isNaN(d) ? s : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
};

var me = null, data = null, bank = null, dept = '';

async function api(path, opts){
  var res = await fetch(API + path, Object.assign({ credentials:'include' }, opts || {}));
  var d = null;
  try { d = await res.json(); } catch (e) {}
  if (!res.ok){ var err = new Error((d && d.error) || ('HTTP ' + res.status)); err.status = res.status; throw err; }
  return d;
}

function applyLang(lang){
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang === 'am' ? 'am' : 'en');
  document.querySelectorAll('[data-en]').forEach(function(el){
    var t = el.getAttribute(lang === 'am' ? 'data-am' : 'data-en'); if (t) el.textContent = t; });
  document.querySelectorAll('[data-set-lang]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.getAttribute('data-set-lang') === lang)); });
  try { localStorage.setItem('ethiopia-lang', lang); } catch (e) {}
}
document.querySelectorAll('[data-set-lang]').forEach(function(b){
  b.addEventListener('click', function(){ applyLang(b.getAttribute('data-set-lang')); }); });
try { if (localStorage.getItem('ethiopia-lang') === 'am') applyLang('am'); } catch (e) {}

/* --- board ---------------------------------------------------------------- */

var LABEL = { recruiting:'Recruiting', mapart:'Mapart', media:'Media',
              claimmap:'Claim map', bulk:'Bulk' };

function renderDepts(){
  var counts = {};
  data.jobs.forEach(function(j){ counts[j.service] = (counts[j.service] || 0) + 1; });
  var all = Object.keys(LABEL);
  $('depts').innerHTML =
    '<span class="dept' + (dept === '' ? ' on' : '') + '" data-d="">All · ' + data.jobs.length + '</span>' +
    all.map(function(s){
      return '<span class="dept' + (dept === s ? ' on' : '') + '" data-d="' + s + '">' +
        LABEL[s] + ' · ' + (counts[s] || 0) + '</span>';
    }).join('');
  $('depts').querySelectorAll('[data-d]').forEach(function(el){
    el.addEventListener('click', function(){ dept = el.dataset.d; renderDepts(); renderBoard(); });
  });
}

function jobRow(j){
  var cls = 'j svc-' + j.service + (j.priority ? ' prio' : '') + (j.isMine ? ' mine' : '');
  var tags = '<span class="tag svc">' + esc(LABEL[j.service] || j.service) + '</span>' +
    (j.priority ? '<span class="tag p">priority</span>' : '') +
    (j.status !== 'queued' ? '<span class="tag st-' + esc(j.status) + '">' + esc(j.status) + '</span>' : '') +
    (j.paidAt ? '<span class="tag st-done">paid</span>' : '');

  // The number shown large is what the WORKER takes home, not what the
  // customer pays — that is the figure someone deciding whether to claim
  // actually cares about.
  var acts = '';
  if (j.status === 'queued'){
    acts += '<button class="btn" type="button" data-claim="' + j.id + '">Claim</button>';
  } else if (j.isMine && j.status === 'active'){
    acts += '<button class="btn" type="button" data-act="complete" data-id="' + j.id + '">Mark done</button>' +
            '<button class="btn" type="button" data-act="release" data-id="' + j.id + '">Give back</button>';
  }
  if (data.canManage){
    if (j.status === 'done' && !j.paidAt)
      acts += '<button class="btn" type="button" data-act="paid" data-id="' + j.id + '">Worker paid</button>';
    if (j.status !== 'cancelled' && !j.paidAt)
      acts += '<button class="btn" type="button" data-act="cancel" data-id="' + j.id + '">Cancel</button>';
  }
  if (acts) acts += '<span class="split">customer ' + gold(j.total) +
    ' · company ' + gold(j.companyCut) + '</span>';

  return '<div class="' + cls + '">' +
    '<div class="j-head"><span class="j-title">' +
      esc(j.title || (LABEL[j.service] || j.service) +
        (j.quantity > 1 ? ' \u00d7 ' + j.quantity : '')) + '</span>' + tags +
    '<span class="j-pay">' + gold(j.workerPay) + '</span></div>' +
    '<div class="j-meta">#' + j.id +
      (j.quantity > 1 ? ' · ' + j.quantity + ' \u00d7 ' + gold(j.unitPrice) : '') +
      (j.customer ? ' · for ' + esc(j.customer) : '') +
      (j.assignee ? ' · taken by ' + esc(j.assignee) : '') +
      ' · ' + esc(when(j.createdAt)) + '</div>' +
    (j.details ? '<div class="j-details">' + esc(j.details) + '</div>' : '') +
    (acts ? '<div class="j-acts">' + acts + '</div>' : '') +
  '</div>';
}

function renderBoard(){
  var host = $('board');
  var shown = dept ? data.jobs.filter(function(j){ return j.service === dept; }) : data.jobs;
  if (!shown.length){
    host.innerHTML = '<p class="empty">Nothing here yet.</p>';
    return;
  }
  host.innerHTML = '<div class="board">' + shown.map(jobRow).join('') + '</div>';

  host.querySelectorAll('[data-claim]').forEach(function(b){
    b.addEventListener('click', async function(){
      try { await api('/api/jobs/claim', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: Number(b.dataset.claim) }) });
        load();
      } catch (e){ alert(e.message); load(); }
    });
  });

  host.querySelectorAll('[data-act]').forEach(function(b){
    b.addEventListener('click', async function(){
      var act = b.dataset.act;
      if (act === 'cancel' && !confirm('Cancel this job?')) return;
      if (act === 'paid' && !confirm(
        'Record that the worker has been paid?\n\n' +
        "This books the company's cut into the bank. The worker's own pay goes " +
        'from the customer to them directly and is not recorded here.')) return;
      try {
        await api('/api/jobs/update', { method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id: Number(b.dataset.id), action: act }) });
        load();
      } catch (e){ alert(e.message); load(); }
    });
  });
}

function renderBank(){
  if (!bank){ $('bank').innerHTML = '<p class="empty">Unavailable.</p>'; return; }
  $('bankMeta').textContent = gold(bank.balance) + ' · ' + gold(bank.earned) +
    ' earned, ' + gold(bank.spent) + ' spent';
  if (!bank.entries.length){
    $('bank').innerHTML = '<p class="empty">Nothing recorded yet.</p>';
    return;
  }
  $('bank').innerHTML = bank.entries.map(function(e){
    return '<div class="brow">' +
      '<span class="bwhen">' + esc(when(e.at)) + '</span>' +
      '<span class="tag">' + esc(e.kind) + '</span>' +
      '<span class="bnote">' + esc(e.note || '') + '</span>' +
      '<span class="bwhen">' + esc(e.actor) + '</span>' +
      '<span class="bamt ' + (e.amount < 0 ? 'neg' : 'pos') + '">' +
        (e.amount < 0 ? '' : '+') + gold(e.amount) + '</span></div>';
  }).join('');
}

/* --- admin ---------------------------------------------------------------- */

function rateFor(service, priority){
  if (!data || !data.rates) return null;
  return data.rates.filter(function(r){
    return r.service === service && r.priority === priority; })[0] ||
    data.rates.filter(function(r){ return r.service === service && !r.priority; })[0] || null;
}

function updatePreview(){
  var svc = $('nSvc').value, prio = $('nPrio').value === '1';
  var rate = rateFor(svc, prio);
  var qty = Math.max(1, parseInt($('nQty').value, 10) || 1);
  var price = $('nPrice').value !== '' ? Number($('nPrice').value)
    : (rate ? rate.unitPrice : 0);
  var cut = $('nCut').value !== '' ? Number($('nCut').value) : (rate ? rate.unitCut : 0);

  $('nPrice').placeholder = rate ? String(rate.unitPrice) : 'gold';
  $('nCut').placeholder = rate ? String(rate.unitCut) : 'gold';

  if (!price){ $('preview').textContent = 'Set a price — this department has no rate on the card.'; return; }
  // Spelling the split out before posting means nobody has to trust the maths.
  $('preview').textContent =
    'Customer pays ' + gold(price * qty) + ' · worker takes ' + gold((price - cut) * qty) +
    ' · company keeps ' + gold(cut * qty) +
    (rate && rate.unitName ? ' (' + qty + ' \u00d7 ' + rate.unitName + ')' : '');
}

function wireAdmin(){
  $('adminPanel').hidden = false;
  ['nSvc','nPrio','nQty','nPrice','nCut'].forEach(function(id){
    $(id).addEventListener('input', updatePreview);
    $(id).addEventListener('change', updatePreview);
  });
  updatePreview();

  $('postJob').addEventListener('click', async function(){
    var msg = $('jobMsg');
    try {
      var body = {
        service: $('nSvc').value,
        priority: $('nPrio').value === '1',
        quantity: Math.max(1, parseInt($('nQty').value, 10) || 1),
        customer: $('nCustomer').value.trim(),
        title: $('nTitle').value.trim(),
        details: $('nDetails').value.trim()
      };
      if ($('nPrice').value !== '') body.unitPrice = Number($('nPrice').value);
      if ($('nCut').value !== '') body.unitCut = Number($('nCut').value);
      var r = await api('/api/jobs', { method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      msg.textContent = 'Posted. Worker takes ' + gold(r.workerPay) +
        ', company keeps ' + gold(r.companyCut) + '.';
      msg.className = 'msg ok';
      ['nCustomer','nTitle','nDetails','nPrice','nCut'].forEach(function(id){ $(id).value = ''; });
      $('nQty').value = '1';
      load();
    } catch (e){ msg.textContent = e.message; msg.className = 'msg err'; }
  });

  $('postEntry').addEventListener('click', async function(){
    var msg = $('bankMsg');
    try {
      var r = await api('/api/company/entry', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ kind: $('cKind').value, amount: Number($('cAmount').value),
                               note: $('cNote').value.trim() }) });
      msg.textContent = 'Recorded. Bank now holds ' + gold(r.balance) + '.';
      msg.className = 'msg ok';
      $('cAmount').value = ''; $('cNote').value = '';
      load();
    } catch (e){ msg.textContent = e.message; msg.className = 'msg err'; }
  });
}

/* --- auth ----------------------------------------------------------------- */

function renderAuth(){
  var slot = $('authSlot');
  if (me && me.signedIn){
    slot.innerHTML = '<button class="btn" type="button" id="signout">' +
      esc(me.discordName || 'Signed in') + ' \u00b7 ' + esc(me.tier) + '</button>';
    $('signout').addEventListener('click', async function(){
      try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {}
      location.reload();
    });
  } else {
    slot.innerHTML = '<a class="btn" href="' + API + '/api/auth/login?redirect=' +
      encodeURIComponent('/jobs.html') + '">Sign in with Discord</a>';
  }
}

async function load(){
  try { me = await api('/api/me'); } catch (e) { me = null; }
  renderAuth();
  try {
    data = await api('/api/jobs');
    try { bank = await api('/api/company'); } catch (e) { bank = null; }

    $('sOpen').textContent = data.summary.open;
    $('sValue').textContent = gold(data.summary.openValue);
    $('sMine').textContent = data.summary.mine;
    $('sBank').textContent = gold(data.companyBalance);

    renderDepts();
    renderBoard();
    renderBank();
    if (data.canManage && $('adminPanel').hidden) wireAdmin();
    $('stamp').textContent = data.summary.awaitingPay
      ? data.summary.awaitingPay + ' done, awaiting payment'
      : 'Up to date';
  } catch (err){
    $('body').innerHTML = '<p class="empty">' + esc(
      err.status === 401 ? 'Sign in with Discord to see the job board.'
      : err.status === 503 ? 'Migration 011 has not been applied to the database yet.'
      : 'Job board unavailable: ' + err.message) + '</p>';
    $('stamp').textContent = err.status === 401 ? 'Not signed in' : 'Unavailable';
  }
}

load();
</script>
</body>
</html>
