<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop · Ethiopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=2">
<style>
.back{ display:inline-block; font-family:var(--data); font-size:var(--step--1);
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-low); text-decoration:none; }
.back:hover{ color:var(--gold); }
.topbar{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:1.4rem; }
.topbar .spacer{ margin-left:auto; }
.masthead{ border-bottom:1px solid var(--rule); padding-bottom:1.1rem; margin-bottom:1.2rem; }
.masthead h1{ font-size:var(--step-3); letter-spacing:-.03em; }
.masthead .sub{ font-family:var(--data); font-size:var(--step--1); letter-spacing:.15em;
  text-transform:uppercase; color:var(--gold); margin:.5rem 0 0; }

/* ---------------------------------------------------------------------------
   THE FLOOR
   The plan is the point of this page, so it gets the space and everything else
   sits under it. Drawn from the building's real block data, which is why the
   aisles read as aisles: the green/gold/red down the spine is the carpet that
   is actually there, in the palette the site already uses.
   --------------------------------------------------------------------------- */
.floorwrap{ position:relative; border:1px solid var(--rule); border-radius:3px;
  background:#0b0a08; overflow:hidden; touch-action:none; }
#floor{ display:block; width:100%; height:auto; cursor:grab; }
#floor.dragging{ cursor:grabbing; }

.floorbar{ display:flex; gap:.35rem; align-items:center; flex-wrap:wrap; margin-bottom:.6rem; }
.lv{ font-family:var(--data); font-size:.72rem; padding:.35rem .7rem; background:var(--ink-raised);
  border:1px solid var(--rule); border-radius:2px; color:var(--text-mid); cursor:pointer; }
.lv:hover{ border-color:var(--gold-dim); color:var(--text); }
.lv.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600; }
.zoom{ margin-left:auto; display:flex; gap:.25rem; }
.zoom button{ font-family:var(--data); font-size:.8rem; width:2rem; height:1.9rem; line-height:1;
  background:var(--ink-raised); border:1px solid var(--rule); border-radius:2px;
  color:var(--text-mid); cursor:pointer; }
.zoom button:hover{ border-color:var(--gold-dim); color:var(--gold); }

/* Barrel states carry meaning, so they are the only saturated things on the
   plan. Everything structural stays near the ground colour. */
.b-empty{ fill:#2a241c; stroke:#3a3229; stroke-width:.06; }
.b-sell { fill:var(--green); stroke:#0a3f1e; stroke-width:.06; }
.b-buy  { fill:var(--blue);  stroke:#0d2c53; stroke-width:.06; }
.b-low  { fill:var(--red);   stroke:#5c0f13; stroke-width:.06; }
.b-hit  { fill:transparent; cursor:pointer; }
.b-sel  { fill:none; stroke:var(--gold); stroke-width:.28; }
.itemtag{ font-family:var(--data); font-size:.42px; fill:var(--text); paint-order:stroke;
  stroke:#0b0a08; stroke-width:.14px; text-anchor:middle; pointer-events:none; }
/* Minecraft art is 16 pixels square. Left to itself the browser blurs it into
   mush at this scale, so nearest-neighbour is not a style choice here. */
#floor image{ image-rendering:pixelated; pointer-events:none; }
.dicon{ width:1.1rem; height:1.1rem; image-rendering:pixelated;
  vertical-align:-.15rem; margin-right:.4rem; }

.legend{ display:flex; gap:.9rem; flex-wrap:wrap; margin-top:.6rem;
  font-family:var(--data); font-size:.64rem; color:var(--text-low); }
.legend i{ display:inline-block; width:.62rem; height:.62rem; border-radius:1px;
  margin-right:.3rem; vertical-align:-1px; }

/* --- the detail card slides over the plan rather than pushing it down, so the
       barrel you clicked stays where you clicked it --- */
.detail{ position:absolute; left:.6rem; right:.6rem; bottom:.6rem; max-width:22rem;
  background:rgba(16,14,11,.96); border:1px solid var(--rule); border-left:3px solid var(--gold);
  border-radius:3px; padding:.8rem .9rem; }
.detail h3{ font-size:var(--step-0); margin:0 0 .1rem; }
.detail .coords{ font-family:var(--data); font-size:.62rem; color:var(--text-low); margin:0 0 .5rem; }
.detail .close{ position:absolute; top:.5rem; right:.6rem; background:none; border:0;
  color:var(--text-low); font-size:1rem; cursor:pointer; line-height:1; }
.detail .close:hover{ color:var(--gold); }

.kv{ display:flex; justify-content:space-between; gap:.6rem; font-family:var(--data);
  font-size:.7rem; padding:.26rem 0; border-bottom:1px solid var(--rule-soft); }
.kv:last-child{ border-bottom:none; }
.kv dt{ color:var(--text-low); margin:0; }
.kv dd{ margin:0; color:var(--text); font-variant-numeric:tabular-nums; text-align:right; }
.kv dd.g{ color:var(--green); } .kv dd.gold{ color:var(--gold); } .kv dd.r{ color:var(--red); }

.section-head{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap;
  border-bottom:1px solid var(--rule); padding-bottom:.7rem; margin:2rem 0 .9rem; }
.section-head h2{ font-size:var(--step-1); }
.section-head .meta{ margin-left:auto; font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); gap:.7rem; margin-bottom:1.4rem; }
.stat{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--accent,var(--rule)); border-radius:3px; padding:.85rem 1rem; }
.stat .n{ font-family:var(--data); font-weight:600; font-size:var(--step-1);
  font-variant-numeric:tabular-nums; display:block; }
.stat .k{ font-family:var(--data); font-size:.62rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-low); display:block; margin-top:.2rem; }
.stat.in{ --accent:var(--green); } .stat.in .n{ color:var(--green); }
.stat.out{ --accent:var(--blue); }
.stat.net{ --accent:var(--gold); } .stat.net .n{ color:var(--gold); }
.stat.warn{ --accent:var(--red); } .stat.warn .n{ color:var(--red); }

.tools{ display:flex; gap:.4rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:.8rem; }
.f{ display:flex; flex-direction:column; gap:.25rem; flex:1 1 12rem; }
.f label{ font-family:var(--data); font-size:.62rem; color:var(--text-low); }
.f input, .f select{ background:var(--ink); color:var(--text); border:1px solid var(--rule);
  border-radius:2px; padding:.42rem .55rem; font-family:var(--body); font-size:.84rem; width:100%; }
.f input:focus, .f select:focus{ border-color:var(--gold); outline:none; }

table{ width:100%; border-collapse:collapse; font-size:var(--step--1); }
th{ font-family:var(--data); font-size:.62rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-low); text-align:left; font-weight:400; padding:.45rem .5rem;
  border-bottom:1px solid var(--rule); cursor:pointer; }
th:hover{ color:var(--gold); }
td{ padding:.45rem .5rem; border-bottom:1px solid var(--rule-soft);
  font-family:var(--data); font-size:.72rem; font-variant-numeric:tabular-nums; }
td.n{ text-align:right; }
td.name{ color:var(--text); font-weight:600; font-family:var(--body); }
tr.pick{ cursor:pointer; }
tr.pick:hover td{ background:var(--ink-raised); }
.pos{ color:var(--green); } .neg{ color:var(--red); } .zero{ color:var(--text-low); }
.bar{ height:.3rem; background:var(--ink); border-radius:999px; overflow:hidden; margin-top:.22rem; }
.bar span{ display:block; height:100%; background:var(--green); border-radius:999px; }

/* Canvas rather than a charting library, matching treasury.html: a couple of
   lines on a dark ground does not justify the dependency, and the page stays
   free of third-party script. */
.chartwrap{ background:var(--ink-raised); border:1px solid var(--rule);
  border-radius:3px; padding:.9rem 1rem 1rem; margin-bottom:1.4rem; }
.chartwrap h3{ font-size:var(--step-0); margin:0 0 .1rem; }
.chartwrap .cap{ font-family:var(--data); font-size:.62rem; color:var(--text-low); margin:0; }
.chartwrap canvas{ width:100%; height:220px; display:block; margin-top:.7rem; }
.keys{ display:flex; gap:.9rem; flex-wrap:wrap; margin-top:.5rem;
  font-family:var(--data); font-size:.64rem; color:var(--text-low); }
.keys i{ display:inline-block; width:.7rem; height:.16rem; border-radius:999px;
  margin-right:.3rem; vertical-align:.18rem; }

/* Item art is 16px square — nearest-neighbour, or the browser turns it to mush. */
.ticon{ width:1rem; height:1rem; image-rendering:pixelated; vertical-align:-.18rem;
  margin-right:.45rem; }
.dicon{ width:1.1rem; height:1.1rem; image-rendering:pixelated;
  vertical-align:-.15rem; margin-right:.4rem; }

/* The item panel opens in place under the row, so the table it came from
   stays on screen and you keep your place in the list. */
.ipanel{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--gold); border-radius:3px; padding:1rem 1.1rem;
  margin:.8rem 0 1.4rem; }
.ipanel .head{ display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
.ipanel h3{ font-size:var(--step-1); margin:0; }
.ipanel .close{ margin-left:auto; background:none; border:0; color:var(--text-low);
  font-size:1.1rem; cursor:pointer; line-height:1; }
.ipanel .close:hover{ color:var(--gold); }
.ipanel canvas{ width:100%; height:170px; display:block; margin-top:.8rem; }
.ipanel .figs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));
  gap:.5rem; margin-top:.8rem; }
.fig{ background:var(--ink); border:1px solid var(--rule); border-radius:2px;
  padding:.5rem .6rem; }
.fig .n{ font-family:var(--data); font-weight:600; font-size:var(--step-0);
  font-variant-numeric:tabular-nums; display:block; }
.fig .k{ font-family:var(--data); font-size:.58rem; letter-spacing:.05em;
  text-transform:uppercase; color:var(--text-low); display:block; margin-top:.15rem; }

/* Two short leaderboards side by side — what earns most, and what earns most
   per unit moved. They answer different questions and disagree often. */
.boards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:.7rem; }
.board{ background:var(--ink-raised); border:1px solid var(--rule); border-radius:3px;
  padding:.85rem 1rem; }
.board h3{ font-size:var(--step-0); margin:0 0 .6rem; }
.brow{ display:flex; align-items:center; gap:.5rem; padding:.32rem 0;
  border-bottom:1px solid var(--rule-soft); font-family:var(--data); font-size:.7rem; }
.brow:last-child{ border-bottom:none; }
.brow .r{ color:var(--text-low); width:1.1rem; }
.brow .nm{ flex:1; color:var(--text); font-family:var(--body); }
.brow .v{ font-variant-numeric:tabular-nums; color:var(--gold); }

.empty{ border:1px dashed var(--rule); border-radius:3px; padding:1.4rem; text-align:center;
  color:var(--text-mid); font-size:var(--step--1); }
.note{ font-family:var(--data); font-size:.66rem; color:var(--text-low); margin:.5rem 0 0; }
footer{ margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }

@media (max-width:640px){
  .detail{ max-width:none; }
  .floorbar{ gap:.25rem; }
}
</style>
</head>
<body>
<div class="flag-edge" aria-hidden="true"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="index.html">&#8592; Ecosystem</a>
    <span class="spacer"></span>
    <span id="authSlot"></span>
  </div>

  <header class="masthead">
    <h1 data-slot="title">Shop</h1>
    <p class="sub" data-slot="subtitle">The floor, and what moves across it</p>
  </header>

  <div id="body"><p class="empty">Loading&#8230;</p></div>

  <footer><span>Ethiopia</span><span id="stamp">&nbsp;</span></footer>
</div>

<script>
'use strict';
var API = 'https://earthmc-ethiopia-proxy.ethiopianempire2.workers.dev';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
var num = function(n){ return (Number(n) || 0).toLocaleString('en-US'); };
var gold = function(n){ return num(n) + 'g'; };
var when = function(s){
  if (!s) return '—';
  var d = new Date(s + (/[Zz]|[+-]\d{2}:?\d{2}$/.test(s) ? '' : 'Z'));
  return isNaN(d) ? String(s)
    : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
};
/* TOTEM_OF_UNDYING reads badly in a table. The API also sends item_name, but
   only for shops it knows about, so this is the fallback for everything else. */
var pretty = function(id){
  return String(id || '').toLowerCase().split('_')
    .map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
};

var me = null, layout = null, shops = [], stats = null;
var level = 'all', view = null, sel = null, canSeeStats = false;
var search = '', sortKey = 'net_gold', sortDir = -1;

async function api(path, opts){
  var res = await fetch(API + path, Object.assign({ credentials:'include' }, opts || {}));
  var d = null;
  try { d = await res.json(); } catch (e) {}
  if (!res.ok){ var err = new Error((d && d.detail) || (d && d.error) || ('HTTP ' + res.status));
    err.status = res.status; throw err; }
  return d;
}

/* A page stuck on "Loading…" with no error is the worst failure mode there is.
   If anything in load() throws, say so on the page. */
function fatal(err){
  var host = $('body') || document.body;
  host.innerHTML = '';
  var p = document.createElement('p');
  p.className = 'empty';
  p.style.cssText = 'color:var(--red);border-color:var(--red-dim);text-align:left';
  p.textContent = 'This page failed to load: ' + ((err && err.message) || err);
  host.appendChild(p);
  try { console.error('[shop]', err); } catch (e) {}
}

/* ---------------------------------------------------------------------------
   FLOOR PLAN
   Plain SVG, not Leaflet. Every cell is a real DOM node, so hit-testing is the
   browser's job and none of the shared-canvas paint-order problems from the
   map apply here.

   Structural cells are merged into one <path> per category — roughly 4,600
   rects per level collapse to a handful of nodes. Only barrels stay individual,
   because only barrels are clickable.
   --------------------------------------------------------------------------- */
/* Textures come from a mirror of Mojang's asset tree rather than being copied
   into this repo, the same arrangement account.html already uses for player
   heads. Nothing here is hosted by us.

   Minecraft does not name textures the way you would guess, which is why this
   is a table rather than a rule: a barrel's top face is barrel_top, carpets
   have no texture of their own and borrow the matching wool, and a log's
   top-down face is _top. Guessing "block/<id>.png" 404s on most of these.
   Every one of the 33 blocks in this building is listed. */
var TEX = 'https://assets.mcasset.cloud/1.21.4/assets/minecraft/textures/';
var BLOCK_TEX = {
  andesite:'andesite', stone:'stone', cobblestone:'cobblestone',
  soul_sand:'soul_sand', glowstone:'glowstone',
  sandstone:'sandstone_top', smooth_sandstone:'sandstone_top',
  sandstone_stairs:'sandstone_top', smooth_sandstone_stairs:'sandstone_top',
  cut_sandstone:'cut_sandstone', chiseled_sandstone:'chiseled_sandstone',
  white_stained_glass:'white_stained_glass',
  barrel:'barrel_top', hopper:'hopper_top',
  stripped_spruce_log:'stripped_spruce_log_top',
  stripped_spruce_wood:'stripped_spruce_log',
  spruce_stairs:'spruce_planks', spruce_fence:'spruce_planks',
  spruce_shelf:'spruce_planks', spruce_wall_sign:'spruce_planks',
  spruce_door:'spruce_door_top', spruce_trapdoor:'spruce_trapdoor',
  jungle_trapdoor:'jungle_trapdoor', jungle_wall_sign:'jungle_planks',
  /* carpets have no texture file — they render the wool of the same colour */
  green_carpet:'green_wool', yellow_carpet:'yellow_wool',
  red_carpet:'red_wool', blue_carpet:'blue_wool',
  green_wool:'green_wool', yellow_wool:'yellow_wool', red_wool:'red_wool',
};

/* Drawn underneath the texture, so a texture that fails to load leaves a
   readable floor rather than a black hole. The flag carpet keeps the site
   palette; everything else is close to the block it stands in for. */
var CELL_STYLE = {
  andesite:'#2c2721', stone:'#2e2e2e', cobblestone:'#2a2a2a',
  soul_sand:'#3a2c22', glowstone:'#3a3018',
  sandstone:'#3b352a', smooth_sandstone:'#3b352a',
  sandstone_stairs:'#3b352a', smooth_sandstone_stairs:'#3b352a',
  cut_sandstone:'#3b352a', chiseled_sandstone:'#3b352a',
  white_stained_glass:'#1d2530',
  barrel:'#2a241c', hopper:'#1e1a16',
  stripped_spruce_log:'#3a2d1f', stripped_spruce_wood:'#3a2d1f',
  spruce_stairs:'#2f2418', spruce_fence:'#2f2418', spruce_shelf:'#2a231b',
  spruce_wall_sign:'#33291c', spruce_door:'#4a3a22', spruce_trapdoor:'#3a2d1f',
  jungle_trapdoor:'#4a3a22', jungle_wall_sign:'#33291c',
  green_carpet:'#14512a', yellow_carpet:'#7a600c',
  red_carpet:'#6b1116', blue_carpet:'#123a6e',
  green_wool:'#14512a', yellow_wool:'#7a600c', red_wool:'#6b1116',
};

/* Barrels are drawn separately as click targets, so they are skipped when the
   background is painted. Later entries paint over earlier ones. */
var CELL_ORDER = [
  'stone','andesite','cobblestone','soul_sand',
  'smooth_sandstone','sandstone','cut_sandstone','chiseled_sandstone',
  'smooth_sandstone_stairs','sandstone_stairs',
  'stripped_spruce_log','stripped_spruce_wood','spruce_stairs','spruce_fence',
  'white_stained_glass','glowstone','hopper','spruce_shelf',
  'jungle_trapdoor','spruce_trapdoor','spruce_door',
  'jungle_wall_sign','spruce_wall_sign',
  'green_carpet','yellow_carpet','red_carpet','blue_carpet',
  'green_wool','yellow_wool','red_wool',
];

/* An item id is not enough to find its picture: most shop stock is blocks,
   whose textures live under block/ and are often _top for the face you see
   from above. Tried in order, and the <image> falls through to the next on
   error, so a miss costs a 404 rather than a broken icon. */
function itemTexCandidates(id){
  var n = String(id || '').toLowerCase();
  return [
    TEX + 'item/' + n + '.png',
    TEX + 'block/' + n + '.png',
    TEX + 'block/' + n + '_top.png',
    TEX + 'block/' + n + '_side.png',
  ];
}

/* QuickShop's numeric id means nothing to a schematic, so position is the only
   key the floor plan and the shop list share. Indexed once per load rather
   than scanned per barrel: 1,074 barrels against 49 shops is 52,000
   comparisons on every repaint, and a repaint happens on every pan. */
var shopIndex = {};
function indexShops(){
  shopIndex = {};
  shops.forEach(function(s){
    if (s.x != null && s.y != null && s.z != null){
      shopIndex[s.x + ',' + s.y + ',' + s.z] = s;
    }
  });
}
function shopFor(x, y, z){ return shopIndex[x + ',' + y + ',' + z] || null; }

function barrelClass(s){
  if (!s) return 'b-empty';
  if (s.shop_type === 'buy') return 'b-buy';
  if (s.stock != null && s.stock <= (stats ? stats.restockThreshold : 64)) return 'b-low';
  return 'b-sell';
}

/* Which y-levels this view draws, lowest first. 'all' looks down through the
   whole building the way you would standing above it: floor, then the lower
   barrels, then the upper. The single-level views stay because they are the
   only way to see a level the one above it covers. */
function activeLevels(){
  var ys = (layout.levels || []).map(function(l){ return l.y; });
  return level === 'all' ? ys : [Number(level)];
}

function drawFloor(){
  var b = layout.bounds;
  var w = b.maxX - b.minX + 1, h = b.maxZ - b.minZ + 1;
  if (!view) view = { x: b.minX, z: b.minZ, w: w, h: h };

  var levels = activeLevels();
  var parts = [];
  var used = {};

  parts.push('<svg id="floor" viewBox="' + view.x + ' ' + view.z + ' ' + view.w + ' ' + view.h +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Shop floor plan">');

  /* One <pattern> per block type, tiled at exactly one world unit so a texture
     lands on a block rather than being stretched across the hall. Defined once
     and referenced by the merged paths below — roughly 4,600 cells per level
     become a handful of nodes, which is what keeps this smooth on a phone. */
  var defs = ['<defs>'];
  levels.forEach(function(y){
    Object.keys(layout.cells[String(y)] || {}).forEach(function(k){ used[k] = 1; });
  });
  Object.keys(used).forEach(function(k){
    if (!BLOCK_TEX[k]) return;
    defs.push('<pattern id="t-' + k + '" patternUnits="userSpaceOnUse" ' +
      'width="1" height="1"><image href="' + TEX + 'block/' + BLOCK_TEX[k] + '.png" ' +
      'width="1" height="1" preserveAspectRatio="none" ' +
      'style="image-rendering:pixelated"/></pattern>');
  });
  defs.push('</defs>');
  parts.push(defs.join(''));

  parts.push('<rect x="' + b.minX + '" y="' + b.minZ + '" width="' + w + '" height="' + h +
    '" fill="#0b0a08"/>');

  levels.forEach(function(y){
    var cells = layout.cells[String(y)] || {};
    CELL_ORDER.forEach(function(k){
      var list = cells[k];
      if (!list || !list.length) return;
      var dd = '';
      for (var i = 0; i < list.length; i++){
        dd += 'M' + list[i][0] + ' ' + list[i][1] + 'h1v1h-1z';
      }
      /* Colour first, texture over it. If the texture 404s the pattern paints
         nothing and the colour shows through, so a missing file costs detail
         rather than leaving a hole in the floor. */
      parts.push('<path d="' + dd + '" fill="' + (CELL_STYLE[k] || '#241f19') + '"/>');
      if (BLOCK_TEX[k]) {
        /* Stained glass is glass: opaque white turns the lit walkways into
           blank sheets that swamp everything else on the plan. */
        var op = k.indexOf('glass') >= 0 ? ' fill-opacity=".42"' : '';
        parts.push('<path d="' + dd + '" fill="url(#t-' + k + ')"' + op + '/>');
      }
    });
  });

  /* Everything above is the building, which does not change. Knocking it back
     under one flat wash keeps it legible as a plan while letting the barrel
     states — the only part that is live — carry the colour. One rect rather
     than dimming 30 textures individually. */
  parts.push('<rect x="' + b.minX + '" y="' + b.minZ + '" width="' + w + '" height="' + h +
    '" fill="#0b0a08" opacity=".34" pointer-events="none"/>');

  /* Barrels last so they sit above the floor, and individually so each is its
     own click target with a title for keyboard and screen-reader users. */
  var zoomed = view.w < 40;
  levels.forEach(function(y){
    (layout.barrels || []).forEach(function(p){
      if (p[1] !== y) return;
      var s = shopFor(p[0], p[1], p[2]);
      parts.push('<rect class="' + barrelClass(s) + '" x="' + p[0] + '" y="' + p[2] +
        '" width="1" height="1" rx=".12"/>');

      /* The item's own picture, inset so the barrel's state colour still reads
         as a border around it. Only when zoomed in — at full-hall zoom a
         16-pixel texture is a smudge and 1,074 of them are a slow smudge. */
      if (zoomed && s){
        var cand = itemTexCandidates(s.item);
        parts.push('<image class="icon" href="' + cand[0] + '" data-try="0" ' +
          'data-item="' + esc(s.item) + '" x="' + (p[0] + .12) + '" y="' + (p[2] + .12) +
          '" width=".76" height=".76" preserveAspectRatio="xMidYMid meet"/>');
      }

      parts.push('<rect class="b-hit" data-x="' + p[0] + '" data-y="' + p[1] +
        '" data-z="' + p[2] + '" x="' + p[0] + '" y="' + p[2] +
        '" width="1" height="1" tabindex="0"><title>' +
        esc(s ? (pretty(s.item) + ' · ' + s.price + 'g') : 'Barrel, no shop sign') +
        '</title></rect>');
    });
  });

  if (sel){
    parts.push('<rect class="b-sel" x="' + (sel.x - .12) + '" y="' + (sel.z - .12) +
      '" width="1.24" height="1.24" rx=".2"/>');
  }
  parts.push('</svg>');
  return parts.join('');
}

function detailCard(){
  if (!sel) return '';
  /* sel carries the y it was clicked at. Reading `level` here would find
     nothing in the combined view, where several levels are on screen. */
  var y = sel.y != null ? sel.y : Number(level);
  var s = shopFor(sel.x, y, sel.z);
  var out = '<div class="detail"><button class="close" id="closeSel" ' +
    'aria-label="Close">&#215;</button>';

  if (!s){
    out += '<h3>Barrel</h3><p class="coords">' + sel.x + ', ' + y + ', ' + sel.z + '</p>' +
      '<p class="note">Built, but no shop sign yet. It will appear here once ' +
      'a QuickShop is set on it.</p></div>';
    return out;
  }

  out += '<h3><img class="dicon" src="' + itemTexCandidates(s.item)[0] + '" alt="" ' +
    'onerror="this.remove()">' + esc(pretty(s.item)) + '</h3>' +
    '<p class="coords">' + sel.x + ', ' + y + ', ' + sel.z + ' · shop ' + esc(s.shop_id) +
    (s.row_location ? ' · ' + esc(s.row_location) : '') + '</p>';

  out += '<div class="kv"><dt>' + (s.shop_type === 'buy' ? 'Paying' : 'Price') +
    '</dt><dd class="gold">' + gold(s.price) + '</dd></div>';

  if (canSeeStats){
    out += '<div class="kv"><dt>In stock</dt><dd' +
      (s.stock != null && s.stock <= 64 ? ' class="r"' : '') + '>' +
      (s.stock == null ? '—' : num(s.stock)) + '</dd></div>';
    var row = stats && (stats.items || []).find(function(r){ return r.item === s.item; });
    if (row){
      out += '<div class="kv"><dt>Sold</dt><dd class="g">' + gold(row.sold_gold) +
        ' · ' + num(row.sales) + '</dd></div>' +
        '<div class="kv"><dt>Bought back</dt><dd>' + gold(row.bought_gold) +
        ' · ' + num(row.buybacks) + '</dd></div>' +
        '<div class="kv"><dt>Net</dt><dd class="' + (row.net_gold >= 0 ? 'g' : 'r') + '">' +
        gold(row.net_gold) + '</dd></div>' +
        '<div class="kv"><dt>Last traded</dt><dd>' + esc(when(row.last_traded)) + '</dd></div>';
    } else {
      out += '<p class="note">Nothing traded here in the last ' +
        (stats ? stats.days : 30) + ' days.</p>';
    }
  }
  if (s.first_seen){
    out += '<div class="kv"><dt>First seen</dt><dd>' + esc(when(s.first_seen)) + '</dd></div>';
  }
  return out + '</div>';
}

/* --- zoom and pan ---------------------------------------------------------
   The viewBox is the whole camera: no transforms, no layer panes, nothing that
   can disagree with hit-testing. Clamped to the building so it cannot be lost
   off the edge of the world. */
function clampView(){
  var b = layout.bounds;
  var w = b.maxX - b.minX + 1, h = b.maxZ - b.minZ + 1;
  view.w = Math.max(8, Math.min(view.w, w));
  view.h = view.w * (h / w);
  view.x = Math.max(b.minX, Math.min(view.x, b.maxX + 1 - view.w));
  view.z = Math.max(b.minZ, Math.min(view.z, b.maxZ + 1 - view.h));
}

/* Setting the viewBox is one attribute write and the browser re-renders what
   is already there. Rebuilding the markup means recreating some 6,000 nodes,
   which is what made dragging feel like wading. So panning and zooming only
   move the camera; the markup is rebuilt only when the icon threshold is
   actually crossed and the picture would genuinely differ. */
var lastZoomed = null;

function applyView(){
  var svg = $('floor');
  if (!svg) return;
  svg.setAttribute('viewBox', view.x + ' ' + view.z + ' ' + view.w + ' ' + view.h);
  var nowZoomed = view.w < 40;
  if (lastZoomed !== null && nowZoomed !== lastZoomed) paintFloor();
  else lastZoomed = nowZoomed;
}

function zoomBy(f, cx, cz){
  var b = layout.bounds;
  var w = b.maxX - b.minX + 1;
  if (cx == null){ cx = view.x + view.w / 2; cz = view.z + view.h / 2; }
  var nw = Math.max(6, Math.min(view.w * f, w));
  var k = nw / view.w;
  /* Anchored on the cursor rather than the centre, so the block under the
     pointer stays under the pointer. */
  view.x = cx - (cx - view.x) * k;
  view.z = cz - (cz - view.z) * k;
  view.w = nw;
  clampView();
  applyView();
}

function paintFloor(){
  var host = $('floorwrap');
  if (!host) return;
  lastZoomed = view ? view.w < 40 : null;
  host.innerHTML = drawFloor() + detailCard();
  wireFloor();
}

var dragMoved = false;

function wireFloor(){
  var svg = $('floor');
  if (!svg) return;

  /* An icon that 404s falls through to the next candidate path rather than
     leaving a broken image. After the last one it removes itself and the
     barrel's state colour stands alone. */
  svg.querySelectorAll('image.icon').forEach(function(img){
    img.addEventListener('error', function(){
      var i = Number(img.dataset.try) + 1;
      var cand = itemTexCandidates(img.dataset.item);
      if (i < cand.length){
        img.dataset.try = i;
        img.setAttribute('href', cand[i]);
      } else {
        img.remove();
      }
    });
  });

  svg.querySelectorAll('.b-hit').forEach(function(el){
    var pick = function(){
      sel = { x: Number(el.dataset.x), y: Number(el.dataset.y), z: Number(el.dataset.z) };
      paintFloor();
    };
    /* A pan that happens to finish over a barrel is not a click on it. */
    el.addEventListener('pointerup', function(e){ if (dragMoved) e.stopPropagation(); });
    el.addEventListener('click', function(){ if (!dragMoved) pick(); });
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); }
    });
  });

  var close = $('closeSel');
  if (close) close.addEventListener('click', function(){ sel = null; paintFloor(); });

  /* Screen pixels to world units, for anchoring a zoom on a point. */
  function toWorld(clientX, clientY){
    var r = svg.getBoundingClientRect();
    return {
      x: view.x + ((clientX - r.left) / r.width) * view.w,
      z: view.z + ((clientY - r.top) / r.height) * view.h,
    };
  }

  svg.addEventListener('wheel', function(e){
    e.preventDefault();
    var p = toWorld(e.clientX, e.clientY);
    /* Scaled by the actual scroll distance rather than a fixed step, so a
       trackpad's many small deltas and a mouse wheel's few large ones both
       travel at a sensible rate. Clamped so one violent flick cannot throw
       the view across the whole building. */
    var d = Math.max(-120, Math.min(120, e.deltaY));
    zoomBy(Math.exp(d * 0.0022), p.x, p.z);
  }, { passive:false });

  svg.addEventListener('dblclick', function(e){
    var p = toWorld(e.clientX, e.clientY);
    zoomBy(0.5, p.x, p.z);
  });

  /* Pointers are tracked in a map rather than as a single drag, because two
     fingers on a phone is a pinch and one is a pan, and the difference is
     just how many are down. */
  var live = new Map();
  var drag = null;
  var pinch = null;

  function pointerMid(){
    var pts = Array.from(live.values());
    return {
      cx: (pts[0].x + pts[1].x) / 2,
      cy: (pts[0].y + pts[1].y) / 2,
      d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
    };
  }

  svg.addEventListener('pointerdown', function(e){
    live.set(e.pointerId, { x:e.clientX, y:e.clientY });
    svg.setPointerCapture(e.pointerId);

    if (live.size === 2){
      drag = null;
      var m = pointerMid();
      pinch = { d: m.d, w: view.w, world: toWorld(m.cx, m.cy) };
    } else if (live.size === 1){
      drag = { px:e.clientX, pz:e.clientY, x:view.x, z:view.z, moved:false };
      svg.classList.add('dragging');
    }
  });

  svg.addEventListener('pointermove', function(e){
    if (!live.has(e.pointerId)) return;
    live.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (pinch && live.size === 2){
      var m = pointerMid();
      if (m.d > 0 && pinch.d > 0){
        var b = layout.bounds;
        var full = b.maxX - b.minX + 1;
        view.w = Math.max(6, Math.min(pinch.w * (pinch.d / m.d), full));
        view.h = view.w * ((b.maxZ - b.minZ + 1) / full);
        /* Keep the point between the fingers pinned where it started. */
        var r = svg.getBoundingClientRect();
        view.x = pinch.world.x - ((m.cx - r.left) / r.width) * view.w;
        view.z = pinch.world.z - ((m.cy - r.top) / r.height) * view.h;
        clampView();
        applyView();
      }
      return;
    }

    if (!drag) return;
    var r2 = svg.getBoundingClientRect();
    var dx = e.clientX - drag.px, dy = e.clientY - drag.pz;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.x - (dx / r2.width) * view.w;
    view.z = drag.z - (dy / r2.height) * view.h;
    clampView();
    applyView();
  });

  ['pointerup','pointercancel'].forEach(function(ev){
    svg.addEventListener(ev, function(e){
      live.delete(e.pointerId);
      if (live.size < 2) pinch = null;
      if (live.size === 0){
        svg.classList.remove('dragging');
        dragMoved = !!(drag && drag.moved);
        drag = null;
        /* Cleared after the click that follows this pointerup has passed. */
        setTimeout(function(){ dragMoved = false; }, 0);
      }
    });
  });
}

/* --- item art -------------------------------------------------------------
   An <img> gets one src, so the candidate chain is walked on error. Declared
   on window because inline onerror runs in global scope. */
window.itemImgFallback = function(img){
  var i = Number(img.dataset.try || 0) + 1;
  var cand = itemTexCandidates(img.dataset.item);
  if (i < cand.length){ img.dataset.try = i; img.src = cand[i]; }
  else { img.style.visibility = 'hidden'; }
};
function itemImg(id, cls){
  return '<img class="' + (cls || 'ticon') + '" src="' + itemTexCandidates(id)[0] +
    '" data-try="0" data-item="' + esc(id) + '" alt="" onerror="itemImgFallback(this)">';
}

/* --- charts ---------------------------------------------------------------
   Hand-drawn on canvas, the same as treasury.html and history.html. Two or
   three lines on a dark ground do not justify a charting dependency, and it
   keeps the page free of third-party script.
   --------------------------------------------------------------------------- */
function drawSeries(canvas, rows, opts){
  if (!canvas) return;
  opts = opts || {};
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth, h = canvas.clientHeight || 200;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (!rows.length){
    ctx.fillStyle = '#756c5d';
    ctx.font = '12px "Martian Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(opts.emptyText || 'Nothing recorded in this period', w / 2, h / 2);
    return;
  }

  var lines = opts.lines || [];
  var padL = 54, padR = 12, padT = 12, padB = 24;
  var all = [];
  lines.forEach(function(l){ rows.forEach(function(r){ all.push(Number(r[l.key]) || 0); }); });
  var min = Math.min.apply(null, all), max = Math.max.apply(null, all);
  /* Zero always on the axis: a gold line that never shows the floor makes a
     small dip look like a collapse. */
  if (min > 0) min = 0;
  if (max < 0) max = 0;
  if (min === max){ min -= 1; max += 1; }
  var span = max - min;
  min -= span * 0.08; max += span * 0.08;

  var flat = rows.length === 1;
  var X = function(i){
    return flat ? padL + (w - padL - padR) / 2
                : padL + (i / Math.max(1, rows.length - 1)) * (w - padL - padR);
  };
  var Y = function(v){ return padT + (1 - (v - min) / (max - min)) * (h - padT - padB); };

  ctx.strokeStyle = '#2b2620'; ctx.lineWidth = 1;
  ctx.fillStyle = '#756c5d'; ctx.font = '10px "Martian Mono", monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var g = 0; g <= 4; g++){
    var v = min + (max - min) * (g / 4), yy = Math.round(Y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.fillText(Math.round(v).toLocaleString('en-US'), padL - 8, yy);
  }

  if (min < 0 && max > 0){
    ctx.strokeStyle = '#7a1318'; ctx.setLineDash([3, 3]);
    var zy = Math.round(Y(0)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, zy); ctx.lineTo(w - padR, zy); ctx.stroke();
    ctx.setLineDash([]);
  }

  lines.forEach(function(l){
    ctx.strokeStyle = l.color; ctx.lineWidth = l.width || 1.8;
    ctx.lineJoin = 'round'; ctx.beginPath();
    rows.forEach(function(r, i){
      var y = Y(Number(r[l.key]) || 0);
      if (i === 0) ctx.moveTo(X(i), y); else ctx.lineTo(X(i), y);
    });
    ctx.stroke();
    if (flat){
      ctx.fillStyle = l.color;
      ctx.beginPath(); ctx.arc(X(0), Y(Number(rows[0][l.key]) || 0), 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  /* First and last date only. Every label would collide at 90 days. */
  ctx.fillStyle = '#756c5d'; ctx.font = '10px "Martian Mono", monospace';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText(when(rows[0].day), padL, h - padB + 7);
  if (rows.length > 1){
    ctx.textAlign = 'right';
    ctx.fillText(when(rows[rows.length - 1].day), w - padR, h - padB + 7);
  }
}

function paintCharts(){
  if (!stats) return;
  drawSeries($('cMain'), stats.daily || [], {
    lines: [
      { key:'sold_gold',   color:'#189d4d' },
      { key:'bought_gold', color:'#2f6fb8' },
      { key:'net_gold',    color:'#e0a92a', width:2.2 },
    ],
    emptyText: 'No trades yet — this fills as the shop sells',
  });
}

/* --- item table ----------------------------------------------------------- */
var COLS = [
  { k:'item',        h:'Item',        get:function(r){
      return itemImg(r.item) + esc(pretty(r.item)); }, cls:'name' },
  { k:'sold_gold',   h:'Sold',        n:true, get:function(r){ return gold(r.sold_gold); } },
  { k:'sold_qty',    h:'Units',       n:true, get:function(r){ return num(r.sold_qty); } },
  { k:'bought_gold', h:'Bought back', n:true, get:function(r){ return gold(r.bought_gold); } },
  { k:'net_gold',    h:'Net',         n:true, get:function(r){
      return '<span class="' + (r.net_gold > 0 ? 'pos' : r.net_gold < 0 ? 'neg' : 'zero') + '">' +
        gold(r.net_gold) + '</span>'; } },
  /* Gold per unit sold. Revenue rewards whatever is cheap and moves in bulk;
     this is the separate question of what each item is actually worth
     shifting, and the two orders disagree constantly. */
  { k:'per_unit',    h:'Per unit',    n:true, get:function(r){
      return r.sold_qty ? (r.sold_gold / r.sold_qty).toFixed(2) + 'g' : '—'; } },
  { k:'last_traded', h:'Last',        n:true, get:function(r){ return esc(when(r.last_traded)); } },
];

function itemTable(){
  if (!stats) return '';
  var rows = (stats.items || []).filter(function(r){
    return !search || pretty(r.item).toLowerCase().indexOf(search.toLowerCase()) >= 0;
  }).map(function(r){
    /* Derived here rather than in SQL so sorting and display use one number. */
    return Object.assign({}, r, {
      per_unit: r.sold_qty ? (r.sold_gold / r.sold_qty) : 0,
    });
  });
  rows.sort(function(a, b){
    var x = a[sortKey], y = b[sortKey];
    if (typeof x === 'string') return sortDir * String(x).localeCompare(String(y));
    return sortDir * ((x || 0) - (y || 0));
  });

  if (!rows.length){
    return '<p class="empty">' + (search
      ? 'Nothing matches “' + esc(search) + '”.'
      : 'No trades recorded yet. Figures start from the day the shop listener goes live.') +
      '</p>';
  }

  var top = Math.max.apply(null, rows.map(function(r){ return r.sold_gold || 0; })) || 1;
  return '<table><thead><tr>' + COLS.map(function(c){
      return '<th data-k="' + c.k + '"' + (c.n ? ' style="text-align:right"' : '') + '>' +
        esc(c.h) + (sortKey === c.k ? (sortDir < 0 ? ' ↓' : ' ↑') : '') + '</th>';
    }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr class="pick" data-item="' + esc(r.item) + '">' + COLS.map(function(c){
        var v = c.get(r);
        if (c.k === 'item'){
          v += '<div class="bar"><span style="width:' +
            Math.round(((r.sold_gold || 0) / top) * 100) + '%"></span></div>';
        }
        return '<td class="' + (c.n ? 'n ' : '') + (c.cls || '') + '">' + v + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
}

/* Two boards, because "earns the most" and "earns the most per unit moved"
   are different questions with different answers. Selling a thousand cobble at
   1g beats one enchanted book on revenue and loses badly on either shelf space
   or the effort of restocking it. */
function boards(){
  var items = stats.items || [];
  if (!items.length) return '';

  var byRevenue = items.slice()
    .sort(function(a, b){ return (b.sold_gold || 0) - (a.sold_gold || 0); })
    .slice(0, 6);
  var byUnit = items.filter(function(r){ return r.sold_qty > 0; })
    .sort(function(a, b){
      return (b.sold_gold / b.sold_qty) - (a.sold_gold / a.sold_qty);
    }).slice(0, 6);
  var boughtBack = items.filter(function(r){ return r.bought_gold > 0; })
    .sort(function(a, b){ return (b.bought_gold || 0) - (a.bought_gold || 0); })
    .slice(0, 6);

  var list = function(rows, val){
    if (!rows.length) return '<p class="note">Nothing yet.</p>';
    return rows.map(function(r, i){
      return '<div class="brow"><span class="r">' + (i + 1) + '</span>' +
        itemImg(r.item) + '<span class="nm">' + esc(pretty(r.item)) + '</span>' +
        '<span class="v">' + val(r) + '</span></div>';
    }).join('');
  };

  return '<div class="section-head"><h2>Leaders</h2>' +
    '<span class="meta">over the last ' + stats.days + ' days</span></div>' +
    '<div class="boards">' +
      '<div class="board"><h3>Most revenue</h3>' +
        list(byRevenue, function(r){ return gold(r.sold_gold); }) + '</div>' +
      '<div class="board"><h3>Best per unit</h3>' +
        list(byUnit, function(r){ return (r.sold_gold / r.sold_qty).toFixed(2) + 'g'; }) + '</div>' +
      '<div class="board"><h3>Most bought back</h3>' +
        list(boughtBack, function(r){ return gold(r.bought_gold); }) + '</div>' +
    '</div>';
}

/* --- one item, in detail --------------------------------------------------
   Its own daily series comes from the same stats route with ?item=, so the
   filtering happens in SQL rather than by shipping every event to the page.
   --------------------------------------------------------------------------- */
var openItemId = null;
var openItemDaily = null;   // kept so a resize can redraw without refetching

async function openItem(id){
  var host = $('itempanel');
  if (!host) return;
  if (openItemId === id){ openItemId = null; openItemDaily = null; host.innerHTML = ''; return; }
  openItemId = id;
  host.innerHTML = '<p class="empty">Loading ' + esc(pretty(id)) + '…</p>';

  var d;
  try {
    d = await api('/api/shop/stats?days=' + stats.days + '&item=' + encodeURIComponent(id));
  } catch (e){
    host.innerHTML = '<p class="empty">Could not load that item: ' + esc(e.message) + '</p>';
    return;
  }
  if (openItemId !== id) return;          // a later click won the race

  var row = (d.items || [])[0] || {
    sold_gold:0, bought_gold:0, sold_qty:0, bought_qty:0, sales:0, buybacks:0, net_gold:0,
  };
  /* Every barrel holding this item, since popular stock sits in several. */
  var here = shops.filter(function(x){ return x.item === id; });

  host.innerHTML =
    '<div class="ipanel"><div class="head">' +
      '<h3>' + itemImg(id, 'dicon') + esc(pretty(id)) + '</h3>' +
      '<button class="close" id="iclose" aria-label="Close">×</button></div>' +
    '<p class="cap">' + here.length + ' barrel' + (here.length === 1 ? '' : 's') +
      (here.length ? ' · ' + here.map(function(x){
        return (x.shop_type === 'buy' ? 'buying at ' : 'selling at ') + x.price + 'g' +
          (x.stock != null ? ' (' + num(x.stock) + ' in stock)' : '');
      }).join(' · ') : '') + '</p>' +
    '<canvas id="cItem"></canvas>' +
    '<div class="keys">' +
      '<span><i style="background:#189d4d"></i>Taken in</span>' +
      '<span><i style="background:#2f6fb8"></i>Paid out</span>' +
    '</div>' +
    '<div class="figs">' +
      '<div class="fig"><span class="n" style="color:var(--green)">' + gold(row.sold_gold) +
        '</span><span class="k">Taken in</span></div>' +
      '<div class="fig"><span class="n">' + num(row.sold_qty) +
        '</span><span class="k">Units sold</span></div>' +
      '<div class="fig"><span class="n">' + gold(row.bought_gold) +
        '</span><span class="k">Paid out</span></div>' +
      '<div class="fig"><span class="n" style="color:var(--gold)">' + gold(row.net_gold) +
        '</span><span class="k">Net</span></div>' +
      '<div class="fig"><span class="n">' +
        (row.sold_qty ? (row.sold_gold / row.sold_qty).toFixed(2) + 'g' : '—') +
        '</span><span class="k">Per unit</span></div>' +
      '<div class="fig"><span class="n">' + esc(when(row.last_traded)) +
        '</span><span class="k">Last traded</span></div>' +
    '</div>' +
    (here.length && here[0].x != null
      ? '<button class="btn" type="button" id="ilocate" style="margin-top:.8rem">' +
        'Show on the floor</button>'
      : '') +
    '</div>';

  openItemDaily = d.daily || [];
  drawSeries($('cItem'), openItemDaily, {
    lines: [
      { key:'sold_gold',   color:'#189d4d' },
      { key:'bought_gold', color:'#2f6fb8' },
    ],
    emptyText: 'No trades for this item yet',
  });

  var close = $('iclose');
  if (close) close.addEventListener('click', function(){
    openItemId = null; openItemDaily = null; host.innerHTML = '';
  });

  var loc = $('ilocate');
  if (loc) loc.addEventListener('click', function(){
    var t = here[0];
    level = t.y; sel = { x:t.x, y:t.y, z:t.z };
    view = { x:t.x - 9, z:t.z - 6, w:18, h:12 };
    paintFloor();
    var fw = $('floorwrap');
    if (fw) fw.scrollIntoView({ behavior:'smooth', block:'center' });
  });

  host.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function render(){
  var out = '';

  /* --- the floor, first, because it is what this page is for --- */
  if (layout){
    out += '<div class="floorbar">' +
      '<span class="lv' + (level === 'all' ? ' on' : '') + '" data-y="all">Everything</span>' +
      (layout.levels || []).map(function(l){
        return '<span class="lv' + (Number(level) === l.y ? ' on' : '') + '" data-y="' + l.y + '">' +
          esc(l.label) + '</span>';
      }).join('') +
      '<span class="zoom">' +
        '<button id="zin" title="Zoom in">+</button>' +
        '<button id="zout" title="Zoom out">&#8722;</button>' +
        '<button id="zfit" title="Fit the whole floor">&#9723;</button>' +
      '</span></div>' +
      '<div class="floorwrap" id="floorwrap"></div>' +
      '<div class="legend">' +
        '<span><i style="background:var(--green)"></i>Selling</span>' +
        '<span><i style="background:var(--blue)"></i>Buying</span>' +
        '<span><i style="background:var(--red)"></i>Low stock</span>' +
        '<span><i style="background:#2a241c;border:1px solid #3a3229"></i>No sign yet</span>' +
        '<span>' + num((layout.barrels || []).length) + ' barrels · ' +
          num(shops.length) + ' with a shop</span>' +
      '</div>';
  } else {
    out += '<p class="empty">The floor plan has not been loaded yet. ' +
      'An Emperor can upload it below.</p>';
  }

  if (isEmperor){
    out += '<div class="section-head"><h2>Floor plan</h2>' +
      '<span class="meta">only needed when the building changes</span></div>' +
      '<div class="tools"><div class="f"><label for="planfile">Upload shop-layout.json</label>' +
      '<input type="file" id="planfile" accept="application/json"></div>' +
      '<button class="btn" type="button" id="planup">Save floor plan</button></div>' +
      '<p class="note" id="planmsg"></p>';
  }

  /* --- trading figures, treasurer and above --- */
  if (!canSeeStats){
    out += '<div class="section-head"><h2>Trading</h2></div>' +
      '<p class="empty">' + (me && me.signedIn
        ? 'Sales and stock figures are for the Treasurer and above. You are signed in as ' +
          esc(me.tier) + '.'
        : 'Sign in to see trading figures.') + '</p>';
  } else {
    var t = stats.totals;
    out += '<div class="section-head"><h2>Trading</h2>' +
      '<span class="meta">' + (stats.firstEvent
        ? 'since ' + esc(when(stats.firstEvent))
        : 'nothing recorded yet') + '</span></div>' +
      '<div class="stats">' +
        '<div class="stat in"><span class="n">' + gold(t.sold_gold) + '</span>' +
          '<span class="k">Taken in · ' + num(t.sales) + ' sales</span></div>' +
        '<div class="stat out"><span class="n">' + gold(t.bought_gold) + '</span>' +
          '<span class="k">Paid out · ' + num(t.buybacks) + ' buy-backs</span></div>' +
        '<div class="stat net"><span class="n">' + gold(t.net_gold) + '</span>' +
          '<span class="k">Net</span></div>' +
        '<div class="stat warn"><span class="n">' + num(stats.restock.length) + '</span>' +
          '<span class="k">Need restocking</span></div>' +
      '</div>';

    out += '<div class="chartwrap"><h3>Income and outgoings</h3>' +
      '<p class="cap">Gold taken at the sell barrels against gold paid out at the ' +
      'buy barrels, day by day.</p>' +
      '<canvas id="cMain"></canvas>' +
      '<div class="keys">' +
        '<span><i style="background:#189d4d"></i>Taken in</span>' +
        '<span><i style="background:#2f6fb8"></i>Paid out</span>' +
        '<span><i style="background:#e0a92a"></i>Net</span>' +
      '</div></div>';

    out += boards();

    out += '<div class="tools">' +
      '<div class="f"><label for="q">Search items</label>' +
        '<input id="q" placeholder="wheat, emerald, concrete…" value="' + esc(search) + '"></div>' +
      '<div class="f" style="flex:0 0 8rem"><label for="days">Period</label>' +
        '<select id="days">' + [7,30,90,365].map(function(d){
          return '<option value="' + d + '"' + (stats.days === d ? ' selected' : '') + '>' +
            (d === 365 ? 'Year' : d + ' days') + '</option>'; }).join('') +
        '</select></div>' +
      '<div class="f" style="flex:0 0 9rem"><label for="rst">Restock under</label>' +
        '<select id="rst">' + [8,16,32,64,128].map(function(v){
          return '<option value="' + v + '"' + (stats.restockThreshold === v ? ' selected' : '') +
            '>' + v + ' in stock</option>'; }).join('') +
        '</select></div></div>';

    out += '<div id="itempanel"></div>';
    out += '<div id="itemtable">' + itemTable() + '</div>';

    if (stats.restock.length){
      out += '<div class="section-head"><h2>Restock</h2>' +
        '<span class="meta">at or under ' + stats.restockThreshold + ' in stock</span></div>' +
        '<table><thead><tr><th>Item</th><th style="text-align:right">Stock</th>' +
        '<th style="text-align:right">Price</th><th>Where</th></tr></thead><tbody>' +
        stats.restock.map(function(r){
          return '<tr><td class="name">' + itemImg(r.item) + esc(pretty(r.item)) + '</td>' +
            '<td class="n neg">' + num(r.stock) + '</td>' +
            '<td class="n">' + gold(r.price) + '</td>' +
            '<td>' + esc(r.row_location || '—') + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    if (stats.warnings.length){
      out += '<div class="section-head"><h2>Warnings</h2>' +
        '<span class="meta">from the shop itself</span></div>' +
        '<table><thead><tr><th>What</th><th>Item</th>' +
        '<th style="text-align:right">Times</th><th style="text-align:right">Last</th>' +
        '</tr></thead><tbody>' +
        stats.warnings.map(function(w){
          return '<tr><td class="name">' + esc(pretty(w.kind)) + '</td>' +
            '<td>' + itemImg(w.item) + esc(pretty(w.item)) + '</td>' +
            '<td class="n">' + num(w.times) + '</td>' +
            '<td class="n">' + esc(when(w.last_seen)) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
  }

  $('body').innerHTML = out;
  if (layout) paintFloor();
  /* Canvas sizes itself from its rendered width, so it can only be drawn once
     it is actually in the document. */
  paintCharts();
  wirePage();

  /* pagetext.js runs once, on load, over the [data-slot] elements that exist
     at that moment. Everything above was rendered after an await, so any
     override would have been missed. This is what reapply() is for. */
  if (window.ethiopiaPageText) window.ethiopiaPageText.reapply();
}

function wirePage(){
  document.querySelectorAll('[data-y]').forEach(function(el){
    el.addEventListener('click', function(){
      level = el.dataset.y === 'all' ? 'all' : Number(el.dataset.y);
      sel = null; render();
    });
  });
  var zi = $('zin'), zo = $('zout'), zf = $('zfit');
  if (zi) zi.addEventListener('click', function(){ zoomBy(0.7); });
  if (zo) zo.addEventListener('click', function(){ zoomBy(1.4); });
  if (zf) zf.addEventListener('click', function(){ view = null; sel = null; paintFloor(); });

  var q = $('q');
  if (q) q.addEventListener('input', function(){
    search = q.value;
    $('itemtable').innerHTML = itemTable();
    wireTable();
  });

  var days = $('days');
  if (days) days.addEventListener('change', function(){
    loadStats(Number(days.value), restockAt);
  });
  var rst = $('rst');
  if (rst) rst.addEventListener('change', function(){
    restockAt = Number(rst.value);
    loadStats(stats ? stats.days : 30, restockAt);
  });

  wireTable();

  var up = $('planup');
  if (up) up.addEventListener('click', uploadPlan);
}

function wireTable(){
  document.querySelectorAll('#itemtable th[data-k]').forEach(function(th){
    th.addEventListener('click', function(){
      var k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
      $('itemtable').innerHTML = itemTable();
      wireTable();
    });
  });
  document.querySelectorAll('#itemtable tr[data-item]').forEach(function(tr){
    tr.addEventListener('click', function(){ openItem(tr.dataset.item); });
  });
}

async function uploadPlan(){
  var msg = $('planmsg'), file = $('planfile').files[0];
  if (!file){ msg.textContent = 'Choose a shop-layout.json file first.'; return; }
  msg.textContent = 'Saving…';
  try {
    var parsed = JSON.parse(await file.text());
    var d = await api('/api/shop/layout', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ layout: parsed })
    });
    msg.textContent = 'Saved ' + num(d.barrels) + ' barrels. Reloading…';
    setTimeout(function(){ location.reload(); }, 900);
  } catch (e){ msg.textContent = 'Could not save it: ' + e.message; }
}

function renderAuth(){
  var slot = $('authSlot');
  if (me && me.signedIn){
    slot.innerHTML = '<button class="btn" type="button" id="signout">' +
      esc(me.discordName || 'Signed in') + ' \u00b7 ' + esc(me.tier) + '</button>';
    $('signout').addEventListener('click', async function(){
      try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {}
      location.reload();
    });
  } else {
    slot.innerHTML = '<a class="btn" href="' + API + '/api/auth/login?redirect=' +
      encodeURIComponent('/shop.html') + '">Sign in with Discord</a>';
  }
}

var isEmperor = false;

var restockAt = 16;

async function loadStats(days, restock){
  try {
    stats = await api('/api/shop/stats?days=' + (days || 30) +
      '&restock=' + (restock || restockAt));
    canSeeStats = true;
  } catch (e){
    stats = null;
    canSeeStats = false;
    if (e.status !== 403 && e.status !== 401) console.warn('[shop] stats:', e.message);
  }
  render();
}

async function load(){
  try { me = await api('/api/me'); } catch (e) { me = null; }
  try { renderAuth(); } catch (e) { /* header only */ }
  try {
    var d = await api('/api/shop/layout');
    layout = d.layout;
    shops = d.shops || [];
    isEmperor = !!d.canEdit;
    indexShops();
  } catch (e){
    if (e.status === 401){
      $('body').innerHTML = '<p class="empty">Sign in as a verified citizen of Ethiopia ' +
        'to see the shop floor.</p>';
      $('stamp').textContent = 'Not signed in';
      return;
    }
    throw e;
  }

  await loadStats(30);
  $('stamp').textContent = layout ? (layout.label || 'Megashop') : 'No floor plan';
}

/* Canvas is sized in device pixels, so a resize leaves it stretched until it
   is drawn again. Debounced — resize fires continuously while dragging. */
var resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    paintCharts();
    /* Redrawn from what was already fetched — a resize is not a reason to ask
       the Worker for the same figures again. */
    if (openItemDaily && $('cItem')){
      drawSeries($('cItem'), openItemDaily, {
        lines: [
          { key:'sold_gold',   color:'#189d4d' },
          { key:'bought_gold', color:'#2f6fb8' },
        ],
        emptyText: 'No trades for this item yet',
      });
    }
  }, 180);
});

load().catch(fatal);
</script>
<script src="assets/pagetext.js?v=1"></script>
</body>
