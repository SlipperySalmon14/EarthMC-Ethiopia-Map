<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasury · Ethiopia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&family=Martian+Mono:wght@400;600&family=Noto+Serif+Ethiopic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=2">

<style>
.back{ display:inline-block; font-family:var(--data); font-size:var(--step--1);
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-low); text-decoration:none; }
.back:hover{ color:var(--gold); }
.topbar{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:1.6rem; }
.topbar .spacer{ margin-left:auto; }

.masthead{ border-bottom:1px solid var(--rule); padding-bottom:1.3rem; margin-bottom:1.8rem; }
.masthead h1{ font-size:var(--step-3); letter-spacing:-.03em; }
.masthead .sub{ font-family:var(--data); font-size:var(--step--1); letter-spacing:.15em;
  text-transform:uppercase; color:var(--gold); margin:.5rem 0 0; }

.headline{
  display:flex; align-items:baseline; gap:1.4rem; flex-wrap:wrap;
  padding:1.2rem 1.3rem; background:var(--ink-raised);
  border:1px solid var(--rule); border-top:2px solid var(--gold);
  border-radius:3px; margin-bottom:.8rem;
}
.headline .big{
  font-family:var(--data); font-weight:600; font-size:clamp(1.9rem,1.2rem+2.6vw,3rem);
  letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1;
}
.headline .label{ font-family:var(--data); font-size:var(--step--1);
  letter-spacing:.1em; text-transform:uppercase; color:var(--text-low); }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));
  gap:.7rem; margin-bottom:1.6rem; }
.stat{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--accent,var(--rule)); border-radius:3px; padding:.85rem 1rem; }
.stat .n{ font-family:var(--data); font-weight:600; font-size:var(--step-1);
  font-variant-numeric:tabular-nums; display:block; letter-spacing:-.02em; }
.stat .k{ font-family:var(--data); font-size:.66rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-low); display:block; margin-top:.2rem; }
.stat.in{ --accent:var(--green); } .stat.in .n{ color:var(--green); }
.stat.out{ --accent:var(--red); } .stat.out .n{ color:var(--red); }

.section-head{ display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap;
  border-bottom:1px solid var(--rule); padding-bottom:.7rem; margin:2.2rem 0 1rem; }
.section-head h2{ font-size:var(--step-2); }
.section-head .meta{ margin-left:auto; font-family:var(--data);
  font-size:var(--step--1); color:var(--text-low); }
.ranges{ display:flex; gap:.3rem; }

.chartwrap{ background:var(--ink-raised); border:1px solid var(--rule);
  border-radius:3px; padding:1rem; }
#chart{ width:100%; height:260px; display:block; }

table{ width:100%; border-collapse:collapse; font-size:var(--step--1); }
th{ font-family:var(--data); font-size:.66rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-low); text-align:left; font-weight:400;
  padding:.5rem .6rem; border-bottom:1px solid var(--rule); }
td{ padding:.6rem; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
tr:hover td{ background:var(--ink-raised); }
td.amt{ font-family:var(--data); font-variant-numeric:tabular-nums;
  text-align:right; white-space:nowrap; font-weight:600; }
td.amt.pos{ color:var(--green); } td.amt.neg{ color:var(--red); }
td.when{ font-family:var(--data); font-size:.66rem; color:var(--text-low); white-space:nowrap; }
td.who{ font-family:var(--data); font-size:.7rem; }
.kind{ display:inline-block; font-family:var(--data); font-size:.62rem;
  letter-spacing:.05em; text-transform:uppercase; padding:.12rem .4rem;
  border:1px solid var(--rule); border-radius:2px; color:var(--text-mid); }
.pager{ display:flex; align-items:center; gap:.6rem; margin-top:1rem; }
.pager .where{ font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }

.empty{ border:1px dashed var(--rule); border-radius:3px; padding:1.4rem;
  text-align:center; color:var(--text-mid); font-size:var(--step--1); }
footer{ margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }
</style>
</head>
<body>

<div class="flag-edge" aria-hidden="true"></div>

<div class="shell">

  <div class="topbar">
    <a class="back" href="index.html">&#8592; <span data-en="Ecosystem" data-am="ሥርዓት">Ecosystem</span></a>
    <span class="spacer"></span>
    <div class="lang" role="group" aria-label="Language">
      <button class="btn" type="button" data-set-lang="en" aria-pressed="true">EN</button>
      <button class="btn" type="button" data-set-lang="am" aria-pressed="false" lang="am">አማርኛ</button>
    </div>
    <span id="authSlot"></span>
  </div>

  <header class="masthead">
    <h1 data-en="Treasury" data-am="ግምጃ ቤት">Treasury</h1>
    <p class="sub" data-en="The national ledger" data-am="ብሔራዊ መዝገብ">The national ledger</p>
  </header>

  <div id="body">
    <div class="headline">
      <span class="big" id="balance">&mdash;</span>
      <span class="label" data-en="Current balance" data-am="የአሁኑ ቀሪ ሂሳብ">Current balance</span>
    </div>

    <div class="stats">
      <div class="stat in"><span class="n" id="in30">&mdash;</span><span class="k" data-en="In · 30 days" data-am="ገቢ · 30 ቀን">In · 30 days</span></div>
      <div class="stat out"><span class="n" id="out30">&mdash;</span><span class="k" data-en="Out · 30 days" data-am="ወጪ · 30 ቀን">Out · 30 days</span></div>
      <div class="stat"><span class="n" id="net30">&mdash;</span><span class="k" data-en="Net · 30 days" data-am="ተጣራ · 30 ቀን">Net · 30 days</span></div>
      <div class="stat"><span class="n" id="entries">&mdash;</span><span class="k" data-en="Entries on record" data-am="ጠቅላላ መዝገቦች">Entries on record</span></div>
    </div>

    <div class="section-head">
      <h2 data-en="Balance over time" data-am="የቀሪ ሂሳብ ታሪክ">Balance over time</h2>
      <span class="ranges">
        <button class="btn" type="button" data-days="30">30d</button>
        <button class="btn" type="button" data-days="90" aria-pressed="true">90d</button>
        <button class="btn" type="button" data-days="365">1y</button>
      </span>
    </div>
    <div class="chartwrap"><canvas id="chart"></canvas></div>

    <div class="section-head">
      <h2 data-en="History" data-am="ታሪክ">History</h2>
      <span class="meta" id="histMeta">&mdash;</span>
    </div>
    <div id="history"><p class="empty">Loading…</p></div>
  </div>

  <footer>
    <span>Ethiopia</span>
    <span id="stamp">&nbsp;</span>
  </footer>
</div>

<script>
'use strict';

var API = 'https://earthmc-ethiopia-proxy.ethiopianempire2.workers.dev';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
};
var gold = function(n){ return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-US') + 'g'; };

var me = null, page = 1, days = 90, series = [];

async function api(path, opts){
  var res = await fetch(API + path, Object.assign({ credentials:'include' }, opts || {}));
  var data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { var err = new Error((data && data.error) || ('HTTP ' + res.status)); err.status = res.status; throw err; }
  return data;
}

function applyLang(lang){
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang === 'am' ? 'am' : 'en');
  document.querySelectorAll('[data-en]').forEach(function(el){
    var t = el.getAttribute(lang === 'am' ? 'data-am' : 'data-en');
    if (t) el.textContent = t;
  });
  document.querySelectorAll('[data-set-lang]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.getAttribute('data-set-lang') === lang));
  });
  try { localStorage.setItem('ethiopia-lang', lang); } catch (e) {}
}
document.querySelectorAll('[data-set-lang]').forEach(function(b){
  b.addEventListener('click', function(){ applyLang(b.getAttribute('data-set-lang')); });
});
try { if (localStorage.getItem('ethiopia-lang') === 'am') applyLang('am'); } catch (e) {}

/* --- chart ---------------------------------------------------------------
   Drawn by hand on a canvas rather than pulling in a charting library. One
   line on a dark ground does not justify 200KB of dependency, and this way the
   page has no third-party script at all. */

function drawChart(){
  var c = $('chart'), ctx = c.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth, h = 260;
  c.width = w * dpr; c.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (!series.length){
    ctx.fillStyle = '#756c5d';
    ctx.font = '12px "Martian Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('No entries in this period', w / 2, h / 2);
    return;
  }

  var padL = 58, padR = 10, padT = 14, padB = 26;
  var vals = series.map(function(p){ return p.balance; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max){ min -= 1; max += 1; }
  // Always include zero: a balance line that never shows the floor can make a
  // small dip look catastrophic.
  if (min > 0) min = 0;
  var span = max - min;
  min -= span * 0.08; max += span * 0.08;

  var x = function(i){ return padL + (i / Math.max(1, series.length - 1)) * (w - padL - padR); };
  var y = function(v){ return padT + (1 - (v - min) / (max - min)) * (h - padT - padB); };

  ctx.strokeStyle = '#2b2620'; ctx.lineWidth = 1;
  ctx.fillStyle = '#756c5d'; ctx.font = '10px "Martian Mono", monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var g = 0; g <= 4; g++){
    var v = min + (max - min) * (g / 4), yy = Math.round(y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    ctx.fillText(Math.round(v).toLocaleString('en-US'), padL - 8, yy);
  }

  if (min < 0 && max > 0){
    ctx.strokeStyle = '#7a1318'; ctx.setLineDash([3, 3]);
    var zy = Math.round(y(0)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, zy); ctx.lineTo(w - padR, zy); ctx.stroke();
    ctx.setLineDash([]);
  }

  var grad = ctx.createLinearGradient(0, padT, 0, h - padB);
  grad.addColorStop(0, 'rgba(237,185,18,.20)');
  grad.addColorStop(1, 'rgba(237,185,18,0)');
  ctx.beginPath();
  ctx.moveTo(x(0), y(series[0].balance));
  series.forEach(function(p, i){ ctx.lineTo(x(i), y(p.balance)); });
  ctx.lineTo(x(series.length - 1), h - padB);
  ctx.lineTo(x(0), h - padB);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  series.forEach(function(p, i){ i ? ctx.lineTo(x(i), y(p.balance)) : ctx.moveTo(x(i), y(p.balance)); });
  ctx.strokeStyle = '#edb912'; ctx.lineWidth = 2;
  ctx.lineJoin = 'round'; ctx.stroke();

  ctx.fillStyle = '#756c5d'; ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText(series[0].date, padL, h - padB + 8);
  ctx.textAlign = 'right';
  ctx.fillText(series[series.length - 1].date, w - padR, h - padB + 8);
}

async function loadSeries(){
  try {
    var d = await api('/api/treasury/series?days=' + days);
    series = d.series || [];
    drawChart();
  } catch (e) { series = []; drawChart(); }
}

document.querySelectorAll('[data-days]').forEach(function(b){
  b.addEventListener('click', function(){
    days = Number(b.getAttribute('data-days'));
    document.querySelectorAll('[data-days]').forEach(function(o){
      o.setAttribute('aria-pressed', String(o === b));
    });
    loadSeries();
  });
});

var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 150);
});

/* --- history -------------------------------------------------------------- */

function renderHistory(d){
  var host = $('history');
  if (!d.entries || !d.entries.length){
    host.innerHTML = '<p class="empty">Nothing recorded yet.</p>';
    $('histMeta').textContent = '0 entries';
    return;
  }

  $('histMeta').textContent = d.totalEntries + (d.totalEntries === 1 ? ' entry' : ' entries');

  host.innerHTML = '<table><thead><tr>' +
    '<th>When</th><th>Kind</th><th>Reason</th><th>By</th><th style="text-align:right">Amount</th>' +
    '</tr></thead><tbody>' +
    d.entries.map(function(e){
      var when = new Date(e.at + (/[Zz]|[+-]\d{2}:?\d{2}$/.test(e.at) ? '' : 'Z'));
      var stamp = isNaN(when) ? esc(e.at)
        : when.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) + ' ' +
          when.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
      return '<tr>' +
        '<td class="when">' + stamp + '</td>' +
        '<td><span class="kind">' + esc(e.kind) + '</span></td>' +
        '<td>' + esc(e.note || '') + (e.ref ? ' <span class="kind">' + esc(e.ref) + '</span>' : '') + '</td>' +
        '<td class="who">' + esc(e.actor) + '</td>' +
        '<td class="amt ' + (e.amount < 0 ? 'neg' : 'pos') + '">' +
          (e.amount < 0 ? '' : '+') + gold(e.amount) + '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>' +
    '<div class="pager">' +
      '<button class="btn" type="button" id="prev"' + (d.page <= 1 ? ' disabled' : '') + '>Previous</button>' +
      '<button class="btn" type="button" id="next"' + (d.page >= d.totalPages ? ' disabled' : '') + '>Next</button>' +
      '<span class="where">Page ' + d.page + ' of ' + d.totalPages + '</span>' +
    '</div>';

  var prev = $('prev'), next = $('next');
  if (prev) prev.addEventListener('click', function(){ if (page > 1){ page--; loadHistory(); } });
  if (next) next.addEventListener('click', function(){ if (page < d.totalPages){ page++; loadHistory(); } });
}

async function loadHistory(){
  try { renderHistory(await api('/api/treasury/history?page=' + page)); }
  catch (e) { $('history').innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; }
}

/* --- auth ----------------------------------------------------------------- */

function renderAuth(){
  var slot = $('authSlot');
  if (me && me.signedIn){
    slot.innerHTML = '<button class="btn" type="button" id="signout">' +
      esc(me.discordName || 'Signed in') + ' \u00b7 ' + esc(me.tier) + '</button>';
    $('signout').addEventListener('click', async function(){
      try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {}
      location.reload();
    });
  } else {
    slot.innerHTML = '<a class="btn" href="' + API +
      '/api/auth/login?redirect=' + encodeURIComponent('/treasury.html') +
      '">Sign in with Discord</a>';
  }
}

async function load(){
  try { me = await api('/api/me'); } catch (e) { me = null; }
  renderAuth();

  try {
    var s = await api('/api/treasury/summary');
    $('balance').textContent = gold(s.balance);
    $('balance').style.color = s.balance < 0 ? 'var(--red)' : 'var(--text)';
    $('in30').textContent = '+' + gold(s.deposits30d);
    $('out30').textContent = '-' + gold(s.withdrawals30d);
    var net = s.deposits30d - s.withdrawals30d;
    $('net30').textContent = (net >= 0 ? '+' : '') + gold(net);
    $('net30').style.color = net < 0 ? 'var(--red)' : (net > 0 ? 'var(--green)' : 'var(--text)');
    $('entries').textContent = s.entriesTotal.toLocaleString('en-US');
    $('stamp').textContent = 'Live from the ledger';

    await loadSeries();
    await loadHistory();
  } catch (err) {
    $('body').innerHTML = '<p class="empty">' + esc(
      err.status === 401
        ? 'Sign in with Discord to view the treasury.'
        : 'Treasury unavailable: ' + err.message
    ) + '</p>';
    $('stamp').textContent = err.status === 401 ? 'Not signed in' : 'Unavailable';
  }
}

load();
</script>
</body>
</html>
