<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War Department · Ethiopia</title>
<script src="assets/session.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&family=Martian+Mono:wght@400;600&family=Noto+Serif+Ethiopic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/base.css?v=3">
<style>
.back{ display:inline-block; font-family:var(--data); font-size:var(--step--1);
  letter-spacing:.08em; text-transform:uppercase; color:var(--text-low); text-decoration:none; }
.back:hover{ color:var(--gold); }
.topbar{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; margin-bottom:1.4rem; }
.topbar .spacer{ margin-left:auto; }
.masthead{ border-bottom:1px solid var(--rule-soft); padding-bottom:1.2rem; margin-bottom:1.4rem; }
.masthead h1{ font-size:var(--step-3); letter-spacing:-.03em; }
.masthead .sub{ font-family:var(--display); font-weight:400; font-style:italic;
  font-size:var(--step-1); color:var(--gold); margin:.35rem 0 0; }

.search{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1.2rem; }
.f{ display:flex; flex-direction:column; gap:.25rem; }
.f label{ font-family:var(--data); font-size:.62rem; color:var(--text-low); letter-spacing:.05em; }
.f input{ background:var(--ink); color:var(--text); border:1px solid var(--rule);
  border-radius:var(--r-sm); padding:.45rem .6rem; font-family:var(--body); font-size:.86rem; min-width:14rem; }
.f input:focus{ border-color:var(--gold); outline:none; }

.watchlist{ display:flex; gap:.35rem; flex-wrap:wrap; margin-bottom:1.2rem; }
.watchlist .w{ font-family:var(--data); font-size:.7rem; padding:.3rem .8rem;
  background:var(--ink-raised); border:1px solid var(--rule); border-radius:999px;
  color:var(--text-mid); cursor:pointer; }
.watchlist .w.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600; }
.watchlist .w:hover{ border-color:var(--gold-dim); color:var(--text); }
.watchlist .w b{ color:var(--gold); font-weight:600; }

.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(8rem,1fr)); gap:.6rem; margin-bottom:1rem; }
.stat{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--accent,var(--rule)); border-radius:var(--r-md); padding:.75rem .9rem; }
.stat .n{ font-family:var(--data); font-weight:600; font-size:var(--step-1);
  font-variant-numeric:tabular-nums; display:block; }
.stat .k{ font-family:var(--data); font-size:.6rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-low); display:block; margin-top:.2rem; }
.stat.red{ --accent:var(--red); } .stat.red .n{ color:var(--red); }
.stat.gold{ --accent:var(--gold); } .stat.gold .n{ color:var(--gold); }
.stat.green{ --accent:var(--green); } .stat.green .n{ color:var(--green); }
.stat.grey .n{ color:var(--text-low); }

.section-head{ position:relative; display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap;
  border-bottom:1px solid var(--rule); padding-bottom:.7rem; margin:1.8rem 0 1rem; }
.section-head::after{ content:''; position:absolute; left:0; bottom:-1px; width:3.2rem; height:2px;
  background:linear-gradient(90deg, var(--green) 0 33.33%, var(--gold) 33.33% 66.66%, var(--red) 66.66% 100%); }
.section-head h2{ font-size:var(--step-2); }
.section-head .meta{ margin-left:auto; font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }

table{ width:100%; border-collapse:collapse; font-size:var(--step--1); }
th{ font-family:var(--data); font-size:.62rem; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-low); text-align:left; font-weight:400; padding:.45rem .5rem;
  border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--ink); }
td{ padding:.45rem .5rem; border-bottom:1px solid var(--rule-soft);
  font-family:var(--data); font-size:.72rem; font-variant-numeric:tabular-nums; }
td.n{ text-align:right; }
td.name{ color:var(--text); font-weight:600; font-family:var(--body); }
tr.imminent td{ background:rgba(207,32,41,.10); }
tr.imminent td.days{ color:var(--red); font-weight:600; }
tr.soon td.days{ color:var(--gold); }
tr.unknown td{ color:var(--text-low); font-style:italic; }
.tablewrap{ max-height:30rem; overflow:auto; border:1px solid var(--rule); border-radius:var(--r-md); }

.bars{ display:flex; height:1.6rem; border-radius:var(--r-sm); overflow:hidden;
  border:1px solid var(--rule); margin-bottom:.4rem; }
.bars i{ display:block; height:100%; }
.barkey{ display:flex; flex-wrap:wrap; gap:.8rem; font-family:var(--data); font-size:.64rem;
  color:var(--text-low); }
.barkey span{ display:flex; align-items:center; gap:.3rem; }
.barkey em{ width:.7rem; height:.7rem; border-radius:2px; display:inline-block; font-style:normal; }

canvas{ width:100%; height:200px; display:block; }
#warMap{ height:30rem; border-radius:var(--r-md); background:#0b0a08; }

/* The 42-day board. Cards rather than another table, because this is the one
   thing on the page people will act on and a row in a list of forty does not
   carry that. Each card is a decision. */
.fallgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.6rem; }
.fall{ background:var(--ink-raised); border:1px solid var(--rule);
  border-left:3px solid var(--urg,var(--rule)); border-radius:var(--r-md);
  padding:.75rem .85rem; cursor:pointer; transition:border-color .12s ease; position:relative; }
.fall:hover{ border-color:var(--urg,var(--gold-dim)); }
.fall .top{ display:flex; align-items:baseline; gap:.5rem; }
.fall .nm{ font-family:var(--display); font-weight:600; font-size:.95rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fall .d{ margin-left:auto; font-family:var(--data); font-weight:600;
  font-size:1.25rem; color:var(--urg); font-variant-numeric:tabular-nums; }
.fall .d small{ font-size:.6rem; font-weight:400; color:var(--text-low); margin-left:.1rem; }
.fall .clock{ height:4px; border-radius:2px; background:var(--ink); margin:.5rem 0 .45rem;
  overflow:hidden; }
.fall .clock i{ display:block; height:100%; background:var(--urg); }
.fall .meta{ font-family:var(--data); font-size:.64rem; color:var(--text-low);
  display:flex; flex-wrap:wrap; gap:.5rem; }
.fall .meta b{ color:var(--text-mid); font-weight:400; }
.fall .who{ display:flex; align-items:center; gap:.35rem; margin-top:.45rem;
  font-family:var(--data); font-size:.66rem; color:var(--text-mid); }
.fall .who img{ width:16px; height:16px; border-radius:2px; image-rendering:pixelated; }
.fall .tag{ position:absolute; top:.5rem; right:.6rem; font-family:var(--data);
  font-size:.56rem; letter-spacing:.06em; text-transform:uppercase; padding:.1rem .3rem;
  border-radius:2px; }
.fallband{ font-family:var(--data); font-size:.62rem; letter-spacing:.08em;
  text-transform:uppercase; color:var(--text-low); margin:1rem 0 .5rem; }
#warMap .leaflet-control-attribution{ display:none; }
.maplegend{ display:flex; flex-wrap:wrap; gap:.7rem; margin-top:.6rem;
  font-family:var(--data); font-size:.64rem; color:var(--text-low); }
.maplegend span{ display:flex; align-items:center; gap:.3rem; }
.maplegend em{ width:.7rem; height:.7rem; border-radius:2px; display:inline-block; font-style:normal; }
.maptools{ display:flex; gap:.35rem; flex-wrap:wrap; margin-bottom:.6rem; }
.maptools .btn{ padding:.28rem .7rem; font-size:.66rem; }
.maptools .btn.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600; }
.leaflet-popup-content-wrapper{ background:var(--ink-raised); color:var(--text);
  border:1px solid var(--rule); border-radius:var(--r-md); }
.leaflet-popup-tip{ background:var(--ink-raised); border:1px solid var(--rule); }
.leaflet-popup-content{ margin:.7rem .9rem; font-family:var(--body); font-size:.8rem; }
.wpop h4{ font-family:var(--display); font-size:.95rem; margin:0 0 .3rem; }
.wpop .r, .r{ display:flex; justify-content:space-between; gap:.8rem;
  font-family:var(--data); font-size:.68rem; padding:.12rem 0; }
.wpop .r span:last-child, .r span:last-child{ color:var(--text); font-variant-numeric:tabular-nums; }
.card{ background:var(--ink-raised); border:1px solid var(--rule); border-radius:var(--r-md);
  padding:1rem 1.1rem; margin-bottom:.8rem; }
.card h3{ font-family:var(--display); font-size:var(--step-0); margin:0 0 .15rem; }
.card .cap{ font-family:var(--data); font-size:.62rem; color:var(--text-low); margin:0 0 .7rem; }

.empty{ border:1px dashed var(--rule); border-radius:var(--r-md); padding:1.4rem;
  text-align:center; color:var(--text-mid); font-size:var(--step--1); }
.note{ font-family:var(--data); font-size:.66rem; color:var(--text-low); margin:.5rem 0 0; }
footer{ margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  font-family:var(--data); font-size:var(--step--1); color:var(--text-low); }
</style>
</head>
<body>
<div class="flag-edge" aria-hidden="true"></div>
<div class="shell">

  <div class="topbar">
    <a class="back" href="admin.html">&#8592; Admin</a>
    <span class="spacer"></span>
    <span id="authSlot"></span>
  </div>

  <header class="masthead">
    <h1>War Department</h1>
    <p class="sub">Who is holding, and who is only still listed</p>
  </header>

  <div class="search">
    <div class="f">
      <label for="nationInput">Nation</label>
      <input id="nationInput" placeholder="Nation name, e.g. Nubia" autocomplete="off">
    </div>
    <button class="btn" type="button" id="goBtn">Assess</button>
    <button class="btn" type="button" id="watchBtn" hidden>Watch</button>
  </div>

  <div class="watchlist" id="watchlist"></div>
  <div id="body"><p class="empty">Name a nation to assess it.</p></div>

  <footer><span>Ethiopia</span><span id="stamp">&nbsp;</span></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="assets/chart.js?v=1"></script>
<script>
'use strict';
var API = 'https://earthmc-ethiopia-proxy.ethiopianempire2.workers.dev';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
var num = function(n){ return (Number(n) || 0).toLocaleString('en-US'); };

var me = null, intel = null, watching = [], overview = null;
var view = 'watch';        // 'watch' | 'nation'
var hideLapsed = false, rosterQ = '';
var warMap = null, mapColour = 'falling';
/* Each layer independent, because they answer different questions and nobody
   wants all of them at once. Defaults are what you want on opening: the land,
   who holds it, and nothing else competing for attention. */
var warShow = { terrain: true, outlines: true, markers: true, chunks: false,
                range: false, labels: false };

/* The same projection the main map uses: x east, -z north, so a Leaflet
   latLng is (-z, x). Reimplemented here rather than imported because war.html
   needs four lines of it and loading the whole map page to get them would
   bring 10,000 lines of editing tools with it. */
var MC = {
  toLatLng: function(x, z){ return L.latLng(-z, x); },
};
var openTown = null;       // town name whose roster is expanded

async function api(path, opts){
  var res = await fetch(API + path, Object.assign({ credentials:'include' }, opts || {}));
  var d = null;
  try { d = await res.json(); } catch (e) {}
  if (!res.ok){
    var err = new Error((d && d.detail) || (d && d.error) || ('HTTP ' + res.status));
    err.status = res.status; err.code = d && d.error; throw err;
  }
  return d;
}

function ethiopiaProfileChip(me){
  var face = me.avatarUrl
    ? '<img src="' + esc(me.avatarUrl) + '" alt="" width="18" height="18" ' +
      'style="width:18px;height:18px;border-radius:50%;object-fit:cover;' +
      'vertical-align:-.2rem;margin-right:.35rem" onerror="this.style.display=\'none\'">' : '';
  var head = me.mcName
    ? '<img src="https://minotar.net/helm/' + encodeURIComponent(me.mcName) + '/18.png" ' +
      'alt="" width="18" height="18" style="width:18px;height:18px;border-radius:2px;' +
      'image-rendering:pixelated;vertical-align:-.2rem;margin-right:.35rem" ' +
      'onerror="this.style.display=\'none\'">' : '';
  var who = me.mcName
    ? esc(me.mcName) + (me.discordName ? ' \u00b7 ' + esc(me.discordName) : '')
    : esc(me.discordName || 'Signed in');
  return face + head + who + ' \u00b7 ' + esc(me.tier);
}

function renderAuth(){
  var slot = $('authSlot');
  if (me && me.signedIn){
    slot.innerHTML = '<button class="btn" type="button" id="signout">' +
      ethiopiaProfileChip(me) + '</button>';
    $('signout').addEventListener('click', async function(){
      try { await api('/api/auth/logout', { method:'POST' }); } catch (e) {}
      location.reload();
    });
  } else {
    slot.innerHTML = '<a class="btn" href="' + API + '/api/auth/login?redirect=' +
      encodeURIComponent('/war.html') + '">Sign in with Discord</a>';
  }
}

/* ---- the report ---------------------------------------------------------- */

function activityBar(a){
  var total = a.counted || 1;
  var seg = [
    ['active7',  a.active7,  'var(--green)',    'active this week'],
    ['idle14',   a.idle14,   '#9aa84e',          'idle 2 weeks'],
    ['idle30',   a.idle30,   'var(--gold)',      'idle a month'],
    ['lapsed42', a.lapsed42, 'var(--red)',       'past 42 days'],
    ['unknown',  a.unknown,  'var(--text-low)',  'opted out of the API'],
  ];
  return '<div class="bars">' + seg.map(function(s){
    var pct = (s[1] / total) * 100;
    return pct > 0 ? '<i style="width:' + pct + '%;background:' + s[2] + '" title="' +
      s[1] + ' ' + s[3] + '"></i>' : '';
  }).join('') + '</div>' +
  '<div class="barkey">' + seg.map(function(s){
    return '<span><em style="background:' + s[2] + '"></em>' + esc(s[3]) + ' <b>' + num(s[1]) + '</b></span>';
  }).join('') + '</div>';
}

function townsTable(towns){
  if (!towns.length) return '<p class="empty">No towns.</p>';
  return '<div class="tablewrap"><table><thead><tr>' +
    '<th>Town</th><th style="text-align:right">Res (holding)</th>' +
    '<th style="text-align:right">Chunks</th><th style="text-align:right">Idle</th>' +
    '<th style="text-align:right">Falls in</th><th>Flags</th>' +
    '</tr></thead><tbody>' +
    towns.map(function(t){
      var cls = t.daysLeft === null ? 'unknown'
        : t.daysLeft <= 7 ? 'imminent'
        : t.daysLeft <= 14 ? 'soon' : '';
      var flags = [];
      if (t.isCapital) flags.push('<span style="color:var(--gold)">capital</span>');
      if (t.isOpen) flags.push('<span style="color:var(--green)">open</span>');
      if (t.isOverClaimed) flags.push('<span style="color:var(--red)">overclaimed</span>');
      /* Said explicitly when some residents are invisible. A town where half
         the roster opted out could be wide open or perfectly healthy, and the
         figure alone does not distinguish those. */
      if (t.known < t.residents) {
        flags.push('<span style="color:var(--text-low)">' +
          (t.residents - t.known) + ' unseen</span>');
      }
      var open = openTown === t.name;
      var roster = open && t.roster && t.roster.length
        ? '<tr><td colspan="7" style="background:var(--ink);padding:.6rem .8rem">' +
          '<div style="font-family:var(--data);font-size:.62rem;color:var(--text-low);' +
            'letter-spacing:.06em;text-transform:uppercase;margin-bottom:.4rem">' +
            esc(t.name) + ' · ' + t.holders + ' of ' + t.residents +
            ' still inside the 42 days</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:.3rem">' +
          t.roster.map(function(r){
            var col = r.idleDays === null ? 'var(--text-low)'
              : r.idleDays >= 42 ? 'var(--red)'
              : r.idleDays >= 30 ? 'var(--gold)' : 'var(--green)';
            return '<span style="display:inline-flex;align-items:center;gap:.3rem;' +
              'padding:.2rem .45rem;background:var(--ink-raised);border:1px solid var(--rule);' +
              'border-radius:var(--r-sm);font-family:var(--data);font-size:.66rem">' +
              '<img src="https://minotar.net/helm/' + encodeURIComponent(r.name) + '/16.png" ' +
                'alt="" width="16" height="16" style="width:16px;height:16px;border-radius:2px;' +
                'image-rendering:pixelated" onerror="this.style.visibility=\'hidden\'">' +
              esc(r.name) + '<span style="color:' + col + '">' +
              (r.online ? 'on' : r.idleDays === null ? 'unseen' : r.idleDays + 'd') +
              '</span></span>';
          }).join('') + '</div>' +
          '<p class="note" style="margin-top:.4rem">The town falls 42 days after the ' +
          'GREENEST figure here, not the average. Everyone else is already gone as far ' +
          'as the clock is concerned.</p></td></tr>'
        : '';

      return '<tr class="' + cls + '" data-town="' + esc(t.name) + '" style="cursor:pointer">' +
        '<td class="name">' + esc(t.name) +
          '<span style="color:var(--text-low);margin-left:.3rem">' + (open ? '\u25b4' : '\u25be') +
          '</span></td>' +
        '<td class="n">' + num(t.residents) +
          (t.holders != null && t.holders < t.residents
            ? '<span style="color:var(--red)"> (' + t.holders + ')</span>' : '') + '</td>' +
        '<td class="n">' + num(t.chunks) +
          (t.maxChunks ? '<span style="color:var(--text-low)">/' + num(t.maxChunks) + '</span>' : '') + '</td>' +
        '<td class="n">' + (t.idleDays === null ? '—' : t.idleDays + 'd') + '</td>' +
        '<td class="n days">' + (t.daysLeft === null ? 'unknown' : t.daysLeft + 'd') + '</td>' +
        '<td>' + flags.join(' · ') + '</td></tr>' + roster;
    }).join('') + '</tbody></table></div>';
}

function render(){
  renderWatchlist();
  if (view === 'watch'){
    $('body').innerHTML = renderOverview();
    $('body').querySelectorAll('[data-assess]').forEach(function(b){
      b.addEventListener('click', function(){
        $('nationInput').value = b.dataset.assess;
        assess();
      });
    });
    var wb0 = $('watchBtn'); if (wb0) wb0.hidden = true;
    return;
  }
  if (!intel){ $('body').innerHTML = '<p class="empty">Name a nation to assess it.</p>'; return; }
  var n = intel.nation, a = intel.activity;
  var out = '';

  out += '<div class="section-head"><h2>' + esc(n.name) + '</h2>' +
    '<span class="meta">' + (n.king ? 'led by ' + esc(n.king) + ' · ' : '') +
    (intel.watched ? 'watched · ' + intel.history.length + ' day(s) recorded' : 'not watched') +
    '</span></div>';

  out += '<div class="stats">' +
    '<div class="stat"><span class="n">' + num(n.towns) + '</span><span class="k">Towns</span></div>' +
    '<div class="stat"><span class="n">' + num(n.residents) + '</span><span class="k">Residents</span></div>' +
    '<div class="stat"><span class="n">' + num(n.chunks) + '</span><span class="k">Chunks</span></div>' +
    '<div class="stat gold"><span class="n">' + num(n.balance) + 'g</span><span class="k">Nation bank</span></div>' +
    '<div class="stat green"><span class="n">' + num(a.online) + '</span><span class="k">Online now</span></div>' +
    '<div class="stat ' + (intel.atRisk ? 'red' : 'grey') + '"><span class="n">' +
      num(intel.atRisk) + '</span><span class="k">Towns falling in 12d</span></div>' +
    '<div class="stat ' + (intel.openTowns ? 'green' : 'grey') + '"><span class="n">' +
      num(intel.openTowns) + '</span><span class="k">Open to join</span></div>' +
    '<div class="stat ' + (intel.overClaimed ? 'red' : 'grey') + '"><span class="n">' +
      num(intel.overClaimed) + '</span><span class="k">Overclaimable</span></div>' +
    '</div>';

  /* The score first, because it is the answer and everything below is the
     working. Shown with its four parts, never alone — a single number about
     another nation's strength is exactly the kind of thing that gets quoted
     back without its assumptions. */
  if (intel.resolve){
    var rv = intel.resolve, sc = rv.score;
    var scol = sc >= 60 ? 'var(--green)' : sc >= 35 ? 'var(--gold)' : 'var(--red)';
    var word = sc >= 60 ? 'holding' : sc >= 35 ? 'strained' : 'collapsing';
    out += '<div class="card" style="border-left:3px solid ' + scol + '">' +
      '<div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">' +
      '<span style="font-family:var(--display);font-size:2.6rem;font-weight:600;color:' +
        scol + ';line-height:1">' + sc + '</span>' +
      '<div><h3 style="margin:0">Resolve &mdash; ' + word + '</h3>' +
      '<p class="cap" style="margin:.1rem 0 0">Out of 100. How much of this nation is ' +
        'still turning up, and how much of its land depends on people who are not.</p></div></div>' +
      '<div style="display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.8rem;' +
        'font-family:var(--data);font-size:.68rem;color:var(--text-mid)">' +
        '<span>' + rv.parts.activeShare + '% active this week</span>' +
        '<span>' + rv.parts.aliveShare + '% not yet past 42 days</span>' +
        '<span>' + rv.parts.landShare + '% of land not on a falling town</span>' +
        '<span>' + num(rv.fallingChunks) + ' of ' + num(rv.totalChunks) + ' chunks at risk</span>' +
      '</div>' +
      '<p class="note">Weighted toward activity, because activity is what holds land &mdash; ' +
        'big claims with nobody logging in is not strength, it is a queue. The weights are ' +
        'a judgement, so the four parts are shown and you can disagree with the total.</p></div>';
  }

  if (intel.projection && intel.projection.length){
    out += '<div class="card"><h3>If nobody logs in again</h3>' +
      '<p class="cap">Cumulative. A worst case, and it moves the moment anyone returns.</p>' +
      '<div class="tablewrap" style="max-height:none"><table><thead><tr>' +
      '<th>Within</th><th style="text-align:right">Towns fall</th>' +
      '<th style="text-align:right">Residents</th><th style="text-align:right">Chunks freed</th>' +
      '</tr></thead><tbody>' +
      intel.projection.map(function(p){
        return '<tr' + (p.towns ? '' : ' class="unknown"') + '>' +
          '<td class="name">' + p.days + ' days</td>' +
          '<td class="n">' + num(p.towns) + '</td>' +
          '<td class="n">' + num(p.residents) + '</td>' +
          '<td class="n">' + num(p.chunks) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  out += '<div class="card"><h3>Who is actually there</h3>' +
    '<p class="cap">Every resident once, by how long since they last logged in.</p>' +
    activityBar(a) +
    '<p class="note">Anyone who has opted out of the EarthMC API shows as unseen rather ' +
    'than inactive. Treating silence as absence would mark living towns as falling, and ' +
    'sending people to overclaim a town that is still held is the worse mistake.</p></div>';

  /* The 42-day board, above the map.
   *
   * Everything else here describes a nation; this is the list of things that
   * are about to stop existing, which is the only part anyone opens this page
   * in a hurry for. Banded by urgency rather than sorted into one long run,
   * because "this week" and "next month" are different decisions and a
   * continuous list makes you find the boundary yourself. */
  var falling = (intel.towns || []).filter(function(t){
    return t.daysLeft !== null && t.daysLeft <= 42; });

  if (falling.length){
    var bands = [
      { max: 7,  label: 'Within a week',     col: '#cf2029' },
      { max: 14, label: 'Within two weeks',  col: '#e06c1f' },
      { max: 28, label: 'Within a month',    col: '#edb912' },
      { max: 42, label: 'Within six weeks',  col: '#9aa84e' },
    ];
    out += '<div class="section-head"><h2>Running out</h2>' +
      '<span class="meta">' + falling.length + ' town' + (falling.length === 1 ? '' : 's') +
      ' on the 42-day clock</span></div>';

    var done = 0;
    bands.forEach(function(b, i){
      var prev = i ? bands[i - 1].max : -1;
      var inBand = falling.filter(function(t){
        return t.daysLeft > prev && t.daysLeft <= b.max; });
      if (!inBand.length) return;
      done += inBand.length;
      out += '<div class="fallband">' + esc(b.label) + ' · ' + inBand.length + '</div>' +
        '<div class="fallgrid">' + inBand.map(function(t){
          /* The bar runs the other way on purpose: it fills as the town runs
             out, so a nearly-full bar is a nearly-dead town. A bar that
             empties reads as progress, which is the opposite of what this is. */
          var used = Math.round(((42 - t.daysLeft) / 42) * 100);
          var holder = (t.roster || []).filter(function(r){
            return r.idleDays !== null && r.idleDays < 42; })[0];
          return '<div class="fall" data-fall="' + esc(t.name) + '" style="--urg:' + b.col + '">' +
            (t.chainCritical
              ? '<span class="tag" style="background:rgba(237,185,18,.18);color:#edb912">chain</span>'
              : t.isOverClaimed
              ? '<span class="tag" style="background:rgba(207,32,41,.18);color:#cf2029">overclaimed</span>'
              : '') +
            '<div class="top"><span class="nm">' + esc(t.name) + '</span>' +
              '<span class="d">' + t.daysLeft + '<small>d</small></span></div>' +
            '<div class="clock"><i style="width:' + used + '%"></i></div>' +
            '<div class="meta">' +
              '<span><b>' + num(t.chunks) + '</b> chunks</span>' +
              '<span><b>' + t.residents + '</b> res' +
                (t.holders != null && t.holders < t.residents
                  ? ', <b>' + t.holders + '</b> holding' : '') + '</span>' +
              '<span><b>' + num(t.balance) + 'g</b></span>' +
              (t.isOpen ? '<span style="color:var(--green)">open</span>' : '') +
            '</div>' +
            (holder
              ? '<div class="who"><img src="https://minotar.net/helm/' +
                encodeURIComponent(holder.name) + '/16.png" alt="" ' +
                'onerror="this.style.visibility=\'hidden\'">' +
                'held by ' + esc(holder.name) +
                (holder.online ? ' · <span style="color:var(--green)">on now</span>'
                  : ' · ' + holder.idleDays + 'd') + '</div>'
              : '<div class="who" style="color:var(--text-low)">nobody visible is holding it</div>') +
          '</div>';
        }).join('') + '</div>';
    });

    out += '<p class="note">The bar fills as the clock runs down, so a full bar is a town ' +
      'about to go. Click any card to find it on the map.</p>';
  }

  out += '<div class="section-head"><h2>The ground</h2>' +
    '<span class="meta">every claim, coloured by how long it has left</span></div>' +
    '<div class="maptools">' +
      ['falling','size','chain'].map(function(m){
        var label = { falling:'Time left', size:'Size', chain:'Chain' }[m];
        return '<button type="button" class="btn ' + (mapColour === m ? 'on' : '') +
          '" data-mc="' + m + '">' + label + '</button>';
      }).join('') +
      '<span style="width:1px;background:var(--rule);margin:0 .3rem"></span>' +
      [['terrain','Terrain'],['outlines','Borders'],['markers','Towns'],
       ['chunks','Chunks'],['range','Range'],['labels','Names']].map(function(k){
        return '<button type="button" class="btn ' + (warShow[k[0]] ? 'on' : '') +
          '" data-layer="' + k[0] + '">' + k[1] + '</button>';
      }).join('') +
    '</div>' +
    '<div id="warMap"></div>' +
    '<div class="maplegend" id="mapLegend"></div>';

  if (intel.disconnected && intel.disconnected.length){
    out += '<div class="card" style="margin-top:.8rem;border-left:3px solid var(--red)">' +
      '<h3 style="color:var(--red)">Already out of range</h3>' +
      '<p class="cap">No reach link back to the capital. These are not at risk of leaving ' +
      'the nation &mdash; they are leaving it.</p>' +
      '<div style="display:flex;flex-wrap:wrap;gap:.3rem">' +
      intel.disconnected.map(function(n){
        return '<span style="font-family:var(--data);font-size:.68rem;padding:.2rem .5rem;' +
          'background:rgba(207,32,41,.14);border:1px solid var(--red-dim);' +
          'border-radius:var(--r-sm);color:var(--red)">' + esc(n) + '</span>';
      }).join('') + '</div></div>';
  }

  if (intel.chainCritical && intel.chainCritical.length){
    out += '<div class="card" style="margin-top:.8rem;border-left:3px solid var(--gold)">' +
      '<h3>Load-bearing towns</h3>' +
      '<p class="cap">Lose one of these and everything beyond it drops out of nation range, ' +
      'whatever its own size.</p>' +
      intel.chainCritical.slice(0, 10).map(function(c){
        var urgent = c.daysLeft !== null && c.daysLeft <= 21;
        return '<div class="wpop r" style="border-bottom:1px solid var(--rule-soft)">' +
          '<span style="color:' + (urgent ? 'var(--red)' : 'var(--text)') + '">' +
            esc(c.name) + '</span>' +
          '<span>strands ' + c.stranded + ' town' + (c.stranded === 1 ? '' : 's') +
            (c.daysLeft === null ? '' : ' · ' + c.daysLeft + 'd left') + '</span></div>';
      }).join('') +
      (intel.chainAtRisk && intel.chainAtRisk.length
        ? '<p class="note" style="color:var(--red)">' + intel.chainAtRisk.length +
          ' of these are also running out within three weeks. That pairing — holding the ' +
          'chain AND nearly gone — is the shortlist worth acting on.</p>'
        : '<p class="note">None of them are close to falling.</p>') +
      '</div>';
  }

  out += '<div class="section-head"><h2>Towns</h2>' +
    '<span class="meta">soonest to fall first · 42 days with no login deletes a town</span></div>' +
    townsTable(intel.towns) +
    '<p class="note">The clock runs on the MOST RECENT login in each town, so one active ' +
    'resident holds a town of lapsed ones indefinitely. &ldquo;Falls in&rdquo; is what is ' +
    'left of the 42 days from that login.</p>';

  if (intel.roster && intel.roster.length){
    var lapsedCount = intel.roster.filter(function(r){ return r.lapsed; }).length;
    out += '<div class="section-head"><h2>Everyone</h2>' +
      '<span class="meta">' + num(intel.roster.length) + ' people · ' +
      num(lapsedCount) + ' already past 42 days</span></div>' +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem">' +
      '<label style="font-family:var(--data);font-size:.68rem;color:var(--text-mid);' +
        'display:flex;align-items:center;gap:.35rem">' +
        '<input type="checkbox" id="hideLapsed"' + (hideLapsed ? ' checked' : '') + '> ' +
        'hide the ' + num(lapsedCount) + ' already gone</label>' +
      '<input id="rosterSearch" placeholder="Filter by name or town" value="' +
        esc(rosterQ) + '" style="flex:1 1 12rem;background:var(--ink);color:var(--text);' +
        'border:1px solid var(--rule);border-radius:var(--r-sm);padding:.3rem .5rem;' +
        'font-family:var(--data);font-size:.7rem">' +
      '</div>' +
      '<div class="tablewrap"><table><thead><tr>' +
      '<th>Player</th><th>Town</th><th style="text-align:right">Idle</th>' +
      '<th style="text-align:right">Their 42d</th>' +
      '</tr></thead><tbody>' +
      intel.roster.filter(function(r){
        /* Lapsed players stay COUNTED either way — the header total and the
           resolve score both include them. Hiding is only about reading the
           list; a nation's dead weight is the most important thing about it
           and must never silently vanish from the figures. */
        if (hideLapsed && r.lapsed) return false;
        if (!rosterQ) return true;
        var q = rosterQ.toLowerCase();
        return String(r.name).toLowerCase().indexOf(q) >= 0 ||
               String(r.town || '').toLowerCase().indexOf(q) >= 0;
      }).map(function(r){
        var cls = r.idleDays === null ? 'unknown'
          : r.lapsed ? 'imminent' : r.idleDays >= 30 ? 'soon' : '';
        return '<tr class="' + cls + '">' +
          '<td class="name"><img src="https://minotar.net/helm/' +
            encodeURIComponent(r.name) + '/16.png" alt="" width="16" height="16" ' +
            'style="width:16px;height:16px;border-radius:2px;image-rendering:pixelated;' +
            'vertical-align:-.15rem;margin-right:.35rem" ' +
            'onerror="this.style.visibility=\'hidden\'">' + esc(r.name) +
            (r.online ? ' <span style="color:var(--green)">online</span>' : '') + '</td>' +
          '<td>' + esc(r.town || '—') + '</td>' +
          '<td class="n">' + (r.idleDays === null ? 'unseen' : r.idleDays + 'd') + '</td>' +
          '<td class="n days">' + (r.daysLeft === null ? '—'
            : r.lapsed ? 'gone' : r.daysLeft + 'd') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="note">Someone past 42 days is shown as gone but still counted everywhere ' +
      'above &mdash; they are the reason a town falls, so removing them from the totals ' +
      'would hide the thing worth knowing.</p>';
  }

  if (intel.history && intel.history.length > 1){
    out += '<div class="section-head"><h2>Trend</h2>' +
      '<span class="meta">one row a day since watching began</span></div>' +
      '<div class="card"><h3>Residents and towns</h3>' +
      '<p class="cap">A nation shedding people for a fortnight is the signal, not its count today.</p>' +
      '<canvas id="cTrend"></canvas></div>' +
      '<div class="card"><h3>Land</h3>' +
      '<p class="cap">Chunks claimed, day by day.</p>' +
      '<canvas id="cLand"></canvas></div>';
  } else if (intel.watched){
    out += '<p class="note">Watching started recently — a trend needs at least two days.</p>';
  }

  $('body').innerHTML = out;

  if (intel.history && intel.history.length > 1 && window.EthChart){
    EthChart.line($('cTrend'), intel.history.map(function(r){
      return { x: r.day, residents: r.residents, towns: r.towns };
    }), { keys:['residents','towns'], colors:[EthChart.colors[0], EthChart.colors[2]] });
    EthChart.line($('cLand'), intel.history.map(function(r){
      return { x: r.day, chunks: r.chunks };
    }), { keys:['chunks'], colors:[EthChart.gold] });
  }

  drawWarMap();
  $('body').querySelectorAll('[data-fall]').forEach(function(card){
    card.addEventListener('click', function(){
      var t = (intel.towns || []).filter(function(x){ return x.name === card.dataset.fall; })[0];
      if (!t || typeof t.homeX !== 'number' || !warMap) return;
      document.getElementById('warMap').scrollIntoView({ behavior:'smooth', block:'center' });
      warMap.setView(MC.toLatLng(t.homeX, t.homeZ), 0);
      /* Opened after the pan so the popup lands where the eye already is,
         rather than appearing off-screen and pulling the map after it. */
      setTimeout(function(){
        L.popup({ maxWidth: 320 })
          .setLatLng(MC.toLatLng(t.homeX, t.homeZ))
          .setContent(townPopup(t)).openOn(warMap);
      }, 420);
    });
  });
  /* Redrawn in place rather than re-rendering the page: a full render would
     rebuild the map from scratch and throw away wherever you had panned to,
     which makes toggling a layer feel like losing your place. */
  $('body').querySelectorAll('[data-mc]').forEach(function(b){
    b.addEventListener('click', function(){
      mapColour = b.dataset.mc;
      $('body').querySelectorAll('[data-mc]').forEach(function(o){
        o.classList.toggle('on', o.dataset.mc === mapColour); });
      drawWarMap(true);
    });
  });
  $('body').querySelectorAll('[data-layer]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.dataset.layer;
      warShow[k] = !warShow[k];
      b.classList.toggle('on', warShow[k]);
      drawWarMap(true);
    });
  });

  var hl = $('hideLapsed');
  if (hl) hl.addEventListener('change', function(){ hideLapsed = hl.checked; render(); });
  var rs = $('rosterSearch');
  if (rs) rs.addEventListener('input', function(){
    rosterQ = rs.value;
    var at = rs.selectionStart;
    render();
    /* Focus and caret restored by hand: the table is re-rendered from scratch
       on every keystroke, which would otherwise drop the cursor after one
       letter and make the field unusable. */
    var again = $('rosterSearch');
    if (again){ again.focus(); try { again.setSelectionRange(at, at); } catch (e) {} }
  });

  $('body').querySelectorAll('[data-town]').forEach(function(tr){
    tr.addEventListener('click', function(){
      openTown = openTown === tr.dataset.town ? null : tr.dataset.town;
      render();
    });
  });

  var wb = $('watchBtn');
  wb.hidden = !intel.canWatch;
  wb.textContent = intel.watched ? 'Stop watching' : 'Watch this nation';
  /* Said at the button, because "watch" on its own sounds like it might do
     something to the nation rather than to our own records. */
  wb.title = intel.watched
    ? 'Stop keeping a daily record of this nation'
    : 'Keep a row a day for this nation, so a trend exists to look at later';
}

function renderWatchlist(){
  var host = $('watchlist');
  host.innerHTML =
    '<span class="w' + (view === 'watch' ? ' on' : '') + '" data-view="watch">The watch list' +
      (watching.length ? ' · ' + watching.length : '') + '</span>' +
    (intel ? '<span class="w' + (view === 'nation' ? ' on' : '') + '" data-view="nation">' +
      esc(intel.nation.name) + '</span>' : '');
  host.querySelectorAll('[data-view]').forEach(function(el){
    el.addEventListener('click', function(){ view = el.dataset.view; render(); });
  });
}

/* What watching is FOR, said once where it is decided.
 *
 * It was a button with no stated consequence, which is a fair thing to be
 * suspicious of. It does exactly one thing: records a row a day for that
 * nation so the trend exists later. Nothing about the live assessment changes
 * — an unwatched nation gives you the same report this second. What it cannot
 * give you is last week. */
function renderOverview(){
  if (!overview){ return '<p class="empty">Loading the watch list&hellip;</p>'; }
  var us = overview.us;
  var out = '<div class="section-head"><h2>The watch list</h2>' +
    '<span class="meta">measured against us · a row a day is kept for each</span></div>';

  if (!overview.rows.length){
    return out + '<p class="empty">Nothing watched yet. Assess a nation and press ' +
      '<b>Watch</b> to start keeping a daily record of it — that is all watching does, ' +
      'and it is the only way to have a trend to look at later.</p>';
  }

  var pct = function(v){
    if (v == null) return '<span style="color:var(--text-low)">—</span>';
    var col = v >= 100 ? 'var(--red)' : v >= 60 ? 'var(--gold)' : 'var(--text-mid)';
    return '<span style="color:' + col + '">' + v + '%</span>';
  };
  var delta = function(d){
    if (d == null) return '';
    var col = d > 0 ? 'var(--green)' : d < 0 ? 'var(--red)' : 'var(--text-low)';
    return ' <span style="color:' + col + ';font-size:.64rem">' +
      (d > 0 ? '+' : '') + num(d) + '</span>';
  };

  out += '<div class="tablewrap"><table><thead><tr>' +
    '<th>Nation</th><th style="text-align:right">Towns</th>' +
    '<th style="text-align:right">Residents</th><th style="text-align:right">Chunks</th>' +
    '<th style="text-align:right">vs us</th><th></th>' +
    '</tr></thead><tbody>' +
    (us ? '<tr style="background:rgba(24,157,77,.08)">' +
      '<td class="name" style="color:var(--green)">' + esc(us.name) + ' (us)</td>' +
      '<td class="n">' + num(us.towns) + '</td>' +
      '<td class="n">' + num(us.residents) + '</td>' +
      '<td class="n">' + num(us.chunks) + '</td>' +
      '<td class="n">—</td><td></td></tr>' : '') +
    overview.rows.map(function(r){
      if (r.missing){
        return '<tr class="unknown"><td class="name">' + esc(r.name) + '</td>' +
          '<td colspan="5">no longer exists on the server</td></tr>';
      }
      var c = r.change;
      return '<tr>' +
        '<td class="name">' + esc(r.name) + '</td>' +
        '<td class="n">' + num(r.towns) + (c ? delta(c.towns) : '') + '</td>' +
        '<td class="n">' + num(r.residents) + (c ? delta(c.residents) : '') + '</td>' +
        '<td class="n">' + num(r.chunks) + (c ? delta(c.chunks) : '') + '</td>' +
        '<td class="n">' + pct(r.vsChunks) + '</td>' +
        '<td><button class="btn" type="button" data-assess="' + esc(r.name) + '" ' +
          'style="padding:.2rem .5rem;font-size:.64rem">Assess</button></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="note">The vs column is their claimed land as a share of ours. Deltas are ' +
    'the change across however many days have been recorded — which is why watching ' +
    'exists: a live reading cannot tell you a nation has been shedding towns for a ' +
    'fortnight.</p>';
  return out;
}

/* The map.
 *
 * Purpose-built rather than reusing map.html: that page carries region
 * editing, highways, the expansion planner and ten thousand lines of tooling
 * none of which belongs in an intelligence view. What IS reused is the part
 * that matters — the same squaremap tiles, the same projection, the same
 * chunk-to-block maths — so the two agree about where things are.
 */
/* Chunk list to outline rings.
 *
 * Every chunk contributes four edges; an edge shared by two chunks is interior
 * and cancels out. What is left is the boundary, which is then chained into
 * loops. Handles holes and disconnected pieces for free, because both are
 * simply more loops.
 *
 * Directions are kept consistent (each edge walked clockwise around its own
 * chunk) so that chaining never has to guess which way round a loop goes. */
function traceChunks(claims){
  if (!claims || !claims.length) return [];
  var edges = new Map();
  var key = function(a, b){ return a[0] + ',' + a[1] + '>' + b[0] + ',' + b[1]; };

  claims.forEach(function(c){
    var x = c[0] * 16, z = c[1] * 16, X = x + 16, Z = z + 16;
    [[[x,z],[X,z]], [[X,z],[X,Z]], [[X,Z],[x,Z]], [[x,Z],[x,z]]].forEach(function(e){
      /* If the reverse of this edge is already present, the two chunks share
         it — drop both rather than storing an interior line. */
      var rev = key(e[1], e[0]);
      if (edges.has(rev)) edges.delete(rev);
      else edges.set(key(e[0], e[1]), e);
    });
  });

  var byStart = new Map();
  edges.forEach(function(e){
    var k = e[0][0] + ',' + e[0][1];
    if (!byStart.has(k)) byStart.set(k, []);
    byStart.get(k).push(e);
  });

  var rings = [], guard = 0;
  edges.forEach(function(start){
    if (start.used || guard++ > 20000) return;
    var ring = [start[0]], cur = start;
    cur.used = true;
    while (guard++ < 200000){
      ring.push(cur[1]);
      var next = (byStart.get(cur[1][0] + ',' + cur[1][1]) || [])
        .filter(function(e){ return !e.used; })[0];
      if (!next) break;
      next.used = true;
      cur = next;
      if (cur[1][0] === ring[0][0] && cur[1][1] === ring[0][1]){ ring.push(cur[1]); break; }
    }
    if (ring.length > 3) rings.push(ring);
  });
  return rings;
}

function fallColour(t){
  if (t.daysLeft === null) return '#5a5245';          // unseen, not safe or unsafe
  if (t.daysLeft <= 7)  return '#cf2029';
  if (t.daysLeft <= 14) return '#e06c1f';
  if (t.daysLeft <= 28) return '#edb912';
  return '#189d4d';
}

function sizeColour(t){
  var c = t.chunks || 0;
  return c >= 500 ? '#cf2029' : c >= 200 ? '#edb912' : c >= 60 ? '#189d4d' : '#3f7fb8';
}

function townColour(t){
  if (mapColour === 'size') return sizeColour(t);
  if (mapColour === 'chain'){
    /* Three states, not two. A town already OUT of range is a different
       situation from one that merely holds the chain — it is the emergency,
       because it is losing nation status now rather than if something else
       falls. Grey for "nothing depends on it" is the common case and should
       recede. */
    if (t.stranded === -1) return '#cf2029';        // already disconnected
    if (t.chainCritical) return '#edb912';          // others depend on it
    return '#4a4238';
  }
  return fallColour(t);
}

function townPopup(t){
  var row = function(k, v){
    return '<div class="r"><span>' + esc(k) + '</span><span>' + v + '</span></div>';
  };
  var holders = (t.roster || []).filter(function(r){
    return r.idleDays !== null && r.idleDays < 42; });

  /* Who is most likely to end up with this town.
   *
   * Stated as what it is — the resident who has been on most recently — and
   * not dressed up as a prediction. Towny hands a fallen town to nobody; what
   * actually happens is whoever is around claims it. The newest login is the
   * best available proxy for that and the honest label for it is "most active
   * resident", not "most likely to get it". */
  var likely = holders.length ? holders[0] : null;

  return '<div class="wpop"><h4>' + esc(t.name) +
    (t.isCapital ? ' <span style="color:var(--gold);font-size:.7rem">capital</span>' : '') +
    '</h4>' +
    row('Falls in', t.daysLeft === null ? 'unknown'
      : '<b style="color:' + fallColour(t) + '">' + t.daysLeft + ' days</b>') +
    row('Residents', t.residents + (t.holders != null ? ' (' + t.holders + ' holding)' : '')) +
    row('Chunks', num(t.chunks) + (t.maxChunks ? ' of ' + num(t.maxChunks) : '')) +
    (t.maxChunks && t.chunks > t.maxChunks
      ? row('Over the limit', '<b style="color:var(--red)">' +
          num(t.chunks - t.maxChunks) + '</b>') : '') +
    row('Bank', num(t.balance) + 'g') +
    row('Mayor', esc(t.mayor || '—')) +
    (likely ? row('Most active', esc(likely.name) + ' · ' +
      (likely.online ? 'on now' : likely.idleDays + 'd')) : '') +
    (t.chainCritical
      ? '<div class="r" style="color:var(--gold)"><span>Holds the chain</span>' +
        '<span>' + t.stranded + ' town(s) beyond it</span></div>' : '') +
    '<div style="margin-top:.4rem;font-family:var(--data);font-size:.64rem">' +
      (t.isOpen ? '<span style="color:var(--green)">open</span> ' : '') +
      (t.isOverClaimed ? '<span style="color:var(--red)">overclaimable now</span> ' : '') +
      (t.known < t.residents
        ? '<span style="color:var(--text-low)">' + (t.residents - t.known) + ' unseen</span>' : '') +
    '</div></div>';
}

function drawWarMap(keepView){
  var host = document.getElementById('warMap');
  if (!host || !intel || typeof L === 'undefined') return;

  /* keepView redraws into the existing map instead of rebuilding it, so
     toggling a layer does not throw away wherever you had panned to. */
  var saved = keepView && warMap ? { c: warMap.getCenter(), z: warMap.getZoom() } : null;
  if (warMap){ warMap.remove(); warMap = null; }

  warMap = L.map(host, {
    crs: L.CRS.Simple, minZoom: -6, maxZoom: 2,
    zoomSnap: 1, zoomDelta: 1, wheelPxPerZoomLevel: 120,
    attributionControl: false, preferCanvas: true,
  });

  if (warShow.terrain){
    L.tileLayer('https://map.earthmc.net/tiles/minecraft_overworld/{z}/{x}_{y}.png', {
      /* 512 with offset 5 — squaremap's real tile size, so one image pixel is
         one display pixel. The old 2048/3 pairing stretched every tile 4x and
         cost sixteen times the pixel area for detail the file never had. */
      tileSize: 512, zoomOffset: 5, minNativeZoom: 0, maxNativeZoom: 5,
      /* minZoom and maxZoom HERE mean "hide this layer outside this range",
         which is a different thing from the map's own zoom limits. Leaving
         them out meant minZoom defaulted to 0 — so the terrain was switched
         off at every negative zoom, which is every zoom wide enough to see a
         nation. It only appeared once you had zoomed past 0, which is exactly
         the symptom. minNativeZoom below is the separate setting that stops it
         FETCHING folders that do not exist. */
      minZoom: -7, maxZoom: 2,
      noWrap: true, opacity: 0.55, keepBuffer: 1,
      updateWhenZooming: false,
      errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
    }).addTo(warMap);
  }

  var bounds = [];

  (intel.towns || []).forEach(function(t){
    var claims = t.claims || [];
    if (!claims.length) return;
    var col = townColour(t);
    var popup = townPopup(t);

    claims.forEach(function(c){
      bounds.push([-(c[1] * 16), c[0] * 16], [-(c[1] * 16 + 16), c[0] * 16 + 16]);
    });

    if (warShow.outlines){
      traceChunks(claims).forEach(function(ring){
        L.polygon(ring.map(function(pt){ return MC.toLatLng(pt[0], pt[1]); }), {
          color: col, weight: 1.8, opacity: 0.95,
          fillColor: col, fillOpacity: 0.28,
          /* Clickable. The outline is the town as far as anyone looking at
             this map is concerned, so clicking the shape has to do what
             clicking the dot does — hunting for a 4px marker inside a large
             territory is not a thing anyone should have to do. */
          interactive: true, bubblingMouseEvents: false,
        }).bindPopup(popup, { maxWidth: 320 }).addTo(warMap);
      });
    }

    /* Individual chunks, off by default. Only useful once you are zoomed into
       a border — at nation scale they are sub-pixel and cost thousands of
       paths for nothing. */
    if (warShow.chunks){
      claims.forEach(function(c){
        var x = c[0] * 16, z = c[1] * 16;
        L.rectangle([MC.toLatLng(x, z), MC.toLatLng(x + 16, z + 16)], {
          color: col, weight: 0.5, opacity: 0.45, fill: false,
          interactive: false,
        }).addTo(warMap);
      });
    }

    if (typeof t.homeX === 'number'){
      if (warShow.markers){
        L.circleMarker(MC.toLatLng(t.homeX, t.homeZ), {
          radius: t.isCapital ? 7 : (t.chainCritical ? 6 : 4),
          color: t.chainCritical ? '#edb912' : (t.isCapital ? '#f4efe4' : col),
          weight: t.chainCritical ? 3 : 1.5,
          fillColor: col, fillOpacity: 1,
          bubblingMouseEvents: false,
        }).bindPopup(popup, { maxWidth: 320 })
          .bindTooltip(esc(t.name) + (t.daysLeft === null ? '' : ' · ' + t.daysLeft + 'd'),
            { direction: 'top' })
          .addTo(warMap);
      }
      if (warShow.labels){
        L.marker(MC.toLatLng(t.homeX, t.homeZ), {
          interactive: false,
          icon: L.divIcon({
            className: '',
            html: '<div style="font-family:Martian Mono,monospace;font-size:10px;' +
              'color:#f4efe4;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;' +
              'transform:translate(-50%,-160%)">' + esc(t.name) + '</div>',
          }),
        }).addTo(warMap);
      }
    }
  });

  if (warShow.range){
    /* ONE merged frontier, not a circle per town.
     *
     * Sixty overlapping dashed rings is a scribble — and worse, it is a
     * misleading one: it suggests the towns each hold a separate bubble when
     * what actually exists is a single connected area. The union is the real
     * shape, and the real question (can a town at X join) is answered by
     * whether X is inside it. */
    var merged = null;
    try {
      (intel.towns || []).forEach(function(t){
        if (typeof t.homeX !== 'number') return;
        var r = t.isCapital ? 5000 : 1500, pts = [];
        for (var i = 0; i < 40; i++){
          var a = (i / 40) * Math.PI * 2;
          pts.push([t.homeX + Math.cos(a) * r, -(t.homeZ + Math.sin(a) * r)]);
        }
        pts.push(pts[0]);
        var disc = turf.polygon([pts]);
        merged = merged ? turf.union(merged, disc) : disc;
      });
    } catch (e) { merged = null; }

    if (merged){
      var polys = merged.geometry.type === 'MultiPolygon'
        ? merged.geometry.coordinates : [merged.geometry.coordinates];
      polys.forEach(function(poly){
        (poly || []).forEach(function(ring, i){
          if (!ring || ring.length < 4) return;
          L.polygon(ring.map(function(pt){ return L.latLng(pt[1], pt[0]); }), {
            color: '#edb912', weight: i === 0 ? 2.4 : 1.2, opacity: 1,
            dashArray: i === 0 ? null : '4 4',
            fill: i === 0, fillColor: '#edb912', fillOpacity: 0.04,
            interactive: false,
          }).addTo(warMap);
        });
      });
    } else {
      (intel.towns || []).forEach(function(t){
        if (typeof t.homeX !== 'number') return;
        L.circle(MC.toLatLng(t.homeX, t.homeZ), {
          radius: t.isCapital ? 5000 : 1500,
          color: '#edb912', weight: 1, opacity: 0.4, fill: false,
          interactive: false,
        }).addTo(warMap);
      });
    }
  }

  if (saved) warMap.setView(saved.c, saved.z);
  else if (bounds.length) warMap.fitBounds(L.latLngBounds(bounds).pad(0.08));
  else warMap.setView([0, 0], -4);

  var legend = document.getElementById('mapLegend');
  if (legend){
    var key = mapColour === 'size'
      ? [['#3f7fb8','under 60 chunks'],['#189d4d','60–200'],['#edb912','200–500'],['#cf2029','500+']]
      : mapColour === 'chain'
      ? [['#cf2029','already out of range'],['#edb912','holds the chain up'],
         ['#4a4238','nothing depends on it']]
      : [['#cf2029','falls within a week'],['#e06c1f','within two'],
         ['#edb912','within a month'],['#189d4d','longer'],['#5a5245','unseen']];
    legend.innerHTML = key.map(function(k){
      return '<span><em style="background:' + k[0] + '"></em>' + esc(k[1]) + '</span>';
    }).join('') + '<span style="margin-left:auto">click a town or its border</span>';
  }
}

async function assess(){
  var name = $('nationInput').value.trim();
  if (!name) return;
  $('body').innerHTML = '<p class="empty">Reading every town and every resident of ' +
    esc(name) + '&hellip; this one is slow on purpose.</p>';
  $('stamp').textContent = 'working';
  try {
    intel = await api('/api/war/nation?name=' + encodeURIComponent(name));
    view = 'nation';
    openTown = null;
    render();
    $('stamp').textContent = 'live from EarthMC · ' + new Date().toLocaleTimeString('en-GB',
      { hour:'2-digit', minute:'2-digit' });
  } catch (e){
    intel = null;
    $('body').innerHTML = '<p class="empty" style="color:var(--red);border-color:var(--red-dim)">' +
      esc(e.code === 'no_such_nation' ? 'No nation by that name.' : e.message) + '</p>';
    $('stamp').textContent = 'failed';
  }
}

async function loadWatch(){
  try { watching = (await api('/api/war/watch')).watching || []; renderWatchlist(); }
  catch (e) { /* not a manager, or the migration has not run */ }
}

async function load(){
  try { me = await api('/api/me'); } catch (e) { me = null; }
  renderAuth();
  if (!me || !me.signedIn || ['treasurer','manager'].indexOf(me.tier) < 0){
    $('body').innerHTML = '<p class="empty">The War Department is for treasurers and managers.</p>';
    $('stamp').textContent = 'not authorised';
    return;
  }
  await loadWatch();
  try { overview = await api('/api/war/overview'); }
  catch (e) { overview = { rows: [], us: null }; }
  render();
  $('stamp').textContent = 'ready';
}

$('goBtn').addEventListener('click', assess);
$('nationInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') assess(); });
$('watchBtn').addEventListener('click', async function(){
  if (!intel) return;
  try {
    await api('/api/war/watch', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ nation: intel.nation.name, remove: intel.watched }) });
    intel.watched = !intel.watched;
    await loadWatch();
    try { overview = await api('/api/war/overview'); } catch (e) {}
    render();
  } catch (e){ window.alert('Could not change the watch list: ' + e.message); }
});

load().catch(function(e){
  $('body').innerHTML = '<p class="empty" style="color:var(--red)">This page failed to load: ' +
    esc(e && e.message) + '</p>';
});
</script>
